function downloadExcel(filename, rows) {
  if (!rows.length) return false;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Datos");
  XLSX.writeFile(wb, filename);
  return true;
}

function buildOCRows(ordenes) {
  return ordenes.map((o) => ({
    "N° OC": o.numero_oc, Proveedor: o.proveedores ? o.proveedores.razon_social : "",
    RUT: o.proveedores ? o.proveedores.rut : "", Fecha: o.fecha, "Centro Costo": o.centro_costo_codigo,
    "Cuenta Contable": o.cuenta_contable_codigo, Proyecto: o.proyectos ? o.proyectos.nombre : "",
    Moneda: o.moneda || "CLP", "Monto Neto": o.monto_neto, "Monto Total": o.monto_total, Estado: o.estado,
  }));
}

function buildHESRows(ordenes) {
  return ordenes.filter((o) => o.numero_hes || o.numero_egreso).map((o) => ({
    "N° OC": o.numero_oc, "N° HES": o.numero_hes, "N° Egreso": o.numero_egreso,
    Proveedor: o.proveedores ? o.proveedores.razon_social : "", Fecha: o.fecha, Moneda: o.moneda || "CLP", "Monto Total": o.monto_total, Estado: o.estado,
  }));
}

function buildFacturasRows(ordenes) {
  return ordenes.filter((o) => o.numero_factura).map((o) => ({
    "N° Factura": o.numero_factura, "N° OC": o.numero_oc,
    Proveedor: o.proveedores ? o.proveedores.razon_social : "", Fecha: o.fecha, Moneda: o.moneda || "CLP", "Monto Total": o.monto_total, Estado: o.estado,
  }));
}

function buildProveedoresRows(proveedores) {
  return proveedores.map((p) => ({
    "Razón Social": p.razon_social, RUT: p.rut, Documento: p.tipo_documento, "Tamaño Empresa": p.tamano_empresa,
    "Giro Comercial": p.giro_comercial, "Dirección Comercial": p.direccion_comercial, "Depto/Oficina": p.departamento_oficina,
    Región: p.region, Ciudad: p.ciudad, Teléfono: p.telefono, "Sitio Web": p.sitio_web,
    "Nombre Contacto": p.contacto_nombre, "Apellido Contacto": p.contacto_apellido,
    "Teléfono Contacto": p.contacto_telefono, "Celular Contacto": p.contacto_celular, "Correo Contacto": p.contacto_correo,
    Banco: p.banco, "Tipo Cuenta": p.tipo_cuenta, "N° Cuenta": p.numero_cuenta,

}

  const ocRows = useMemo(() => buildOCRows(ordenes), [ordenes]);
  const hesRows = useMemo(() => buildHESRows(ordenes), [ordenes]);
  const facturasRows = useMemo(() => buildFacturasRows(ordenes), [ordenes]);

const USUARIO_BLANK = { nombre: "", apellido: "", usuario: "", nivel_aprobacion: "0", password: "", empresa_id: null, proyecto_id: null, centro_costo_codigo: null, cuenta_contable_codigo: null, proveedor_ids: [] };

// Unico usuario con acceso completo a Administracion -- debe coincidir con
// SUPERADMIN en api/usuarios.js. El resto solo ve/edita su propia cuenta.
const SUPERADMIN = "amelendez@patagonica.cl";

function MiCuentaPanel({ currentUser, usuarios, notify }) {
  const miUsuario = usuarios.find((u) => u.id === currentUser.id);
  const [password, setPassword] = useState("");
  const [password2, setPassword2] = useState("");
  const [saving, setSaving] = useState(false);

  const guardar = async () => {
    if (!password || password.length < 6) return notify("err", "La contraseña debe tener al menos 6 caracteres");
    if (password !== password2) return notify("err", "Las contraseñas no coinciden");
    setSaving(true);
    try {
      await api("usuarios?id=" + currentUser.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      notify("ok", "Contraseña actualizada");
      setPassword("");
      setPassword2("");
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "page fade-up" },
    h("div", { className: "card", style: { maxWidth: 420 } },
      h("h2", null, "Mi Cuenta"),
      h(Field, { label: "Nombre" }, h("div", null, miUsuario ? (miUsuario.nombre + " " + miUsuario.apellido) : "—")),
      h(Field, { label: "Usuario" }, h("div", null, miUsuario ? miUsuario.usuario : "—")),
      h("div", { className: "section-lbl" }, "Cambiar contraseña"),
      h(Field, { label: "Nueva contraseña" }, h("input", { type: "password", value: password, onChange: (e) => setPassword(e.target.value) })),
      h(Field, { label: "Confirmar contraseña" }, h("input", { type: "password", value: password2, onChange: (e) => setPassword2(e.target.value) })),
      h("div", { style: { display: "flex", justifyContent: "flex-end", marginTop: 12 } },
        h("button", { className: "btn-primary", onClick: guardar, disabled: saving }, saving ? "Guardando..." : "Guardar"),
      ),
    ),
  );
}

function UsuarioModal({ onClose, onSaved, notify, editUsuario, empresas, proyectosTodos, catalogosTodos, proveedores }) {
  const [form, setForm] = useState(editUsuario
    ? { ...USUARIO_BLANK, ...editUsuario, nivel_aprobacion: String(editUsuario.nivel_aprobacion), password: "" }
    : USUARIO_BLANK);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const isEdit = !!editUsuario;
  // Sin cerrar al hacer clic afuera -- el campo de contraseña puede recibir
  // un clic de un gestor de contraseñas del navegador que cae sobre el fondo
  // y cerraba el formulario a medio llenar. Solo se cierra con Cancelar/×.

  // El select combina "sin restriccion" + cada empresa ("toda la empresa" +
  // sus proyectos activos) en una sola lista, codificando el valor como
  // "empresa:<id>" o "proyecto:<id>" para despues separarlo en empresa_id/
  // proyecto_id reales -- asi el admin elige una sola cosa sin tener que
  // entender el modelo de 2 columnas por detras.
  const accesoValue = form.proyecto_id ? "proyecto:" + form.proyecto_id : (form.empresa_id ? "empresa:" + form.empresa_id : "");
  const onAccesoChange = (e) => {
    const v = e.target.value;
    if (!v) return setForm((f) => ({ ...f, empresa_id: null, proyecto_id: null }));
    const [tipo, id] = v.split(":");
    if (tipo === "empresa") return setForm((f) => ({ ...f, empresa_id: Number(id), proyecto_id: null }));
    const proyecto = (proyectosTodos || []).find((p) => p.id === id);
    setForm((f) => ({ ...f, empresa_id: proyecto ? proyecto.empresa_id : f.empresa_id, proyecto_id: id }));
  };

  const submit = async () => {
    if (!form.nombre || !form.apellido || !form.usuario) {
      notify("err", "Nombre, Apellido y Usuario son obligatorios");
      return;
    }
    setSaving(true);
    try {
      const { usuario } = await api("usuarios" + (isEdit ? "?id=" + editUsuario.id : ""), {
        method: isEdit ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },

function SincronizarAcquisys({ notify, refreshOrdenes, refreshProveedores, empresaId, empresa }) {
  const [acquisysToken, setAcquisysToken] = useState("");
  const ENTITY_IDS_CONOCIDOS = { 1: "4", 2: "6" };
  const [entityId, setEntityId] = useState(ENTITY_IDS_CONOCIDOS[empresaId] || "");
  const [corriendo, setCorriendo] = useState(false);
  const [log, setLog] = useState([]);
  const [progresoPdf, setProgresoPdf] = useState(null);

  const agregarLog = (linea) => setLog((l) => [...l, linea]);

  const sincronizar = async () => {
    if (!acquisysToken.trim()) return notify("err", "Pega el user_token de Acquisys primero");
    if (!entityId.trim()) return notify("err", "Ingresa el entity_id de Acquisys para esta empresa");
    setCorriendo(true);
    setLog([]);
    try {
      agregarLog("Consultando órdenes en Acquisys...");
      const hoy = new Date().toISOString().slice(0, 10);
      const url = "https://acquisysbck.dkohome.cl/admin/order?responsible_id=&gerencia=&status=&date_ini=2015-1-1&date_end=" + hoy + "&entity_id=" + entityId;
      const rAcq = await fetch(url, { headers: { accept: "application/json", user_token: acquisysToken } });
      if (!rAcq.ok) throw new Error("Acquisys respondió " + rAcq.status + " — el user_token puede haber expirado (dura ~24h)");
      const ordenesAcquisys = await rAcq.json();
      agregarLog(ordenesAcquisys.length + " registros recibidos de Acquisys");

      agregarLog("Sincronizando con OCFast (esto puede tardar unos minutos)...");
      const resultado = await api("sync-acquisys", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userToken: acquisysToken, ordenes: ordenesAcquisys, empresaId }),
        timeoutMs: 280000,
      });
      agregarLog(
        "Listo: " + resultado.total + " órdenes procesadas — " +
        resultado.creadas + " nuevas, " + resultado.actualizadas + " actualizadas, " +
        resultado.sinCambios + " sin cambios, " + resultado.errores + " con error"
      );
      if (resultado.errores > 0) {
        resultado.detalleErrores.forEach((e) => agregarLog("  ⚠ " + e.numero_oc + ": " + e.error));
      }
      refreshOrdenes();
      refreshProveedores();

      agregarLog("Generando PDF de OC para las órdenes que aún no lo tienen...");
      const [{ ordenes }, { proveedores }] = await Promise.all([api("ordenes?empresa_id=" + empresaId), api("proveedores")]);
      const pendientes = ordenes.filter((o) => !o.archivo_oc_url);
      let ok = 0, err = 0;
      setProgresoPdf({ actual: 0, total: pendientes.length });
      for (const orden of pendientes) {
        const proveedor = proveedores.find((p) => p.id === orden.proveedor_id);
        if (!proveedor) { err++; setProgresoPdf({ actual: ok + err, total: pendientes.length }); continue; }
        try {
          const pdfBlob = await generarPdfOC(orden, proveedor, orden.cuotas || [], empresa);
          const pdfBase64 = await fileToBase64(new File([pdfBlob], "OC.pdf", { type: "application/pdf" }));
          const up = await api("upload", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: orden.numero_oc + ".pdf", base64: pdfBase64 }),
          });
          await api("ordenes?id=" + orden.id, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ archivo_oc_url: up.url, archivo_oc_nombre: orden.numero_oc + ".pdf" }),
          });
          ok++;
        } catch (e) { err++; }
        setProgresoPdf({ actual: ok + err, total: pendientes.length });
      }
      setProgresoPdf(null);
      agregarLog("PDFs de OC generados: " + ok + (err ? " (" + err + " con error)" : ""));
      refreshOrdenes();
      notify("ok", "Sincronización con Acquisys completada");
    } catch (e) {
      agregarLog("ERROR: " + e.message);
      notify("err", e.message);
    } finally {
      setCorriendo(false);
    }
  };

  return h("div", { className: "card", style: { marginTop: 20 } },
    h("h2", null, "Sincronizar con Acquisys"),
    h("p", { className: "hint", style: { marginBottom: 12 } },
      "Trae órdenes nuevas o desactualizadas desde Acquisys (proveedor, montos, HES, factura, cuotas y archivos), sin pisar datos ya cargados en OCFast."),
    h("div", { className: "row-inline" },
      h("input", {
        value: acquisysToken, onChange: (e) => setAcquisysToken(e.target.value),
        placeholder: "Pega aquí el user_token de Acquisys (F12 → Network → header user_token)",
        style: { flex: 1 }, disabled: corriendo,
      }),
      h("input", {
        value: entityId, onChange: (e) => setEntityId(e.target.value),
        placeholder: "entity_id", style: { width: 90 }, disabled: corriendo,
      }),
      h("button", { className: "btn-primary", onClick: sincronizar, disabled: corriendo }, corriendo ? "Sincronizando..." : "Sincronizar"),
    ),
    log.length > 0 && h("pre", {
      style: {
        marginTop: 14, background: "var(--surf2)", border: "1px solid var(--bdr)", borderRadius: 8,
        padding: 12, fontSize: 11.5, maxHeight: 220, overflow: "auto", whiteSpace: "pre-wrap",
      },
    }, log.join("\n") + (progresoPdf ? "\nGenerando PDF " + progresoPdf.actual + " de " + progresoPdf.total + "..." : "")),
  );
}

// ===== Menú Proyectos (Fase 1) =====
// Ficha de proyecto sobre el catálogo `proyectos` (el mismo de Nueva OC) +
// tareas + bitácora. El proyecto ES la Orden de Trabajo (OTGL-006) y sus
// tareas cuelgan de él (OTGL-006-01). Sin aprobaciones propias: el gasto sale de
// las OC del proyecto, convertido a UF (neto). Ver
// docs/superpowers/specs/2026-10-08-proyectos-fase1-design.md.
const ESTADOS_PROYECTO = ["Planificado", "En ejecución", "Pausado", "En recepción", "Cerrado", "Cancelado"];
const ESTADOS_OT = ["Pendiente", "En ejecución", "Terminada", "Cancelada"];
const TIPOS_PROYECTO = ["Obra", "Mantención", "Habilitación", "TI", "Otro"];
const PRIORIDADES = ["Alta", "Media", "Baja"];

function proyectoPill(estado) {
  const map = {
    "Planificado": "pill-draft", "En ejecución": "pill-info", "Pausado": "pill-pend",
    "En recepción": "pill-pend", "Cerrado": "pill-ok", "Cancelado": "pill-anul",
    "Pendiente": "pill-draft", "Terminada": "pill-ok", "Cancelada": "pill-anul",
  };
  return h("span", { className: "pill " + (map[estado] || "pill-draft") }, estado || "—");
}

function fmtUF(v, decimales) {
  if (v === null || v === undefined || v === "" || isNaN(Number(v))) return "—";
  return "UF " + Number(v).toLocaleString("es-CL", { maximumFractionDigits: decimales === undefined ? 2 : decimales });
}

// Misma regla que la función sugerir_sigla_proyecto de la BD: 2 primeras
// letras de la primera palabra distintiva (Glamping -> GL, Remodelación El
// Cortijo -> CO, Habilitación Edificio 57 -> ED).
const SIGLA_STOP = ["EL", "LA", "LOS", "LAS", "DE", "DEL", "Y", "EN", "AL", "UN", "UNA", "PROYECTO", "OBRA", "OBRAS",
  "REMODELACION", "HABILITACION", "MANTENCION", "CONSTRUCCION", "INSTALACION", "AMPLIACION", "REPARACION", "MEJORAMIENTO"];
function sugerirSiglaProyecto(nombre) {
  const v = (nombre || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  const w = v.split(/[^A-Z0-9]+/).find((x) => x.length >= 2 && /^[A-Z]/.test(x) && !SIGLA_STOP.includes(x));
  if (w) return w.slice(0, 2);
  const letras = v.replace(/[^A-Z]/g, "");
  return letras.length >= 2 ? letras.slice(0, 2) : "";
}

function hoyISO() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Santiago" });
}

function pctConsumo(p) {
  if (!p.presupuesto_uf || Number(p.presupuesto_uf) <= 0) return null;
  return (p.comprometido_uf || 0) / Number(p.presupuesto_uf) * 100;
}

function colorConsumo(pct) {
  if (pct === null) return "var(--txd)";
  if (pct >= 100) return "var(--red)";
  if (pct >= 80) return "var(--amber)";
  return "var(--green)";
}

// Barra compacta para tablas: % de avance o % del presupuesto consumido.
function MiniBarra({ pct, color }) {
  if (pct === null || pct === undefined) return h("span", { style: { color: "var(--txd)" } }, "—");
  const ancho = Math.max(0, Math.min(100, pct));
  return h("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
    h("div", { style: { width: 70, height: 6, borderRadius: 3, background: "var(--surf3)", overflow: "hidden" } },
      h("div", { style: { width: ancho + "%", height: "100%", background: color || "var(--acc)" } })),
    h("span", { style: { fontWeight: 600, color: color || "var(--tx)" } }, Math.round(pct) + "%"),
  );
}

function nombreEjecutor(x) {
  if (!x) return "—";
  if (x.ejecutor_tipo === "contratista") return x.proveedores ? x.proveedores.razon_social : "Contratista";
  if (x.ejecutor_tipo === "interno") return (x.ejecutor_interno || "Interno") + " (interno)";
  return "—";
}

function nombreUsuario(usuarios, correo) {
  if (!correo) return "—";
  const u = (usuarios || []).find((x) => x.usuario === correo);
  return u ? ((u.nombre || "") + " " + (u.apellido || "")).trim() || correo : correo;
}

function proyectoFormDesde(p) {
  const v = (k) => (p && p[k] !== null && p[k] !== undefined ? p[k] : "");

          h("input", { type: "number", min: 0, max: 100, value: form.avance_pct, onChange: set("avance_pct"), style: { width: 70 } }))),
      h("div"),
    ),
    h("div", { className: "grid2" },
      h(Field, { label: "Inicio planificado" }, h("input", { type: "date", value: form.fecha_inicio_plan, onChange: set("fecha_inicio_plan") })),
      h(Field, { label: "Término planificado" }, h("input", { type: "date", value: form.fecha_termino_plan, onChange: set("fecha_termino_plan") })),
      h(Field, { label: "Inicio real" }, h("input", { type: "date", value: form.fecha_inicio_real, onChange: set("fecha_inicio_real") }),
        h("div", { className: "hint" }, "Se completa sola al pasar a \"En ejecución\" si está vacía.")),
      h(Field, { label: "Término real" }, h("input", { type: "date", value: form.fecha_termino_real, onChange: set("fecha_termino_real") }),
        h("div", { className: "hint" }, "Se completa sola al pasar a \"Cerrado\" si está vacía.")),
    ),
  );
}

function validarEjecutor(form, notify) {
  if (form.sigla && !/^[A-Z]{2,4}$/.test(form.sigla)) {
    notify("err", "La sigla debe tener entre 2 y 4 letras");
    return false;
  }
  if (form.ejecutor_tipo === "contratista" && !form.ejecutor_proveedor_id) {
    notify("err", "Selecciona el contratista desde el catálogo de proveedores");
    return false;
  }
  return true;
}

function NuevoProyectoModal({ empresaId, proveedores, usuarios, ufHoy, notify, onClose, onCreado }) {
  const [form, setForm] = useState(proyectoFormDesde(null));
  const [saving, setSaving] = useState(false);
  const guardar = async () => {
    if (!form.nombre.trim()) return notify("err", "Ingresa el nombre del proyecto");
    if (!validarEjecutor(form, notify)) return;
    setSaving(true);
    try {
      const { proyecto } = await api("proyectos-seguimiento", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, empresa_id: empresaId }),
      });
      notify("ok", "Proyecto " + proyecto.codigo + " creado");
      onCreado(proyecto);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };
  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 760 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, "Nuevo Proyecto"),
        h("button", { className: "modal-close", onClick: onClose }, "×")),
      h("div", { className: "hint", style: { marginBottom: 12, fontSize: 11.5 } },
        "El código de la Orden de Trabajo (OT + sigla + correlativo, ej. OTGL-006) se asigna solo al crear. El proyecto quedará disponible también en el campo \"Proyecto\" de Nueva OC."),
      h(ProyectoForm, { form, setForm, proveedores, usuarios, esPermanente: false, ufHoy, sugerirSigla: true }),
      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 8 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", { className: "btn-primary", onClick: guardar, disabled: saving }, saving ? "Guardando..." : "Crear proyecto")),
    ));
}

function otFormDesde(ot) {
  const v = (k) => (ot && ot[k] !== null && ot[k] !== undefined ? ot[k] : "");
  return {
    descripcion: v("descripcion"), ubicacion: v("ubicacion"), responsable: v("responsable"),
    ejecutor_tipo: v("ejecutor_tipo"), ejecutor_proveedor_id: v("ejecutor_proveedor_id"), ejecutor_interno: v("ejecutor_interno"),
    fecha_inicio: ot ? v("fecha_inicio") : hoyISO(), fecha_limite: v("fecha_limite"), fecha_culminacion: v("fecha_culminacion"),
    estado: ot ? ot.estado : "Pendiente",
  };
}

// Hilo de bitácora (comentarios + eventos automáticos del sistema).
function BitacoraHilo({ entradas, ots, alto }) {
  const codigoOt = (id) => { const o = (ots || []).find((x) => x.id === id); return o ? o.codigo : "Tarea"; };
  return h("div", { style: { maxHeight: alto || 360, overflowY: "auto", border: "1px solid var(--bdr)", borderRadius: 8, padding: "10px 12px", marginBottom: 10, background: "var(--surf)" } },
    entradas.length === 0
      ? h("div", { className: "hint" }, "Todavía no hay registros.")
      : entradas.map((b) => h("div", { key: b.id, style: { marginBottom: 10, fontSize: 12.5 } },
          h("div", { style: { color: "var(--txm)", fontSize: 10.5, display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" } },
            (b.usuario || "—") + " · " + new Date(b.created_at).toLocaleString("es-CL"),
            ots && b.ot_id && h("span", { className: "pill pill-info", style: { fontSize: 9.5, padding: "1px 7px" } }, codigoOt(b.ot_id))),
          h("div", { style: b.tipo === "sistema" ? { color: "var(--txm)", fontStyle: "italic" } : null },
            (b.tipo === "sistema" ? "⚙ " : "") + b.texto),
        )),
  );
}

function AgregarComentario({ proyectoId, otId, notify, onAgregado }) {
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const enviar = async () => {
    if (!texto.trim()) return;
    setEnviando(true);
    try {
      const { entrada } = await api("proyectos-seguimiento?bitacora=1", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ proyecto_id: proyectoId, ot_id: otId || null, texto }),
      });
      setTexto("");
      onAgregado(entrada);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setEnviando(false);
    }
  };
  return h("div", { style: { display: "flex", gap: 8 } },
    h("input", {
      value: texto, onChange: (e) => setTexto(e.target.value), placeholder: "Agregar un comentario o avance...",
      style: { flex: 1 }, onKeyDown: (e) => { if (e.key === "Enter") enviar(); },
    }),
    h("button", { className: "btn-ghost", onClick: enviar, disabled: enviando || !texto.trim() }, enviando ? "..." : "Agregar"));
}

function OtModal({ ot, proyectoId, proveedores, bitacora, notify, onClose, onSaved }) {
  const isEdit = !!ot;
  const [form, setForm] = useState(otFormDesde(ot));
  const [saving, setSaving] = useState(false);
  const [entradas, setEntradas] = useState(isEdit ? bitacora.filter((b) => b.ot_id === ot.id) : []);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const guardar = async () => {
    if (!form.descripcion.trim()) return notify("err", "Ingresa la descripción de la tarea");
    if (!validarEjecutor(form, notify)) return;
    setSaving(true);
    try {
      if (isEdit) {
        await api("proyectos-seguimiento?ot_id=" + ot.id, {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form),
        });
        notify("ok", "Tarea " + ot.codigo + " actualizada");
      } else {
        const { ot: nueva } = await api("proyectos-seguimiento?ot=1", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...form, proyecto_id: proyectoId }),
        });
        notify("ok", "Tarea " + nueva.codigo + " creada");
      }
      onSaved();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const eliminar = async () => {
    if (!window.confirm("¿Eliminar la tarea " + ot.codigo + "? Dejará de verse en el proyecto.")) return;
    try {
      await api("proyectos-seguimiento?ot_id=" + ot.id, { method: "DELETE" });
      notify("ok", "Tarea eliminada");
      onSaved();
    } catch (e) {
      notify("err", e.message);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 640 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, isEdit ? "Tarea " + ot.codigo : "Nueva tarea"),
        h("button", { className: "modal-close", onClick: onClose }, "×")),
      h(Field, { label: "Descripción del trabajo *" },
        h("textarea", { rows: 2, value: form.descripcion, onChange: set("descripcion") })),
      h("div", { className: "grid2" },
        h(Field, { label: "Ubicación" }, h("input", { value: form.ubicacion, onChange: set("ubicacion") })),
        h(Field, { label: "Responsable (quién hace el seguimiento)" }, h("input", { value: form.responsable, onChange: set("responsable") })),
        h(EjecutorFields, { form, set, setForm, proveedores }),
      ),
      h("div", { className: "grid2" },
        h(Field, { label: "Fecha inicio" }, h("input", { type: "date", value: form.fecha_inicio, onChange: set("fecha_inicio") })),
        h(Field, { label: "Fecha límite" }, h("input", { type: "date", value: form.fecha_limite, onChange: set("fecha_limite") })),
        h(Field, { label: "Estado" },
          h("select", {
            value: form.estado,
            onChange: (e) => {
              const estado = e.target.value;
              setForm((f) => ({ ...f, estado, fecha_culminacion: estado === "Terminada" && !f.fecha_culminacion ? hoyISO() : f.fecha_culminacion }));
            },
          }, ESTADOS_OT.map((t) => h("option", { key: t, value: t }, t)))),
        h(Field, { label: "Fecha culminación" }, h("input", { type: "date", value: form.fecha_culminacion, onChange: set("fecha_culminacion") })),
      ),
      h("div", { style: { display: "flex", justifyContent: "space-between", gap: 10, marginTop: 8 } },
        isEdit ? h("button", { className: "btn-ghost", onClick: eliminar, style: { color: "var(--red)" } }, "Eliminar tarea") : h("div"),
        h("div", { style: { display: "flex", gap: 10 } },
          h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
          h("button", { className: "btn-primary", onClick: guardar, disabled: saving }, saving ? "Guardando..." : "Guardar"))),
      isEdit && h(React.Fragment, null,
        h("div", { className: "section-lbl" }, "Bitácora de la tarea"),
        h(BitacoraHilo, { entradas, alto: 220 }),
        h(AgregarComentario, {
          proyectoId, otId: ot.id, notify,
          onAgregado: (entrada) => setEntradas((c) => [...c, entrada]),
        })),
    ));
}

function KpiProyecto({ label, valor, sub, color }) {
  return h("div", { className: "stat-item", style: { cursor: "default" } },
    h("div", { className: "stat-num", style: { fontSize: 20, color: color || "var(--tx)" } }, valor),

function ProyectoFicha({ id, proveedores, usuarios, notify, onVolver }) {
  const [data, setData] = useState(null);
  const [tabFicha, setTabFicha] = useState("resumen");
  const [form, setForm] = useState(null);
  const [saving, setSaving] = useState(false);
  const [otEditando, setOtEditando] = useState(null);
  const [otNueva, setOtNueva] = useState(false);

  const cargar = useCallback(() => {
    return api("proyectos-seguimiento?id=" + id)
      .then((d) => { setData(d); setForm(proyectoFormDesde(d.proyecto)); })
      .catch((e) => notify("err", e.message));
  }, [id, notify]);

  useEffect(() => { cargar(); }, [cargar]);

  if (!data || !form) {
    return h("div", { className: "page fade-up" },
      h("div", { className: "card" }, h("div", { style: { display: "flex", gap: 10, alignItems: "center" } }, h("span", { className: "spinner" }), "Cargando proyecto...")));
  }

  const p = data.proyecto;
  const pct = pctConsumo(p);
  const saldo = p.presupuesto_uf ? Number(p.presupuesto_uf) - (p.comprometido_uf || 0) : null;

  const guardar = async () => {
    if (!form.nombre.trim()) return notify("err", "Ingresa el nombre del proyecto");
    if (!validarEjecutor(form, notify)) return;
    setSaving(true);
    try {
      await api("proyectos-seguimiento?id=" + p.id, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(form),
      });
      notify("ok", "Proyecto actualizado");
      await cargar();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const eliminar = async () => {
    if (!window.confirm("¿Eliminar el proyecto " + p.codigo + "? También dejará de aparecer en Nueva OC.")) return;
    try {
      await api("proyectos-seguimiento?id=" + p.id, { method: "DELETE" });
      notify("ok", "Proyecto eliminado");
      onVolver();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const hoy = hoyISO();
  const otColumns = [
    { key: "codigo", label: "Código", render: (o) => h("b", null, o.codigo) },
    { key: "descripcion", label: "Descripción", render: (o) => truncar(o.descripcion || "", 320) },
    { key: "ejecutor", label: "Ejecutor", sortValue: (o) => nombreEjecutor(o), render: (o) => nombreEjecutor(o) },
    { key: "responsable", label: "Responsable", render: (o) => o.responsable || "—" },
    { key: "fecha_inicio", label: "Inicio", render: (o) => fmtDate(o.fecha_inicio) },
    {
      key: "fecha_limite", label: "Fecha límite",
      render: (o) => {
        const vencida = o.fecha_limite && o.fecha_limite < hoy && (o.estado === "Pendiente" || o.estado === "En ejecución");
        return h("span", { style: vencida ? { color: "var(--red)", fontWeight: 700 } : null }, fmtDate(o.fecha_limite) + (vencida ? " ⚠" : ""));
      },
    },
    { key: "fecha_culminacion", label: "Culminación", render: (o) => fmtDate(o.fecha_culminacion) },
    { key: "estado", label: "Estado", render: (o) => proyectoPill(o.estado) },
    { key: "com", label: "Bitácora", sortable: false, render: (o) => "💬 " + data.bitacora.filter((b) => b.ot_id === o.id && b.tipo === "comentario").length },
  ];

  const ocColumns = [
    { key: "numero_oc", label: "N° OC", render: (o) => h("b", null, o.numero_oc) },
    { key: "fecha", label: "Fecha", render: (o) => fmtDate(o.fecha) },
    { key: "proveedor", label: "Proveedor", render: (o) => truncar(o.proveedor || "—", 220) },
    { key: "titulo", label: "Título", render: (o) => truncar(o.titulo || "—", 260) },
    { key: "cuota", label: "Cuota", render: (o) => o.cuota || "—" },
    { key: "estado", label: "Estado", render: (o) => estadoPill(o.estado) },
    { key: "monto_neto", label: "Neto", sortValue: (o) => Number(o.monto_neto), render: (o) => fmtMontoMoneda(o.monto_neto, o.moneda) },
    { key: "neto_uf", label: "Neto UF", sortValue: (o) => o.neto_uf ?? -1, render: (o) => fmtUF(o.neto_uf) },
    { key: "valor_uf", label: "Valor UF usado", render: (o) => o.valor_uf ? fmtMoney(o.valor_uf) : "—" },
  ];

  const tabBtn = (key, label) => h("button", {
    className: "nav-btn" + (tabFicha === key ? " active" : ""), onClick: () => setTabFicha(key),

      onClose: () => { setOtNueva(false); setOtEditando(null); },
      onSaved: () => { setOtNueva(false); setOtEditando(null); cargar(); },
    }),
    h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" } },
        h("div", null,
          h("button", { className: "btn-ghost", style: { padding: "5px 12px", fontSize: 11, marginBottom: 10 }, onClick: onVolver }, "← Volver a proyectos"),
          h("div", { style: { fontSize: 11, fontWeight: 700, color: "var(--acc2)", letterSpacing: ".04em" } }, p.codigo),
          h("h2", { style: { fontSize: 18, margin: "2px 0 6px" } }, p.nombre),
          h("div", { style: { display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", color: "var(--txm)", fontSize: 12 } },

        h(KpiProyecto, { label: "Presupuesto", valor: fmtUF(p.presupuesto_uf, 0), sub: p.presupuesto_uf && data.uf_hoy ? "≈ " + fmtMoney(Math.round(p.presupuesto_uf * data.uf_hoy)) : null }),
        h(KpiProyecto, { label: "Comprometido (OC aprobadas)", valor: fmtUF(p.comprometido_uf, 0), color: colorConsumo(pct), sub: pct !== null ? Math.round(pct) + "% del presupuesto" : "sin presupuesto cargado" }),
        h(KpiProyecto, { label: "Facturado", valor: fmtUF(p.facturado_uf, 0) }),
        h(KpiProyecto, { label: "Por aprobar", valor: fmtUF(p.por_aprobar_uf, 0), sub: "OC pendientes de aprobación" }),
        h(KpiProyecto, { label: "Saldo", valor: fmtUF(saldo, 0), color: saldo !== null && saldo < 0 ? "var(--red)" : undefined }),
        h(KpiProyecto, { label: "Avance físico", valor: (p.avance_pct || 0) + "%" }),

        "⚠ " + p.sin_convertir + " OC en otra moneda (no CLP/UF) no se incluyen en los totales."),
    ),
    h("div", { style: { display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" } },
      tabBtn("resumen", "Resumen"),
      tabBtn("ot", "Tareas (" + data.ots.length + ")"),
      tabBtn("oc", "OC vinculadas (" + data.ordenes.length + ")"),
      tabBtn("bitacora", "Bitácora (" + data.bitacora.length + ")"),

    tabFicha === "resumen" && h("div", { className: "card" },
      p.es_permanente && h("div", { className: "hint", style: { marginBottom: 10, fontSize: 11.5 } },
        "Proyecto permanente: agrupa las tareas operativas que no pertenecen a un proyecto específico. No se puede renombrar, cerrar ni eliminar."),
      h(ProyectoForm, { form, setForm, proveedores, usuarios, esPermanente: p.es_permanente, ufHoy: data.uf_hoy, codigoActual: p.codigo }),
      h("div", { style: { display: "flex", justifyContent: "space-between", gap: 10, marginTop: 8 } },
        !p.es_permanente ? h("button", { className: "btn-ghost", onClick: eliminar, style: { color: "var(--red)" } }, "Eliminar proyecto") : h("div"),
        h("div", { style: { display: "flex", gap: 10 } },
          h("button", { className: "btn-ghost", onClick: () => setForm(proyectoFormDesde(p)) }, "Descartar cambios"),
          h("button", { className: "btn-primary", onClick: guardar, disabled: saving }, saving ? "Guardando..." : "Guardar cambios"))),
    ),
    tabFicha === "ot" && h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 } },

    tabFicha === "oc" && h("div", { className: "card" },
      h("h2", null, "OC vinculadas a este proyecto"),
      h("div", { className: "hint", style: { marginBottom: 12, fontSize: 11.5 } },
        "Solo lectura — se gestionan en el menú Órdenes. Montos netos; las OC en CLP se convierten con el valor UF de la fecha de la OC. Comprometido = todo lo aprobado en adelante (no cuenta Borrador, Pendiente aprobación ni Anulado)."),
      h(DataTable, {
        columns: ocColumns, rows: data.ordenes, rowKey: (o) => o.id,
        searchFields: ["numero_oc", "proveedor", "titulo", "estado"],
        searchPlaceholder: "Buscar por N° OC, proveedor, título o estado",
        emptyText: "No hay OC con este proyecto asignado",
      }),
    ),
    tabFicha === "bitacora" && h("div", { className: "card" },
      h("h2", null, "Bitácora del proyecto"),
      h(BitacoraHilo, { entradas: data.bitacora, ots: data.ots, alto: 480 }),
      h(AgregarComentario, {
        proyectoId: p.id, notify,
        onAgregado: (entrada) => setData((d) => ({ ...d, bitacora: [...d.bitacora, entrada] })),

    api("proyectos-seguimiento?empresa_id=" + empresaId)
      .then((d) => { setProyectos(d.proyectos); setUfHoy(d.uf_hoy); })
      .catch((e) => { notify("err", e.message); setProyectos([]); });
  }, [empresaId, notify]);

  useEffect(() => { setSeleccionado(null); setProyectos(null); cargar(); }, [cargar]);
  useEffect(() => {
    api("proyectos-seguimiento?usuarios=1").then((d) => setUsuarios(d.usuarios)).catch(() => {});
  }, []);

  if (seleccionado) {
    return h(ProyectoFicha, {
      id: seleccionado, proveedores, usuarios, notify,
      onVolver: () => { setSeleccionado(null); cargar(); },
    });
  }

  const todos = proyectos || [];
  const cerrado = (p) => p.estado_proyecto === "Cerrado" || p.estado_proyecto === "Cancelado";
  const filas = todos.filter((p) => filtro === "todos" ? true : filtro === "cerrados" ? cerrado(p) : !cerrado(p));
  const activos = todos.filter((p) => !cerrado(p));
  const sum = (arr, k) => arr.reduce((s, p) => s + Number(p[k] || 0), 0);
  const hoy = hoyISO();

  const columns = [
    { key: "codigo", label: "Código", render: (p) => h("b", null, p.codigo) },
    { key: "nombre", label: "Proyecto", render: (p) => h("span", null, truncar(p.nombre, 300), p.es_permanente && h("span", { className: "pill pill-draft", style: { marginLeft: 6, fontSize: 9 } }, "permanente")) },
    { key: "ejecutor", label: "Ejecutor", sortValue: (p) => nombreEjecutor(p), render: (p) => truncar(nombreEjecutor(p), 200) },
    { key: "jefe_proyecto", label: "Jefe", sortValue: (p) => nombreUsuario(usuarios, p.jefe_proyecto), render: (p) => nombreUsuario(usuarios, p.jefe_proyecto) },
    { key: "presupuesto_uf", label: "Presupuesto", sortValue: (p) => Number(p.presupuesto_uf || 0), render: (p) => fmtUF(p.presupuesto_uf, 0) },
    { key: "comprometido_uf", label: "Comprometido", sortValue: (p) => p.comprometido_uf || 0, render: (p) => fmtUF(p.comprometido_uf, 0) },
    { key: "consumo", label: "% Ppto.", sortValue: (p) => pctConsumo(p) ?? -1, render: (p) => { const c = pctConsumo(p); return h(MiniBarra, { pct: c, color: colorConsumo(c) }); } },
    { key: "avance_pct", label: "Avance", sortValue: (p) => p.avance_pct || 0, render: (p) => h(MiniBarra, { pct: p.avance_pct || 0 }) },
    {
      key: "fecha_termino_plan", label: "Término plan.",
      render: (p) => {
        const atrasado = p.fecha_termino_plan && p.fecha_termino_plan < hoy && !cerrado(p);
        return h("span", { style: atrasado ? { color: "var(--red)", fontWeight: 700 } : null }, fmtDate(p.fecha_termino_plan) + (atrasado ? " ⚠" : ""));
      },
    },
    { key: "estado_proyecto", label: "Estado", render: (p) => proyectoPill(p.estado_proyecto) },
    { key: "ot_abiertas", label: "Tareas abiertas", sortValue: (p) => p.ot_abiertas, render: (p) => p.ot_abiertas + " / " + p.ot_total },
  ];

  const filtroBtn = (key, label) => h("button", {
    className: "nav-btn" + (filtro === key ? " active" : ""), style: { padding: "5px 12px", fontSize: 11 }, onClick: () => setFiltro(key),
  }, label);

  return h("div", { className: "page fade-up" },
    showNuevo && h(NuevoProyectoModal, {
      empresaId, proveedores, usuarios, ufHoy, notify,
      onClose: () => setShowNuevo(false),
      onCreado: (proyecto) => { setShowNuevo(false); setSeleccionado(proyecto.id); },
    }),
    h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" } },
        h("div", null,
          h("h2", { style: { marginBottom: 2 } }, "Proyectos"),
          h("div", { className: "hint" }, "Montos netos en UF, calculados desde las OC de cada proyecto" + (ufHoy ? " · UF hoy " + fmtMoney(ufHoy) : ""))),
        h("button", { className: "btn-primary", style: { padding: "8px 18px" }, onClick: () => setShowNuevo(true) }, "+ Nuevo Proyecto")),
      h("div", { className: "stat-strip" },
        h(KpiProyecto, { label: "Proyectos activos", valor: activos.length }),
        h(KpiProyecto, { label: "Presupuesto activos", valor: fmtUF(sum(activos, "presupuesto_uf"), 0) }),
        h(KpiProyecto, { label: "Comprometido activos", valor: fmtUF(sum(activos, "comprometido_uf"), 0) }),
        h(KpiProyecto, { label: "Tareas abiertas", valor: sum(todos, "ot_abiertas") }),
      ),
    ),
    h("div", { className: "card" },
      h("div", { style: { display: "flex", gap: 6, marginBottom: 12 } },
        filtroBtn("activos", "Activos"), filtroBtn("cerrados", "Cerrados / Cancelados"), filtroBtn("todos", "Todos")),
      proyectos === null
        ? h("div", { style: { display: "flex", gap: 10, alignItems: "center" } }, h("span", { className: "spinner" }), "Cargando proyectos...")
        : h(DataTable, {
            columns, rows: filas, rowKey: (p) => p.id,
            onRowClick: (p) => setSeleccionado(p.id),
            searchFields: ["codigo", "nombre", "ubicacion", "solicitante", "ejecutor_interno"],
            searchPlaceholder: "Buscar por código, nombre, ubicación o solicitante",
            emptyText: "No hay proyectos en este filtro",
          }),
    ),
  );
}

// ===== OT Mantención (Fase A) =====
// Ver docs/superpowers/specs/2026-10-09-ot-mantencion-fase-a-design.md.
// Tickets de mantencion reactiva de arriendo -- no confundir con "Proyectos"
// (capital/remodelacion). Sin correo/IA todavia: el ingreso es manual via
// Registro rapido.

const OT_CATEGORIAS = [
  "Techumbre y filtraciones", "Eléctrico", "Iluminación exterior", "Agua y sanitario",
  "Accesos y seguridad", "Ascensores", "Obra civil", "Climatización",
  "Incendio y emergencias", "Áreas comunes y aseo", "Plagas", "Solicitud de servicio", "Reclamo de convivencia", "Otro",
];
const OT_PRIORIDAD_COLOR = { P1: "var(--red)", P2: "var(--amber)", P3: "var(--acc)", P4: "var(--txd)" };
const OT_TRANSICIONES = {
  "Nueva": ["Asignada", "Anulada"],
  "Asignada": ["En curso", "En espera", "Anulada"],
  "En curso": ["En espera", "Resuelta", "Anulada"],
  "En espera": ["En curso", "Anulada"],
  "Resuelta": ["En curso", "Cerrada"],
  "Cerrada": ["En curso"],
  "Anulada": [],
};

function otEstadoPill(estado) {
  const colores = {
    "Nueva": ["var(--accbg)", "var(--acc)"], "Asignada": ["var(--accbg)", "var(--acc)"],
    "En curso": ["var(--abg)", "var(--amber)"], "En espera": ["var(--surf3)", "var(--txm)"],
    "Resuelta": ["var(--gbg)", "var(--green)"], "Cerrada": ["var(--gbg)", "var(--green)"],
    "Anulada": ["var(--surf3)", "var(--txd)"],
  };
  const [bg, col] = colores[estado] || ["var(--surf3)", "var(--txm)"];
  return h("span", { className: "pill", style: { background: bg, color: col } }, estado);
}

function fmtFechaHora(iso) {
  if (!iso) return "—";
  return new Date(iso).toLocaleString("es-CL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function NuevaOtModal({ empresaId, catalogo, currentUser, notify, onClose, onCreated }) {
  const [form, setForm] = useState({
    titulo: "", categoria: "", cliente_id: "", ubicacion_id: "",
    reportado_por: (currentUser && (currentUser.nombre ? (currentUser.nombre + " " + (currentUser.apellido || "")).trim() : currentUser.usuario)) || "",
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  // Unidades vigentes del cliente elegido (via contrato_unidad), para acotar
  // el selector de ubicación cuando el cliente tiene más de una. El Registro
  // rápido siempre reporta a nivel Unidad (sin selector de "tipo").
  const unidadIdsCliente = useMemo(() => {
    if (!form.cliente_id) return null;
    const hoy = new Date().toISOString().slice(0, 10);
    const ids = new Set();
    for (const c of catalogo.contratos || []) {
      if (c.cliente_id !== form.cliente_id) continue;
      for (const cu of c.contrato_unidad || []) {
        if (cu.hasta && cu.hasta < hoy) continue;
        ids.add(cu.unidad_id);
      }
    }
    return ids;
  }, [form.cliente_id, catalogo.contratos]);

  const opcionesUbicacion = useMemo(() => {
    const opciones = (catalogo.unidades || []).map((u) => ({ value: u.id, label: u.codigo + (u.nombre ? " — " + u.nombre : "") }));
    if (unidadIdsCliente) return opciones.filter((o) => unidadIdsCliente.has(o.value));
    return opciones;
  }, [catalogo, unidadIdsCliente]);

  const seleccionarCliente = (e) => {
    const clienteId = e.target.value;
    if (!clienteId) { setForm((f) => ({ ...f, cliente_id: "" })); return; }
    const hoy = new Date().toISOString().slice(0, 10);
    const ids = [];
    for (const c of catalogo.contratos || []) {
      if (c.cliente_id !== clienteId) continue;
      for (const cu of c.contrato_unidad || []) {
        if (cu.hasta && cu.hasta < hoy) continue;
        ids.push(cu.unidad_id);
      }
    }
    setForm((f) => ({ ...f, cliente_id: clienteId, ubicacion_id: ids.length === 1 ? ids[0] : "" }));
  };

  const submit = async () => {
    if (!form.titulo.trim()) return notify("err", "Describe qué pasa");
    if (!form.cliente_id) return notify("err", "Selecciona el cliente");
    if (!form.ubicacion_id) return notify("err", "Selecciona la ubicación");
    setSaving(true);
    try {
      const { cliente_id, ...resto } = form;
      await api("ot-mantencion", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...resto, ubicacion_tipo: "unidad", empresa_id: empresaId }),
      });
      notify("ok", "OT creada");
      onCreated();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 560, maxHeight: "90vh", overflowY: "auto" } },
      h("div", { className: "modal-hdr" }, h("h3", null, "Registro rápido"), h("button", { className: "modal-close", onClick: onClose }, "×")),

      h(Field, { label: "¿Qué pasa? *" },
        h("input", { value: form.titulo, onChange: set("titulo"), placeholder: "Ej: Gotera activa sobre bodega" })),

      h("div", { className: "section-lbl" }, "Ubicación"),
      h(Field, { label: "Cliente *" },
        h("select", { value: form.cliente_id, onChange: seleccionarCliente },
          h("option", { value: "" }, "Selecciona"),
          (catalogo.clientes || []).map((c) => h("option", { key: c.id, value: c.id }, c.razon_social)))),
      h("div", { className: "grid2" },
        h(Field, { label: "Ubicación *" },
          h("select", { value: form.ubicacion_id, onChange: set("ubicacion_id") },
            h("option", { value: "" }, "Selecciona"),
            opcionesUbicacion.map((o) => h("option", { key: o.value, value: o.value }, o.label)))),
        h(Field, { label: "Categoría" },
          h("select", { value: form.categoria, onChange: set("categoria") },
            h("option", { value: "" }, "Selecciona"),
            OT_CATEGORIAS.map((c) => h("option", { key: c, value: c }, c))))),
      form.cliente_id && opcionesUbicacion.length === 0 && h("div", { className: "hint" },
        "Este cliente no tiene unidades vigentes asociadas"),
      form.cliente_id && opcionesUbicacion.length > 1 && h("div", { className: "hint" },
        "Este cliente tiene " + opcionesUbicacion.length + " unidades vigentes — selecciona la correcta"),

      h("div", { className: "section-lbl" }, "Seguimiento"),
      h(Field, { label: "Reportado por" },
        h("input", { value: form.reportado_por, onChange: set("reportado_por"), placeholder: "Nombre de quien avisó" })),

      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 16 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", { className: "btn-primary", onClick: submit, disabled: saving }, saving ? "Creando..." : "Crear OT")),
    ));
}

function OtDetalleModal({ data, usuariosOps, notify, onClose, onSaved }) {
  const { ot, bitacora, costos } = data;
  const [comentario, setComentario] = useState("");
  const [montoCosto, setMontoCosto] = useState("");
  const [conceptoCosto, setConceptoCosto] = useState("materiales");
  const [estadoDestino, setEstadoDestino] = useState("");
  const [solucionTxt, setSolucionTxt] = useState(ot.solucion || "");
  const [costoReal, setCostoReal] = useState(ot.costo_real ?? "");
  const [cargoSel, setCargoSel] = useState(ot.cargo && ot.cargo !== "Por definir" ? ot.cargo : "");
  const [motivoPrioridad, setMotivoPrioridad] = useState("");
  const [prioridadSel, setPrioridadSel] = useState(ot.prioridad || "");
  const [guardando, setGuardando] = useState(false);

  const put = async (campos) => {
    setGuardando(true);
    try {
      await api("ot-mantencion?id=" + ot.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(campos) });
      onSaved();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setGuardando(false);
    }
  };

  const aplicarTransicion = () => {
    if (!estadoDestino) return;
    const campos = { estado: estadoDestino };
    if (estadoDestino === "Resuelta") {
      if (!solucionTxt.trim()) return notify("err", "Describe la solución");
      campos.solucion = solucionTxt;
    }
    if (estadoDestino === "Cerrada") {
      if (costoReal === "" || costoReal === null) return notify("err", "Ingresa el costo real (puede ser 0)");
      if (!cargoSel) return notify("err", "Selecciona el cargo");
      campos.costo_real = Number(costoReal);
      campos.cargo = cargoSel;
    }
    put(campos);
  };

  const enviarComentario = async () => {
    if (!comentario.trim()) return;
    try {
      await api("ot-mantencion?bitacora=1", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ot_id: ot.id, texto: comentario }) });
      setComentario("");
      onSaved();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const agregarCosto = async () => {
    if (!montoCosto) return;
    try {
      await api("ot-mantencion?costo=1", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ot_id: ot.id, monto_clp: Number(montoCosto), concepto: conceptoCosto }) });
      setMontoCosto("");
      onSaved();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const cambiarPrioridad = () => {
    if (!prioridadSel || prioridadSel === ot.prioridad) return;
    if (!motivoPrioridad.trim()) return notify("err", "Ingresa el motivo del cambio de prioridad");
    put({ prioridad: prioridadSel, prioridad_motivo_cambio: motivoPrioridad.trim() });
    setMotivoPrioridad("");
  };

  const transicionesValidas = OT_TRANSICIONES[ot.estado] || [];

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 640, maxHeight: "90vh", overflowY: "auto" } },
      h("div", { className: "modal-hdr" },
        h("h3", null, ot.codigo + " — " + ot.titulo),
        h("button", { className: "modal-close", onClick: onClose }, "×")),
      h("div", { style: { display: "flex", gap: 10, marginBottom: 12, flexWrap: "wrap", alignItems: "center" } },
        h("b", { style: { color: OT_PRIORIDAD_COLOR[ot.prioridad], fontSize: 16 } }, ot.prioridad),
        otEstadoPill(ot.estado),
        ot.fecha_limite_solucion && h("span", { className: "hint" }, "SLA solución: " + fmtFechaHora(ot.fecha_limite_solucion)),
        ot.contratos_afectados && ot.contratos_afectados.length === 0 && h("span", { className: "hint", style: { color: "var(--amber)" } }, "Vacante / sin cliente"),
      ),
      h("div", { className: "grid2" },
        h(Field, { label: "Cambiar prioridad a" },
          h("select", { value: prioridadSel, onChange: (e) => setPrioridadSel(e.target.value) },
            ["P1", "P2", "P3", "P4"].map((p) => h("option", { key: p, value: p }, p)))),
        h(Field, { label: "Motivo del cambio" },
          h("input", { value: motivoPrioridad, onChange: (e) => setMotivoPrioridad(e.target.value), placeholder: "Por qué cambia la prioridad" }))),
      prioridadSel !== ot.prioridad && h("div", { style: { display: "flex", justifyContent: "flex-end", marginBottom: 14 } },
        h("button", { className: "btn-ghost", onClick: cambiarPrioridad, disabled: guardando || !motivoPrioridad.trim() }, "Aplicar cambio de prioridad")),
      h(Field, { label: "Responsable" },
        h("select", {
          value: ot.responsable_id || "",
          onChange: (e) => put({ responsable_id: e.target.value || null }),
        },
          h("option", { value: "" }, "Sin asignar"),
          usuariosOps.map((u) => h("option", { key: u.id, value: u.id }, u.nombre + " " + u.apellido)))),
      h("div", { className: "grid2" },
        h(Field, { label: "Cambiar estado a" },
          h("select", { value: estadoDestino, onChange: (e) => setEstadoDestino(e.target.value), disabled: !transicionesValidas.length },
            h("option", { value: "" }, "— sin cambio —"),
            transicionesValidas.map((e) => h("option", { key: e, value: e }, e)))),
        h("div", { style: { display: "flex", alignItems: "flex-end" } },
          h("button", { className: "btn-primary", onClick: aplicarTransicion, disabled: !estadoDestino || guardando }, "Aplicar")),
      ),
      estadoDestino === "Resuelta" && h(Field, { label: "Solución *" },
        h("textarea", { rows: 2, value: solucionTxt, onChange: (e) => setSolucionTxt(e.target.value) })),
      estadoDestino === "Cerrada" && h("div", { className: "grid2" },
        h(Field, { label: "Costo real *" }, h("input", { type: "number", value: costoReal, onChange: (e) => setCostoReal(e.target.value) })),
        h(Field, { label: "Cargo *" },
          h("select", { value: cargoSel, onChange: (e) => setCargoSel(e.target.value) },
            h("option", { value: "" }, "Selecciona"),
            ["Arrendador", "Arrendatario", "Compartido", "Seguro", "Garantía"].map((c) => h("option", { key: c, value: c }, c))))),
      h("div", { className: "section-lbl", style: { marginTop: 14 } }, "Costos"),
      (costos || []).map((c) => h("div", { key: c.id, className: "hint" }, fmtDate(c.fecha) + " — " + c.concepto + ": $" + Number(c.monto_clp).toLocaleString("es-CL"))),
      h("div", { style: { display: "flex", gap: 8, marginTop: 6 } },
        h("select", { value: conceptoCosto, onChange: (e) => setConceptoCosto(e.target.value), style: { width: 140 } },
          ["materiales", "mano de obra", "proveedor", "otro"].map((c) => h("option", { key: c, value: c }, c))),
        h("input", { type: "number", placeholder: "Monto CLP", value: montoCosto, onChange: (e) => setMontoCosto(e.target.value), style: { width: 140 } }),
        h("button", { className: "btn-ghost", onClick: agregarCosto }, "+ Agregar costo")),
      h("div", { className: "section-lbl", style: { marginTop: 14 } }, "Bitácora"),
      h("div", { style: { maxHeight: 180, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 } },
        (bitacora || []).map((b) => h("div", { key: b.id, style: { fontSize: 12 } },
          h("span", { style: { color: "var(--txd)", fontFamily: "monospace" } }, fmtFechaHora(b.created_at) + " · "),
          b.tipo === "sistema" ? h("b", null, b.texto) : b.texto,
          " ", h("i", { style: { color: "var(--txd)" } }, "— " + (b.usuario || "—"))))),
      h("div", { style: { display: "flex", gap: 8 } },
        h("input", { value: comentario, onChange: (e) => setComentario(e.target.value), placeholder: "Agregar comentario..." }),
        h("button", { className: "btn-ghost", onClick: enviarComentario }, "Enviar")),
    ));
}

const MESA_SORT_COLS = [
  { key: "prioridad", label: "Pri", getVal: (o) => o.prioridad || "" },
  { key: "codigo", label: "Código", getVal: (o) => o.codigo || "" },
  { key: "titulo", label: "Título", getVal: (o) => o.titulo || "" },
  { key: "responsable", label: "Responsable", getVal: (o) => (o.usuarios ? o.usuarios.nombre + " " + o.usuarios.apellido : "") },
  { key: "estado", label: "Estado", getVal: (o) => o.estado || "" },
  { key: "fecha_limite_solucion", label: "SLA solución", getVal: (o) => o.fecha_limite_solucion || "" },
];

function MesaDeControl({ ots, cargando, expandido, setExpandido, onAbrir }) {
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const toggleSort = (key) => {
    if (sortKey !== key) { setSortKey(key); setSortDir("asc"); }
    else if (sortDir === "asc") setSortDir("desc");
    else { setSortKey(null); setSortDir("asc"); }
  };

  const otsOrdenadas = useMemo(() => {
    const col = MESA_SORT_COLS.find((c) => c.key === sortKey);
    if (!col) return ots;
    const copy = [...ots];
    copy.sort((a, b) => {
      const va = String(col.getVal(a)).toLowerCase(), vb = String(col.getVal(b)).toLowerCase();
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return copy;
  }, [ots, sortKey, sortDir]);

  const indicadores = useMemo(() => {
    const abiertos = ots.filter((o) => !["Resuelta", "Cerrada", "Anulada"].includes(o.estado));
    const hoy = new Date().toISOString().slice(0, 10);
    return {
      p1: abiertos.filter((o) => o.prioridad === "P1").length,
      p2: abiertos.filter((o) => o.prioridad === "P2").length,

      resueltasHoy: ots.filter((o) => o.fecha_resolucion && o.fecha_resolucion.slice(0, 10) === hoy).length,
    };
  }, [ots]);

  if (cargando) return h("div", { className: "empty" }, "Cargando...");
