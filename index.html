function OtMantencionPage({ empresaId, currentUser, notify }) {
  const [vista, setVista] = useState("mesa");
  const [ots, setOts] = useState([]);
  const [catalogo, setCatalogo] = useState({ sitios: [], edificios: [], unidades: [], areas_comunes: [], clientes: [], contratos: [] });
  const [usuariosOps, setUsuariosOps] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [nuevaOt, setNuevaOt] = useState(false);
  const [otSel, setOtSel] = useState(null);
  const [expandido, setExpandido] = useState({});

  const cargarTodo = () => {
    setCargando(true);
    Promise.all([
      api("ot-mantencion?empresa_id=" + empresaId),
      api("ot-mantencion?catalogo=1&empresa_id=" + empresaId),
      api("ot-mantencion?usuarios=1"),
    ]).then(([a, b, c]) => {
      setOts(a.ots);
      setCatalogo(b);
      setUsuariosOps(c.usuarios);
    }).catch((e) => notify("err", e.message)).finally(() => setCargando(false));
  };
  useEffect(cargarTodo, [empresaId]);

  const abrirOt = (id) => {
    api("ot-mantencion?id=" + id).then((d) => setOtSel(d)).catch((e) => notify("err", e.message));
  };

  return h("div", { className: "page fade-up" },
    nuevaOt && h(NuevaOtModal, { empresaId, catalogo, currentUser, notify, onClose: () => setNuevaOt(false), onCreated: () => { setNuevaOt(false); cargarTodo(); } }),
    otSel && h(OtDetalleModal, { data: otSel, usuariosOps, notify, onClose: () => setOtSel(null), onSaved: () => { abrirOt(otSel.ot.id); cargarTodo(); } }),
    h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
        h("div", { style: { display: "flex", gap: 8 } },
          h("button", { className: "nav-btn" + (vista === "mesa" ? " active" : ""), onClick: () => setVista("mesa") }, "Mesa de control"),
          h("button", { className: "nav-btn" + (vista === "catalogo" ? " active" : ""), onClick: () => setVista("catalogo") }, "Catálogo"),
        ),
        vista === "mesa" && h("button", { className: "btn-primary", onClick: () => setNuevaOt(true) }, "+ Registro rápido"),
      ),
      vista === "mesa"
        ? h(MesaDeControl, { ots, cargando, expandido, setExpandido, onAbrir: abrirOt })
        : h(CatalogoOperaciones, { empresaId, catalogo, notify, onChanged: cargarTodo }),
    ),
  );
}

function AdministracionList({ usuarios, refreshUsuarios, notify, currentUser, refreshOrdenes, refreshProveedores, refreshEmpresas, empresaId, empresa, empresas, proyectosTodos, catalogosTodos, proveedores }) {
  const [showModal, setShowModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const closeAny = () => { setShowModal(false); setEditing(null); };

  const columns = useMemo(() => {
    const empresaNombre = (id) => (empresas || []).find((e) => e.id === id)?.nombre || "—";
    const proyectoNombre = (id) => (proyectosTodos || []).find((p) => p.id === id)?.nombre || "—";
    const centroCostoLabel = (codigo, empresaId) => {
      const c = (catalogosTodos?.centrosCosto || []).find((x) => x.codigo === codigo && x.empresa_id === empresaId);
      return c ? c.codigo + " — " + c.descripcion : "—";
    };
    const cuentaContableLabel = (codigo, empresaId) => {
      const c = (catalogosTodos?.cuentasContables || []).find((x) => x.codigo === codigo && x.empresa_id === empresaId);
      return c ? c.codigo + " — " + c.descripcion : "—";
    };
    const proveedoresLabel = (ids) => {
      if (!ids || !ids.length) return "—";
      return ids.map((id) => (proveedores || []).find((p) => p.id === id)?.razon_social || "?").join(", ");
    };
    return [
      { key: "nombre", label: "Nombre" },
      { key: "apellido", label: "Apellido" },
      { key: "usuario", label: "Usuario" },
      { key: "nivel_aprobacion", label: "Nivel Aprobación", render: (u) => (u.nivel_aprobacion === 1
        ? h("span", { className: "pill pill-ok" }, "1 — Aprueba OC")
        : h("span", { className: "pill pill-pend" }, "0 — No aprueba")) },
      { key: "empresa", label: "Empresa", sortable: false, render: (u) => u.empresa_id ? empresaNombre(u.empresa_id) : "Todas" },
      { key: "proyecto", label: "Proyecto", sortable: false, render: (u) => u.proyecto_id ? proyectoNombre(u.proyecto_id) : "—" },
      { key: "centro_costo", label: "Centro de Costo", sortable: false, render: (u) => u.centro_costo_codigo ? centroCostoLabel(u.centro_costo_codigo, u.empresa_id) : "—" },
      { key: "cuenta_contable", label: "Cuenta Contable", sortable: false, render: (u) => u.cuenta_contable_codigo ? truncar(cuentaContableLabel(u.cuenta_contable_codigo, u.empresa_id), 220) : "—" },
      { key: "proveedores", label: "Proveedores", sortable: false, render: (u) => truncar(proveedoresLabel(u.proveedor_ids), 260) },
      { key: "tiene_password", label: "Contraseña", render: (u) => (u.tiene_password
        ? h("span", { className: "pill pill-ok" }, "Configurada")
        : h("span", { className: "pill pill-pend" }, "Sin definir")) },
    ];
  }, [empresas, proyectosTodos, catalogosTodos, proveedores]);

  if (currentUser.usuario !== SUPERADMIN) {
    return h(MiCuentaPanel, { currentUser, usuarios, notify });
  }

  return h("div", { className: "page fade-up" },
    (showModal || editing) && h(UsuarioModal, {
      editUsuario: editing, onClose: closeAny,
      onSaved: () => { refreshUsuarios(); closeAny(); }, notify,
      empresas, proyectosTodos, catalogosTodos, proveedores,
    }),
    h("div", { className: "card" },
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 } },
        h("h2", { style: { marginBottom: 0 } }, "Administración de Usuarios"),
        h("button", { className: "btn-primary", style: { padding: "8px 18px" }, onClick: () => setShowModal(true) }, "+ Nuevo Usuario"),
      ),
      h(DataTable, {
        columns, rows: usuarios, rowKey: (u) => u.id,
        // El superadmin edita cualquier perfil directo, sin pedir la
        // contraseña del usuario (no tiene por qué saberla -- de hecho el
        // caso típico es justo resetearla porque el usuario la olvidó).
        onRowClick: (u) => setEditing(u),
        searchFields: ["nombre", "apellido", "usuario"],
        searchPlaceholder: "Buscar por nombre, apellido o usuario",
        emptyText: "No hay usuarios cargados todavía",
      }),
    ),
    currentUser && currentUser.nivel_aprobacion === 1 && h(ConfiguracionCorreos, { key: "correos-" + empresaId, empresa, notify, refreshEmpresas }),
    currentUser && currentUser.nivel_aprobacion === 1 && h(SincronizarAcquisys, { key: empresaId, notify, refreshOrdenes, refreshProveedores, empresaId, empresa }),
  );
}

function LoginScreen({ onLoggedIn }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  const [modoOlvido, setModoOlvido] = useState(false);

  const doLogin = () => {
    if (!usuario || !password) { setMsg("Completa todos los campos"); return; }
    setBusy(true); setMsg("");
    fetch("/api/auth?action=login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, password }),
    })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (ok) onLoggedIn(d);
        else setMsg(d.error || "Error al ingresar");
      })
      .catch(() => setMsg("Error de conexión"))
      .finally(() => setBusy(false));
  };

  const wrap = { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg,#0a1f3d 0%,#0e2f5c 50%,#0e4a8f 100%)" };
  const card = { background: "#fff", borderRadius: 20, padding: "44px 40px", width: "100%", maxWidth: 380, boxShadow: "0 20px 60px rgba(0,0,0,.3)" };
  const lbl = { fontSize: 11, fontWeight: 700, color: "var(--txm)", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: ".05em" };
  const cabecera = h("div", { style: { textAlign: "center", marginBottom: 28 } },
    h("img", { src: "/logo-OCFast.png", style: { maxWidth: 220, display: "block", margin: "0 auto" } }),
    h("div", { style: { fontSize: 11, color: "var(--txm)", marginTop: 10, letterSpacing: ".04em" } }, "Portal de Órdenes de Compra"),
  );

  if (modoOlvido) {
    return h("div", { style: wrap }, h("div", { style: card }, cabecera, h(OlvideClaveForm, { lbl, onVolver: () => setModoOlvido(false) })));
  }

  return h("div", { style: wrap },
    h("div", { style: card },
      cabecera,
      h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 6 } }, "Iniciar sesión"),
      h("p", { style: { color: "var(--txm)", fontSize: 13, marginBottom: 24 } }, "Ingresa con tu usuario de OCFast."),
      h("label", { style: lbl }, "Usuario"),
      h("input", { value: usuario, onChange: (e) => setUsuario(e.target.value), placeholder: "amelendez@patagonica.cl", style: { marginBottom: 16 }, autoComplete: "username" }),
      h("label", { style: lbl }, "Contraseña"),
      h("input", {
        type: "password", value: password, onChange: (e) => setPassword(e.target.value), placeholder: "••••••••",
        style: { marginBottom: 8 }, autoComplete: "current-password", onKeyDown: (e) => { if (e.key === "Enter") doLogin(); },
      }),
      h("div", { style: { textAlign: "right", marginBottom: 16 } },
        h("a", { className: "link", style: { fontSize: 12.5, cursor: "pointer" }, onClick: () => { setModoOlvido(true); setMsg(""); } }, "¿Olvidaste tu contraseña?")),
      msg && h("div", { className: "notif-err", style: { padding: "8px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13 } }, msg),
      h("button", { className: "btn-primary", style: { width: "100%" }, onClick: doLogin, disabled: busy }, busy ? "Ingresando..." : "Ingresar"),
    )
  );
}

function OlvideClaveForm({ lbl, onVolver }) {
  const [usuario, setUsuario] = useState("");
  const [busy, setBusy] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [msg, setMsg] = useState("");

  const enviar = () => {
    if (!usuario.trim()) { setMsg("Ingresa tu usuario"); return; }
    setBusy(true); setMsg("");
    fetch("/api/auth?action=solicitar-reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario }),
    })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { if (ok) setEnviado(true); else setMsg(d.error || "No se pudo procesar la solicitud"); })
      .catch(() => setMsg("Error de conexión"))
      .finally(() => setBusy(false));
  };

  if (enviado) {
    return h("div", null,
      h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 12 } }, "Revisa tu correo"),
      h("p", { style: { color: "var(--txm)", fontSize: 13.5, marginBottom: 24, lineHeight: 1.5 } },
        "Si el usuario existe, te enviamos un enlace a tu correo para restablecer tu contraseña. Válido por 30 minutos."),
      h("button", { className: "btn-ghost", style: { width: "100%" }, onClick: onVolver }, "Volver a iniciar sesión"),
    );
  }

  return h("div", null,
    h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 6 } }, "Recuperar contraseña"),
    h("p", { style: { color: "var(--txm)", fontSize: 13, marginBottom: 24 } }, "Ingresa tu usuario (tu correo corporativo) y te enviaremos un enlace a ese correo."),
    h("label", { style: lbl }, "Usuario"),
    h("input", {
      value: usuario, onChange: (e) => setUsuario(e.target.value), placeholder: "amelendez@patagonica.cl", style: { marginBottom: 16 },
      autoComplete: "username", onKeyDown: (e) => { if (e.key === "Enter") enviar(); },
    }),
    msg && h("div", { className: "notif-err", style: { padding: "8px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13 } }, msg),
    h("button", { className: "btn-primary", style: { width: "100%", marginBottom: 10 }, onClick: enviar, disabled: busy }, busy ? "Enviando..." : "Enviar enlace"),
    h("button", { className: "btn-ghost", style: { width: "100%" }, onClick: onVolver, disabled: busy }, "Volver a iniciar sesión"),
  );
}

function ResetPasswordScreen({ token, onListo }) {
  const [password, setPassword] = useState("");
  const [password2, setPassword2] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [listo, setListo] = useState(false);

  const wrap = { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg,#0a1f3d 0%,#0e2f5c 50%,#0e4a8f 100%)" };
  const card = { background: "#fff", borderRadius: 20, padding: "44px 40px", width: "100%", maxWidth: 380, boxShadow: "0 20px 60px rgba(0,0,0,.3)" };
  const lbl = { fontSize: 11, fontWeight: 700, color: "var(--txm)", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: ".05em" };

  const guardar = () => {
    if (password.length < 6) { setMsg("La contraseña debe tener al menos 6 caracteres"); return; }
    if (password !== password2) { setMsg("Las contraseñas no coinciden"); return; }
    setBusy(true); setMsg("");
    fetch("/api/auth?action=reset-password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password }),
    })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { if (ok) setListo(true); else setMsg(d.error || "No se pudo restablecer la contraseña"); })
      .catch(() => setMsg("Error de conexión"))
      .finally(() => setBusy(false));
  };

  return h("div", { style: wrap },
    h("div", { style: card },
      h("div", { style: { textAlign: "center", marginBottom: 28 } },
        h("img", { src: "/logo-OCFast.png", style: { maxWidth: 220, display: "block", margin: "0 auto" } }),
      ),
      listo
        ? h("div", null,
            h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 12 } }, "Contraseña actualizada"),
            h("p", { style: { color: "var(--txm)", fontSize: 13.5, marginBottom: 24 } }, "Ya puedes ingresar con tu nueva contraseña."),
            h("button", { className: "btn-primary", style: { width: "100%" }, onClick: onListo }, "Ir a iniciar sesión"),
          )
        : h("div", null,
            h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 6 } }, "Nueva contraseña"),
            h("p", { style: { color: "var(--txm)", fontSize: 13, marginBottom: 24 } }, "Define tu nueva contraseña de OCFast."),
            h("label", { style: lbl }, "Contraseña nueva"),
            h("input", {
              type: "password", value: password, onChange: (e) => setPassword(e.target.value), placeholder: "••••••••",
              style: { marginBottom: 16 }, autoComplete: "new-password",
            }),
            h("label", { style: lbl }, "Repetir contraseña"),
            h("input", {
              type: "password", value: password2, onChange: (e) => setPassword2(e.target.value), placeholder: "••••••••",
              style: { marginBottom: 16 }, autoComplete: "new-password", onKeyDown: (e) => { if (e.key === "Enter") guardar(); },
            }),
            msg && h("div", { className: "notif-err", style: { padding: "8px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13 } }, msg),
            h("button", { className: "btn-primary", style: { width: "100%" }, onClick: guardar, disabled: busy }, busy ? "Guardando..." : "Guardar contraseña"),
          ),
    )
  );
}

// Agrupa estados legacy migrados de Acquisys (Pendiente, Aprobado, Factura
// Aprobada, etc.) en los 4 estados canónicos de OCSys; lo no reconocido cae
// en "Otros (histórico)" para que el Total nunca pierda registros.
function normalizarEstadoCategoria(estado) {
  const map = {
    "Borrador": "Borrador",
    "Pendiente aprobación": "Pendiente aprobación", "Pendiente": "Pendiente aprobación",
    "Aprobada": "Aprobada", "Aprobado": "Aprobada",
    "Facturada": "Facturada",
    "Completada": "Completada", "Factura Aprobada": "Completada",
  };
  return map[estado] || "Otros (histórico)";
}

function BarraEstadosOC({ items }) {
  const max = Math.max(1, ...items.map((b) => b.value));
  const sig = items.map((b) => b.value).join(",");
  const [grown, setGrown] = useState(false);
  useEffect(() => {
    setGrown(false);
    const r1 = requestAnimationFrame(() => { const r2 = requestAnimationFrame(() => setGrown(true)); return () => cancelAnimationFrame(r2); });
    return () => cancelAnimationFrame(r1);
  }, [sig]);
  return h("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
    items.map((b) => h("div", { key: b.label, style: { display: "flex", alignItems: "center", gap: 10 } },
      h("div", { style: { width: 150, fontSize: 11.5, color: "var(--txm)", fontWeight: 600, flexShrink: 0 } }, b.label),
      h("div", { className: "bar-track", style: { flex: 1 } },
        h("div", {
          className: "bar-fill",
          title: b.label + ": " + b.value,
          style: { width: grown ? (b.value / max * 100) + "%" : "0%", "--glow": b.color, background: b.color, minWidth: grown && b.value > 0 ? 6 : 0 },
        })
      ),
      h("div", { style: { width: 36, textAlign: "right", fontSize: 12.5, fontWeight: 700 } }, b.value)
    ))
  );
}

const MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function fmtMesCorto(yyyymm) {
  const [y, m] = yyyymm.split("-");
  return MESES_CORTOS[Number(m) - 1] + "-" + y.slice(2);
}

function fmtMontoMoneda(v, moneda) {
  if (moneda === "CLP") return fmtMoney(v);
  return moneda + " " + Number(v).toLocaleString("es-CL", { maximumFractionDigits: 2 });
}

// Grafico de barras verticales por mes. `data`: [{ mes: "2026-09", barras: [{label,value,color}] }, ...] ya ordenado.
// Medidor de una sola proporcion (0-100%): el relleno usa el acento, la pista
// un paso mas claro de la misma rampa — nunca una torta de 2 secciones para
// esto, un medidor es mas preciso y legible para un ratio simple.
function Medidor({ pct, etiqueta, facturado, oc, moneda }) {
  const pctClamp = Math.max(0, Math.min(100, pct));
  return h("div", null,
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 } },
      h("div", { style: { fontSize: 12.5, fontWeight: 600, color: "var(--txm)" } }, etiqueta),
      h("div", { style: { fontSize: 24, fontWeight: 700, color: "var(--acc)" } }, Math.round(pctClamp) + "%"),
    ),
    h("div", { className: "bar-track", style: { height: 16, background: "var(--accbg)" } },
      h("div", { className: "bar-fill", style: { width: pctClamp + "%", background: "var(--acc)", "--glow": "var(--acc)" } }),
    ),
    facturado !== undefined && h("div", { style: { marginTop: 12, display: "flex", flexDirection: "column", gap: 4 } },
      h("div", { style: { fontSize: 16, fontWeight: 700, color: "var(--green)" } }, fmtMontoMoneda(facturado, moneda) + " facturado"),
      h("div", { style: { fontSize: 15, fontWeight: 600, color: "var(--tx)" } }, "de " + fmtMontoMoneda(oc, moneda) + " en OC"),
    ),
  );
}

// Un color fijo por mes del año (identidad categorica, no un degrade por
// recencia) -- asi "febrero" es el mismo color en la torta, en la barra y en
// cualquier otro grafico del Dashboard. Orden validado con el script del
// skill de dataviz (6 checks, pares adyacentes) contra la superficie clara
// de esta app -- ver docs/superpowers/specs si se vuelve a tocar.
const PALETA_MESES = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948", "#1a85b8", "#6b7a1e", "#a8447a", "#4a7a2e"];
function colorPorMes(mes) {
  const mm = Number((mes || "").slice(5, 7)) || 1;
  return PALETA_MESES[(mm - 1 + 12) % 12];
}
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace("#", ""), 16);
  return "rgba(" + [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(",") + "," + alpha + ")";
}

function polarACartesiano(cx, cy, r, anguloDeg) {
  const rad = (anguloDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function trazoAnillo(cx, cy, rExt, rInt, anguloInicio, anguloFin) {
  const startOuter = polarACartesiano(cx, cy, rExt, anguloFin);
  const endOuter = polarACartesiano(cx, cy, rExt, anguloInicio);
  const startInner = polarACartesiano(cx, cy, rInt, anguloInicio);
  const endInner = polarACartesiano(cx, cy, rInt, anguloFin);
  const largeArc = anguloFin - anguloInicio > 180 ? 1 : 0;
  return ["M", startOuter.x, startOuter.y, "A", rExt, rExt, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", startInner.x, startInner.y, "A", rInt, rInt, 0, largeArc, 1, endInner.x, endInner.y, "Z"].join(" ");
}

// Torta (donut) de participacion por mes sobre el total del periodo.
function DonutParticipacion({ data, moneda }) {
  const total = data.reduce((s, d) => s + d.valor, 0);
  if (total <= 0) return null;
  const R = 68, r = 40, cx = 76, cy = 76, gapDeg = data.length > 1 ? 1.6 : 0;

  let acumulado = 0;
  const slices = data.map((d, i) => {
    const frac = d.valor / total;
    const inicio = acumulado * 360 + gapDeg / 2;
    acumulado += frac;
    const fin = acumulado * 360 - gapDeg / 2;
    return {
      ...d, pct: frac * 100,
      color: colorPorMes(d.mes),
      path: fin > inicio ? trazoAnillo(cx, cy, R, r, inicio, fin) : null,
    };
  });

  return h("div", { style: { display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" } },
    h("div", { style: { display: "flex", flexDirection: "column", gap: 6, flex: 1, minWidth: 140 } },
      slices.map((s, i) => h("div", { key: i, style: { display: "flex", alignItems: "center", gap: 8, fontSize: 11.5 } },
        h("span", { className: "stat-dot", style: { background: s.color, flexShrink: 0 } }),
        h("span", { style: { color: "var(--txm)", flex: 1 } }, fmtMesCorto(s.mes)),
        h("span", { style: { fontWeight: 700, color: "var(--tx)" } }, s.pct.toFixed(1) + "%"),
      )),
    ),
    h("div", { style: { position: "relative", flexShrink: 0 } },
      h("svg", { width: 152, height: 152, viewBox: "0 0 152 152" },
        slices.map((s, i) => s.path && h("path", {
          key: i, d: s.path, fill: s.color,
        }, h("title", null, fmtMesCorto(s.mes) + ": " + fmtMontoMoneda(s.valor, moneda) + " (" + s.pct.toFixed(1) + "%)"))),
      ),
      h("div", {
        style: {
          position: "absolute", inset: 0, display: "flex", flexDirection: "column",
          alignItems: "center", justifyContent: "center", pointerEvents: "none", textAlign: "center",
        },
      },
        h("div", { style: { fontSize: 9.5, color: "var(--txm)", fontWeight: 700, textTransform: "uppercase", letterSpacing: ".04em" } }, "Total"),
        h("div", { style: { fontSize: 13, fontWeight: 700, color: "var(--tx)" } }, fmtMontoMoneda(total, moneda)),
      ),
    ),
  );
}

function fmtCompacto(v, moneda) {
  const abs = Math.abs(v);
  const signo = v < 0 ? "-" : "";
  if (moneda === "CLP") {
    if (abs >= 1e9) return signo + "$" + (abs / 1e9).toFixed(1).replace(/\.0$/, "") + "MM";
    if (abs >= 1e6) return signo + "$" + (abs / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (abs >= 1e3) return signo + "$" + (abs / 1e3).toFixed(0) + "K";
    return fmtMoney(v);
  }
  return moneda + " " + Number(v).toLocaleString("es-CL", { maximumFractionDigits: 1 });
}

// Redondea a un numero "limpio" para las marcas del eje Y (0 / 1.000 / 2.000...).
function numeroLimpio(rango, redondear) {
  const exp = Math.floor(Math.log10(rango || 1));
  const frac = rango / Math.pow(10, exp);
  let fracLimpia;
  if (redondear) fracLimpia = frac < 1.5 ? 1 : frac < 3 ? 2 : frac < 7 ? 5 : 10;
  else fracLimpia = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
  return fracLimpia * Math.pow(10, exp);
}
function marcasEjeY(max, cantidad) {
  if (max <= 0) return [0];
  const maxLimpio = numeroLimpio(max, false);
  const paso = numeroLimpio(maxLimpio / (cantidad - 1), true);
  const marcas = [];
  for (let v = 0; v <= maxLimpio + paso * 0.5; v += paso) marcas.push(Math.round(v * 100) / 100);
  return marcas;
}

function GraficoMensual({ data, moneda, techo, subLabel }) {
  const [grown, setGrown] = useState(false);
  const sig = data.map((d) => d.mes + ":" + d.barras.map((b) => b.value).join(",")).join("|");
  useEffect(() => {
    setGrown(false);
    const r1 = requestAnimationFrame(() => { const r2 = requestAnimationFrame(() => setGrown(true)); return () => cancelAnimationFrame(r2); });
    return () => cancelAnimationFrame(r1);
  }, [sig]);

  const maxDato = Math.max(1, ...data.flatMap((d) => d.barras.map((b) => b.value)));
  // Techo manual (ej. 400M) evita que el eje se estire de mas por un valor
  // puntual alto en otro periodo, dejando las barras chicas por defecto.
  const marcas = techo ? [0, techo / 4, techo / 2, techo * 3 / 4, techo] : marcasEjeY(maxDato, 4);
  const maxEscala = marcas[marcas.length - 1] || maxDato;
  const ALTO = 140;
  const ZONA = ALTO - (subLabel ? 28 : 16); // deja aire arriba para la(s) etiqueta(s) de la barra mas alta

  return h("div", { style: { display: "flex" } },
    h("div", { style: { position: "relative", width: 56, flexShrink: 0, height: ALTO } },
      marcas.map((m, i) => h("div", {
        key: i,
        style: {
          position: "absolute", right: 8, bottom: (m / maxEscala) * ZONA + "px", transform: "translateY(50%)",
          fontSize: 9.5, color: "var(--txm)", whiteSpace: "nowrap",
        },
      }, fmtCompacto(m, moneda))),
    ),
    h("div", { style: { overflowX: "auto", flex: 1 } },
      h("div", { style: { position: "relative", minWidth: "min-content" } },
        h("div", { style: { position: "absolute", left: 0, right: 0, top: 0, height: ALTO } },
          marcas.map((m, i) => h("div", {
            key: i,
            style: { position: "absolute", left: 0, right: 0, bottom: (m / maxEscala) * ZONA + "px", borderTop: "1px solid var(--bdr)" },
          }))
        ),
        h("div", { style: { display: "flex", alignItems: "flex-start", gap: 16, minHeight: ALTO + 40, padding: "0 4px", position: "relative" } },
          data.map((d) => h("div", { key: d.mes, style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 8, flexShrink: 0 } },
            h("div", { style: { display: "flex", alignItems: "flex-end", gap: 4, height: ALTO } },
              d.barras.map((b, i) => h("div", { key: i, style: { display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" } },
                grown && b.value > 0 && h("div", { style: { marginBottom: 3, textAlign: "center" } },
                  h("div", { style: { fontSize: 9, fontWeight: 700, color: "var(--txm)", whiteSpace: "nowrap" } }, fmtCompacto(b.value, moneda)),
                  subLabel && h("div", { style: { fontSize: 8, color: "var(--txd)", whiteSpace: "nowrap" } }, subLabel(b.value)),
                ),
                h("div", {
                  title: b.label + " " + fmtMesCorto(d.mes) + ": " + fmtMontoMoneda(b.value, moneda),
                  className: "bar-fill", style: {
                    width: 16, borderRadius: "4px 4px 0 0", background: b.color, "--glow": b.color,
                    height: grown ? Math.max(2, (b.value / maxEscala) * ZONA) + "px" : "0px",
                    transition: "height 1.1s cubic-bezier(.22,.9,.24,1)",
                  },
                }),
              ))
            ),
            h("div", { style: { fontSize: 10, color: "var(--txm)", fontWeight: 600, whiteSpace: "nowrap" } }, fmtMesCorto(d.mes)),
          )),
        ),
      ),
    ),
  );
}

// Los 12 meses del año en curso (ej. "2026-01".."2026-12"), para que el
// grafico siempre tenga el mismo ancho/cantidad de columnas -- sin esto, la
// barra se veia mas angosta o mas ancha segun cuantos meses tuvieran OC
// cargadas hasta el momento.
function mesesDelAnioActual() {
  const anio = new Date().getFullYear();
  return Array.from({ length: 12 }, (_, i) => anio + "-" + String(i + 1).padStart(2, "0"));
}

function agruparMontoPorMesYMoneda(ordenes) {
  const porMoneda = {};
  ordenes.forEach((o) => {
    if (!o.fecha || !o.monto_total) return;
    const moneda = o.moneda || "CLP";
    const mes = o.fecha.slice(0, 7);
    porMoneda[moneda] = porMoneda[moneda] || {};
    porMoneda[moneda][mes] = (porMoneda[moneda][mes] || 0) + Number(o.monto_total);
  });
  const resultado = {};
  Object.keys(porMoneda).forEach((moneda) => {
    const meses = new Set([...Object.keys(porMoneda[moneda]), ...mesesDelAnioActual()]);
    resultado[moneda] = Array.from(meses).sort().map((mes) => ({
      mes, barras: [{ label: "Total OC", value: porMoneda[moneda][mes] || 0, color: colorPorMes(mes) }],
    }));
  });
  return resultado;
}

function agruparOCvsFacturadoPorMesYMoneda(ordenes) {
  const porMoneda = {};
  ordenes.forEach((o) => {
    if (!o.fecha) return;
    const moneda = o.moneda || "CLP";
    const mes = o.fecha.slice(0, 7);
    porMoneda[moneda] = porMoneda[moneda] || {};
    porMoneda[moneda][mes] = porMoneda[moneda][mes] || { oc: 0, facturado: 0 };
    // monto_facturado es siempre el total de la factura EN PESOS (asi
    // funcionan las facturas electronicas chilenas, incluso para una OC en
    // UF -- el IVA nunca se expresa en UF). Sumarlo tal cual bajo el balde
    // "UF" mezclaba pesos con UF (un desfase de ~40.000x, el numero
    // disparatado que se veia en el grafico). Para una OC en UF se compara
    // neto contra neto, ambos en UF de verdad: monto_neto (OC) contra
    // monto_facturado_uf (lo unico que la factura expresa en UF).
    const esUF = moneda === "UF";
    porMoneda[moneda][mes].oc += Number(esUF ? o.monto_neto : o.monto_total) || 0;
    const facturado = esUF ? o.monto_facturado_uf : o.monto_facturado;
    if (facturado != null) porMoneda[moneda][mes].facturado += Number(facturado) || 0;
  });
  const resultado = {};
  Object.keys(porMoneda).forEach((moneda) => {
    const meses = new Set([...Object.keys(porMoneda[moneda]), ...mesesDelAnioActual()]);
    resultado[moneda] = Array.from(meses).sort().map((mes) => {
      const d = porMoneda[moneda][mes] || { oc: 0, facturado: 0 };
      return {
        mes, barras: [
          // Mismo color del mes para las 2 barras -- OC solida, Facturado en
          // un tono mas claro del mismo color (no un color distinto), para
          // que ambas se reconozcan como "el mismo mes" en todos los graficos.
          { label: "OC", value: d.oc, color: colorPorMes(mes) },
          { label: "Facturado", value: d.facturado, color: hexToRgba(colorPorMes(mes), 0.4) },
        ],
      };
    });
  });
  return resultado;
}

function Dashboard({ ordenes, onVerEstado }) {
  // Valor de la UF de hoy, solo para mostrar un equivalente aproximado en
  // pesos junto a cada barra en UF -- si falla la consulta, simplemente no
  // se muestra el paréntesis (el grafico en UF sigue funcionando igual).
  const [valorUF, setValorUF] = useState(null);
  useEffect(() => {
    fetch("https://mindicador.cl/api/uf")
      .then((r) => r.json())
      .then((d) => setValorUF(d?.serie?.[0]?.valor || null))
      .catch(() => {});
  }, []);

  const counts = useMemo(() => {
    const c = { "Borrador": 0, "Pendiente aprobación": 0, "Aprobada": 0, "Facturada": 0, "Completada": 0, "Otros (histórico)": 0 };
    ordenes.forEach((o) => { c[normalizarEstadoCategoria(o.estado)]++; });
    return c;
  }, [ordenes]);

  // "categoria" es el valor que devuelve normalizarEstadoCategoria -- se usa
  // para filtrar Órdenes al hacer clic (Total = null = sin filtro, ve todas).
  const items = [
    { label: "Borrador", categoria: "Borrador", value: counts["Borrador"], color: "var(--txm)" },
    { label: "Pendiente aprobación", categoria: "Pendiente aprobación", value: counts["Pendiente aprobación"], color: "var(--amber)" },
    { label: "Aprobadas", categoria: "Aprobada", value: counts["Aprobada"], color: "var(--green)" },
    { label: "Facturadas", categoria: "Facturada", value: counts["Facturada"], color: "var(--acc2)" },
    { label: "Completadas", categoria: "Completada", value: counts["Completada"], color: "var(--acc)" },
    ...(counts["Otros (histórico)"] > 0 ? [{ label: "Otros (histórico)", categoria: "Otros (histórico)", value: counts["Otros (histórico)"], color: "var(--red)" }] : []),
    { label: "Total", categoria: null, value: ordenes.length, color: "var(--tx)" },
  ];

  const montoPorMes = useMemo(() => agruparMontoPorMesYMoneda(ordenes), [ordenes]);
  const ocVsFacturado = useMemo(() => agruparOCvsFacturadoPorMesYMoneda(ordenes), [ordenes]);

  return h("div", { className: "page fade-up" },
    h("div", { style: { display: "flex", gap: 20, flexWrap: "wrap", alignItems: "stretch" } },
      h("div", { className: "card", style: { flex: "1 1 440px" } },
        h("h2", null, "Estado de Órdenes de Compra"),
        h("div", { className: "stat-strip" },
          items.map((it) => h("div", {
            key: it.label, className: "stat-item",
            onClick: () => onVerEstado(it.categoria),
          },
            h("div", { className: "stat-num", style: { color: it.color } }, it.value),
            h("div", { className: "stat-lbl" }, h("span", { className: "stat-dot", style: { background: it.color } }), it.label),
          )),
        ),
      ),
      h("div", { className: "card", style: { flex: "1 1 440px" } },
        h("h2", null, "Distribución por Estado"),
        h("div", { style: { marginTop: 16 } },
          h(BarraEstadosOC, { items: items.filter((it) => it.label !== "Total") }),
        ),
      ),
    ),
    h("div", { style: { display: "flex", gap: 20, flexWrap: "wrap", alignItems: "flex-start", marginTop: 20 } },
      // Ancho suficiente para que entren los 12 meses del año sin scroll
      // horizontal en pantallas normales (si la ventana es angosta, el
      // grafico se desplaza solo dentro de su propia tarjeta, no la pagina).
      montoPorMes.UF && h("div", { className: "card", style: { flex: "0 1 620px" } },
        h("h2", null, "Monto Total de OC por Mes"),
        h("div", { style: { marginTop: 18 } },
          h(GraficoMensual, {
            data: montoPorMes.UF, moneda: "UF",
            subLabel: valorUF ? (v) => "(" + fmtCompacto(v * valorUF, "CLP") + ")" : null,
          }),
          h("div", { style: { marginTop: 18, maxWidth: 440 } },
            h(DonutParticipacion, { data: montoPorMes.UF.map((d) => ({ mes: d.mes, valor: d.barras[0].value })), moneda: "UF" }),
          ),
        ),
      ),
      ocVsFacturado.UF && ocVsFacturado.UF.some((d) => d.barras[1].value > 0) && h("div", { className: "card", style: { flex: "0 1 620px" } },
        h("h2", null, "OC vs. Monto Facturado"),
        h("p", { className: "hint", style: { marginBottom: 4 } }, "Compara lo emitido en órdenes de compra contra lo efectivamente facturado por mes."),
        (() => {
          const totales = ocVsFacturado.UF.reduce((acc, d) => ({
            oc: acc.oc + d.barras[0].value, facturado: acc.facturado + d.barras[1].value,
          }), { oc: 0, facturado: 0 });
          const pct = totales.oc > 0 ? (totales.facturado / totales.oc) * 100 : 0;
          return h("div", { style: { marginTop: 18 } },
            h(GraficoMensual, {
              data: ocVsFacturado.UF, moneda: "UF",
              subLabel: valorUF ? (v) => "(" + fmtCompacto(v * valorUF, "CLP") + ")" : null,
            }),
            h(Medidor, {
              pct, etiqueta: "% Facturado del Total OC",
              facturado: totales.facturado, oc: totales.oc, moneda: "UF",
            }),
          );
        })(),
        h("div", { className: "row-inline", style: { marginTop: 12, gap: 16 } },
          h("span", { style: { display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--txm)" } }, h("span", { className: "stat-dot", style: { background: "var(--tx)" } }), "OC (color del mes)"),
          h("span", { style: { display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--txm)" } }, h("span", { className: "stat-dot", style: { background: "var(--tx)", opacity: .4 } }), "Facturado (mismo color, más claro)"),
        ),
      ),
    ),
  );
}

function rendicionFormBlank() {
  return {
    fecha_gasto: new Date().toISOString().slice(0, 10),
    nombre_apellido: "", descripcion: "", monto: "", cuenta_contable_codigo: "",
  };
}

function RendicionComprobanteModal({ rendicion, onClose, onDone, notify }) {
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    if (!file) return notify("err", "Selecciona el comprobante de pago");
    setSaving(true);
    try {
      const base64 = await fileToBase64(file);
      const up = await api("upload", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, base64 }),
      });
      await api("rendiciones?id=" + rendicion.id, {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ archivo_comprobante_url: up.url, archivo_comprobante_nombre: file.name }),
      });
      notify("ok", "Rendición marcada como Pagada");
      onDone();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 420 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, "Subir comprobante de pago"),
        h("button", { className: "modal-close", onClick: onClose }, "×"),
      ),
      h("p", { style: { fontSize: 13, color: "var(--txm)", marginBottom: 12 } },
        "Rendición de " + rendicion.nombre_apellido + " — " + fmtMoney(rendicion.monto)),
      h("input", {
        type: "file", id: "comprobante-file", style: { display: "none" },
        accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
        onChange: (e) => setFile(e.target.files[0] || null),
      }),
      h("label", {
        htmlFor: "comprobante-file",
        className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
        style: { display: "block" },
        ...fileDropHandlers(setFile, setDragOver),
      }, file ? ("✓ " + file.name) : "Haz clic o arrastra aquí el comprobante de pago"),
      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 16 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", { className: "btn-primary", onClick: submit, disabled: saving }, saving ? "Guardando..." : "Confirmar"),
      ),
    )
  );
}

function RendicionGastosPage({ rendiciones, refreshRendiciones, catalogos, notify, currentUser, empresaId }) {
  const [form, setForm] = useState(rendicionFormBlank());
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [subiendoComprobante, setSubiendoComprobante] = useState(null);

  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const registrarGasto = async () => {
    if (!form.fecha_gasto || !form.nombre_apellido || !form.monto) {
      return notify("err", "Fecha del Gasto, Nombre y Apellido y Monto son obligatorios");
    }
    setSaving(true);
    try {
      let archivo_boleta_url = null, archivo_boleta_nombre = null;
      if (file) {
        const base64 = await fileToBase64(file);
        const up = await api("upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, base64 }),
        });
        archivo_boleta_url = up.url;
        archivo_boleta_nombre = file.name;
      }
      const { rendicion } = await api("rendiciones", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, archivo_boleta_url, archivo_boleta_nombre, empresa_id: empresaId }),
      });
      notify("ok", "Gasto registrado: " + rendicion.nombre_apellido);
      setForm(rendicionFormBlank());
      setFile(null);
      refreshRendiciones();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const eliminarRendicion = async (r) => {
    if (!window.confirm("¿Eliminar la rendición de \"" + r.nombre_apellido + "\"?")) return;
    try {
      await api("rendiciones?id=" + r.id, { method: "DELETE" });
      notify("ok", "Rendición eliminada");
      refreshRendiciones();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const puedeEliminar = currentUser && currentUser.nivel_aprobacion === 1;

  const cuentaContableLabel = (codigo) => {
    if (!codigo) return "—";
    const c = catalogos.cuentasContables.find((cc) => cc.codigo === codigo);
    return c ? c.codigo + " — " + c.descripcion : codigo;
  };

  const columns = useMemo(() => [
    { key: "fecha_gasto", label: "Fecha del Gasto", render: (r) => fmtDate(r.fecha_gasto) },
    { key: "nombre_apellido", label: "Nombre y Apellido" },
    { key: "descripcion", label: "Descripción", render: (r) => truncar(r.descripcion, 220) },
    { key: "monto", label: "Monto", render: (r) => fmtMoney(r.monto) },
    { key: "cuenta_contable_codigo", label: "Cuenta Contable", render: (r) => truncar(cuentaContableLabel(r.cuenta_contable_codigo), 200) },
    { key: "estado", label: "Estado", render: (r) => estadoPill(r.estado) },
    { key: "archivo_boleta", label: "Boleta", sortable: false, render: (r) => (r.archivo_boleta_url ? h("a", { className: "link", href: r.archivo_boleta_url, target: "_blank", rel: "noreferrer" }, truncar(r.archivo_boleta_nombre || "Ver", 160)) : "—") },
    {
      key: "comprobante", label: "Comprobante de Pago", sortable: false,
      render: (r) => r.archivo_comprobante_url
        ? h("a", { className: "link", href: r.archivo_comprobante_url, target: "_blank", rel: "noreferrer" }, truncar(r.archivo_comprobante_nombre || "Ver", 160))
        : h("button", { className: "btn-ghost", style: { padding: "4px 10px", fontSize: 11 }, onClick: () => setSubiendoComprobante(r) }, "Subir comprobante"),
    },
    ...(puedeEliminar ? [{
      key: "eliminar", label: "", sortable: false,
      render: (r) => h("button", { className: "btn-ghost", title: "Eliminar", style: { padding: "4px 8px", fontSize: 12, color: "var(--red)" }, onClick: () => eliminarRendicion(r) }, "🗑"),
    }] : []),
  ], [catalogos.cuentasContables, puedeEliminar]);

  return h("div", { className: "page fade-up" },
    subiendoComprobante && h(RendicionComprobanteModal, {
      rendicion: subiendoComprobante, notify,
      onClose: () => setSubiendoComprobante(null),
      onDone: () => { setSubiendoComprobante(null); refreshRendiciones(); },
    }),

    h("div", { className: "card" },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 14 } },
        h("h2", { style: { marginBottom: 0 } }, "Rendición de Gastos"),
        h("div", { className: "hint", style: { fontSize: 12 } }, "(" + fmtDate(new Date().toISOString().slice(0, 10)) + ")"),
      ),

      h("div", { className: "grid3" },
        h(Field, { label: "Fecha del Gasto *" }, h("input", { type: "date", value: form.fecha_gasto, onChange: set("fecha_gasto") })),
        h(Field, { label: "Nombre y Apellido *" }, h("input", { value: form.nombre_apellido, onChange: set("nombre_apellido") })),
        h(Field, { label: "Monto *" }, h("input", { type: "number", value: form.monto, onChange: set("monto") })),
      ),
      h("div", { className: "grid2" },
        h(Field, { label: "Descripción" }, h("input", { value: form.descripcion, onChange: set("descripcion") })),
        h(Field, { label: "Cuenta Contable" },
          h(SearchSelect, {
            options: catalogos.cuentasContables.map((c) => ({ value: c.codigo, label: c.codigo + " — " + c.descripcion })),
            value: form.cuenta_contable_codigo,
            onChange: (v) => setForm((f) => ({ ...f, cuenta_contable_codigo: v })),
            placeholder: "Escribe para buscar cuenta contable...",
          })),
      ),

      h("div", { className: "section-lbl" }, "Boleta"),
      h("input", {
        type: "file", id: "boleta-file", style: { display: "none" },
        accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
        onChange: (e) => setFile(e.target.files[0] || null),
      }),
      h("label", {
        htmlFor: "boleta-file",
        className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
        style: { display: "block" },
        ...fileDropHandlers(setFile, setDragOver),
      }, file ? ("✓ " + file.name) : "Haz clic o arrastra aquí la boleta (PDF / Word / Excel / JPG / PNG)"),

      h("div", { style: { display: "flex", justifyContent: "flex-end", marginTop: 16 } },
        h("button", { className: "btn-primary", onClick: registrarGasto, disabled: saving }, saving ? "Guardando..." : "Registrar Gasto"),
      ),
    ),

    h("div", { className: "card", style: { marginTop: 20 } },
      h("h2", null, "Rendiciones Ingresadas"),
      h(DataTable, {
        columns, rows: rendiciones, rowKey: (r) => r.id,
        searchFields: ["nombre_apellido", "descripcion"],
        searchPlaceholder: "Buscar por nombre o descripción",
        emptyText: "No hay rendiciones ingresadas todavía",
      }),
    ),
  );
}

function App({ currentUser, onLogout }) {
  const [tab, setTab] = useState("dashboard");
  // Filtro de estado al entrar a Órdenes desde un cuadro del Dashboard (ej.
  // clic en "Facturadas" muestra solo esas) -- null = sin filtro, se ven
  // todas. El botón de navegación "Órdenes" siempre lo limpia.
  const [filtroEstadoOrdenes, setFiltroEstadoOrdenes] = useState(null);
  const [proveedores, setProveedores] = useState([]);
  const [ordenes, setOrdenes] = useState([]);
  const [rendiciones, setRendiciones] = useState([]);
  const [usuarios, setUsuarios] = useState([]);
  const [proyectos, setProyectos] = useState([]);
  const [proyectosTodos, setProyectosTodos] = useState([]);
  const [catalogos, setCatalogos] = useState({ centrosCosto: [], cuentasContables: [], regiones: [], ciudades: [], listos: false });
  const [catalogosTodos, setCatalogosTodos] = useState({ centrosCosto: [], cuentasContables: [] });
  const [notif, notify] = useNotif();
  const [empresas, setEmpresas] = useState([]);
  const [empresaId, setEmpresaIdState] = useState(() => {
    if (currentUser.empresa_id) return currentUser.empresa_id;
    try { return Number(localStorage.getItem("ocsys_empresa_id")) || 1; } catch (e) { return 1; }
  });
  const setEmpresaId = (id) => {
    if (currentUser.empresa_id) return; // usuario atado a una empresa fija: no puede cambiarla
    setEmpresaIdState(id);
    try { localStorage.setItem("ocsys_empresa_id", String(id)); } catch (e) { /* modo privado u otro bloqueo: no persiste, no es critico */ }
  };

  const loadProveedores = useCallback(() => {
    api("proveedores").then((d) => setProveedores(d.proveedores)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadOrdenes = useCallback(() => {
    api("ordenes?empresa_id=" + empresaId).then((d) => setOrdenes(d.ordenes)).catch((e) => notify("err", e.message));
  }, [notify, empresaId]);

  const loadUsuarios = useCallback(() => {
    api("usuarios").then((d) => setUsuarios(d.usuarios)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadRendiciones = useCallback(() => {
    api("rendiciones?empresa_id=" + empresaId).then((d) => setRendiciones(d.rendiciones)).catch((e) => notify("err", e.message));
  }, [notify, empresaId]);

  const loadCatalogos = useCallback((intento = 1) => {
    api("catalogos?empresa_id=" + empresaId, { timeoutMs: 15000 })
      .then((d) => setCatalogos({ ...d, listos: true }))
      .catch((e) => {
        if (intento < 3) {
          setTimeout(() => loadCatalogos(intento + 1), 1500 * intento);
        } else {
          notify("err", "No se pudieron cargar los catálogos (Centro de Costo / Región / Cuenta Contable): " + e.message + " — recarga la página para reintentar.");
          setCatalogos((c) => ({ ...c, listos: true }));
        }
      });
  }, [notify, empresaId]);

  const loadEmpresas = useCallback(() => {
    api("empresas").then((d) => setEmpresas(d.empresas)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadProyectos = useCallback(() => {
    api("proyectos?empresa_id=" + empresaId).then((d) => setProyectos(d.proyectos)).catch((e) => notify("err", e.message));
  }, [notify, empresaId]);

  const loadProyectosTodos = useCallback(() => {
    api("proyectos?all=1").then((d) => setProyectosTodos(d.proyectos)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadCatalogosTodos = useCallback(() => {
    api("catalogos?all=1", { timeoutMs: 15000 })
      .then((d) => setCatalogosTodos({ centrosCosto: d.centrosCosto, cuentasContables: d.cuentasContables }))
      .catch((e) => notify("err", e.message));
  }, [notify]);

  useEffect(() => {
    loadEmpresas();
    loadProveedores();
    // Cualquier usuario puede pedir esto -- la API le devuelve su propia
    // fila nada mas (o la lista completa si es el superadmin).
    loadUsuarios();
    loadProyectosTodos();
    loadCatalogosTodos();
  }, []);

  useEffect(() => {
    setCatalogos((c) => ({ ...c, listos: false }));
    loadOrdenes();
    loadRendiciones();
    loadCatalogos();
    loadProyectos();
  }, [empresaId]);

  useEffect(() => {
    document.documentElement.setAttribute("data-empresa", String(empresaId));
  }, [empresaId]);

  const empresaActual = empresas.find((e) => e.id === empresaId);
  // Rendición de Gastos, Proveedores, Reportes y Proyectos (bitácora) son
  // herramientas internas -- solo personal con correo @patagonica.cl, sin
  // importar su nivel de aprobación o si está atado a una empresa/proyecto.
  const esPatagonica = (currentUser.usuario || "").toLowerCase().endsWith("@patagonica.cl");
  const esGestionObras = (currentUser.usuario || "").toLowerCase().endsWith("@gestionobras.cl");

  return h("div", null,
    notif && h("div", { className: "notif notif-" + (notif.type === "ok" ? "ok" : notif.type === "warn" ? "warn" : "err") }, notif.msg),
    h("div", { className: "header" },
      h("img", { src: (EMPRESA_PDF_INFO[empresaId] || EMPRESA_PDF_INFO[1]).logo, alt: empresaActual ? empresaActual.nombre : "Patagónica" }),
      h("img", { src: "/logo-OCFast.png", alt: "OCFast" }),
      h("div", { style: { flex: 1, display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" } },
        h("div", { className: "sub" }, "Órdenes de Compra" + (empresaActual ? " — " + empresaActual.nombre + " · RUT " + empresaActual.rut : "")),
      ),
      h("div", { style: { fontSize: 12, color: "var(--txm)", display: "flex", alignItems: "center", gap: 12 } },
        esPatagonica && !currentUser.empresa_id && empresas.length > 0 && h("select", {
          value: empresaId, onChange: (e) => setEmpresaId(Number(e.target.value)),
          style: { fontSize: 12, padding: "5px 8px", width: "auto" },
        }, empresas.map((emp) => h("option", { key: emp.id, value: emp.id }, emp.nombre))),
        esGestionObras && h("img", { src: "/logo-gestionaobras.png", alt: "Gestión Obras", style: { height: 48, width: "auto", display: "block" } }),
        (currentUser.nombre || currentUser.usuario),
        h("button", { className: "btn-ghost", style: { padding: "5px 12px", fontSize: 11 }, onClick: onLogout }, "Cerrar sesión"),
      ),
    ),
    h("div", { className: "nav" },
      h("button", { className: "nav-btn" + (tab === "dashboard" ? " active" : ""), onClick: () => setTab("dashboard") }, "Dashboard"),
      h("button", { className: "nav-btn" + (tab === "nueva" ? " active" : ""), onClick: () => setTab("nueva") }, "Nueva OC"),
      h("button", { className: "nav-btn" + (tab === "ordenes" ? " active" : ""), onClick: () => { setFiltroEstadoOrdenes(null); setTab("ordenes"); } }, "Órdenes"),
      esPatagonica && h("button", { className: "nav-btn" + (tab === "rendiciones" ? " active" : ""), onClick: () => setTab("rendiciones") }, "Rendición de Gastos"),
      esPatagonica && h("button", { className: "nav-btn" + (tab === "proveedores" ? " active" : ""), onClick: () => setTab("proveedores") }, "Proveedores"),
      esPatagonica && h("button", { className: "nav-btn" + (tab === "reportes" ? " active" : ""), onClick: () => setTab("reportes") }, "Reportes"),
      h("button", { className: "nav-btn" + (tab === "administracion" ? " active" : ""), onClick: () => setTab("administracion") }, "Administración"),
      esPatagonica && h("button", { className: "nav-btn" + (tab === "proyectos-seguimiento" ? " active" : ""), onClick: () => setTab("proyectos-seguimiento") }, "Proyectos"),
      esPatagonica && h("button", { className: "nav-btn" + (tab === "ot-mantencion" ? " active" : ""), onClick: () => setTab("ot-mantencion") }, "OT Mantención"),
    ),
    tab === "dashboard" && h(Dashboard, {
      ordenes,
      onVerEstado: (categoria) => { setFiltroEstadoOrdenes(categoria); setTab("ordenes"); },
    }),
    tab === "nueva" && h(NuevaOC, { proveedores, catalogos, refreshProveedores: loadProveedores, proyectos, refreshProyectos: loadProyectos, refreshProyectosTodos: loadProyectosTodos, notify, onCreated: loadOrdenes, currentUser, empresaId, empresa: empresaActual }),
    tab === "ordenes" && h(OrdenesList, {
      ordenes, refreshOrdenes: loadOrdenes, notify, currentUser, proveedores, catalogos, proyectos, refreshProyectos: loadProyectos, refreshProyectosTodos: loadProyectosTodos, empresaId, empresa: empresaActual,
      filtroEstadoCategoria: filtroEstadoOrdenes, onLimpiarFiltroEstado: () => setFiltroEstadoOrdenes(null), usuarios,
    }),
    tab === "rendiciones" && esPatagonica && h(RendicionGastosPage, { rendiciones, refreshRendiciones: loadRendiciones, catalogos, notify, currentUser, empresaId }),
    tab === "proveedores" && esPatagonica && h(ProveedoresList, { proveedores, catalogos, refreshProveedores: loadProveedores, notify, currentUser }),
    tab === "reportes" && esPatagonica && h(ReportesList, { ordenes, proveedores, notify }),
    tab === "administracion" && h(AdministracionList, { usuarios, refreshUsuarios: loadUsuarios, notify, currentUser, refreshOrdenes: loadOrdenes, refreshProveedores: loadProveedores, refreshEmpresas: loadEmpresas, empresaId, empresa: empresaActual, empresas, proyectosTodos, catalogosTodos, proveedores }),
    tab === "proyectos-seguimiento" && esPatagonica && h(ProyectosPage, { empresaId, proveedores, notify }),
    tab === "ot-mantencion" && esPatagonica && h(OtMantencionPage, { empresaId, currentUser, proveedores, notify }),
  );
}

function Root() {
  const [checking, setChecking] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);
  const [resetToken, setResetToken] = useState(() => new URLSearchParams(window.location.search).get("reset"));

  const checkSession = useCallback(() => {
    return fetch("/api/auth?action=me")
      .then((r) => (r.ok ? r.json() : null))
      .then(setCurrentUser);
  }, []);

  useEffect(() => {
    if (resetToken) return; // no consume sesión mientras se restablece la contraseña
    checkSession().finally(() => setChecking(false));
    const interval = setInterval(checkSession, 5 * 60 * 1000); // cada 5 min: detecta cierre por inactividad (4h) o medianoche
    return () => clearInterval(interval);
  }, [checkSession, resetToken]);

  const onLogout = () => {
    fetch("/api/auth?action=logout").finally(() => setCurrentUser(null));
  };

  if (resetToken) {
    return h(ResetPasswordScreen, {
      token: resetToken,
      onListo: () => {
        window.history.replaceState({}, "", window.location.pathname);
        setResetToken(null);
        setChecking(true);
      },
    });
  }

  if (checking) return null;
  if (!currentUser) return h(LoginScreen, { onLoggedIn: setCurrentUser });
  return h(App, { currentUser, onLogout });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root));
</script>
</body>
</html>
