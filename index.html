<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OCSys — Órdenes de Compra Patagónica</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#dbe1e8;--surf:#ffffff;--surf2:#eef1f4;--surf3:#e3e8ed;
  --bdr:#c7d0d9;--bdr2:#b0bcc7;
  --tx:#1a2230;--txm:#5c6b7a;--txd:#94a1ad;
  --green:#0a7c4e;--gbg:#e8f5f0;
  --amber:#a05c00;--abg:#fff8e8;
  --red:#c0392b;--rbg:#fdf0ef;
  --acc:#0e4a8f;--acc2:#1b7cb3;--accl:#0a3a70;--accbg:#e8f1fb;
}
html,body,#root{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:13px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:4px}
input,select,textarea{font-family:'DM Mono',monospace;background:var(--surf);border:1px solid var(--bdr);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:12px;outline:none;transition:border 0.2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
input::placeholder,textarea::placeholder{color:var(--txd)}
button{font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.15s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 0.9s linear infinite}
.spinner{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--bdr2);border-top-color:var(--acc);animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes pbar-slide{0%{left:-40%}100%{left:100%}}
.pbar{position:relative;height:4px;background:var(--surf3);border-radius:2px;overflow:hidden;margin-top:10px}
.pbar-fill{position:absolute;top:0;left:-40%;width:40%;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:2px;animation:pbar-slide 1.1s ease-in-out infinite}
.fade-up{animation:fadeUp 0.3s cubic-bezier(.16,1,.3,1)}
.header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:14px 24px;display:flex;align-items:center;gap:16px}
.header img{height:30px}
.header h1{font-size:15px;font-weight:700;color:var(--tx)}
.header .sub{font-size:11px;color:var(--txm)}
.nav{display:flex;gap:8px;padding:14px 24px 0}
.nav-btn{background:transparent;border:1px solid var(--bdr);color:var(--txm);border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600}
.nav-btn:hover{background:var(--surf2);color:var(--tx)}
.nav-btn.active{background:var(--acc);border-color:var(--acc);color:#fff}
.page{padding:20px 24px 60px;max-width:1800px;margin:0 auto}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.card h2{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--tx)}
.section-lbl{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--bdr)}
.section-lbl:first-child{margin-top:0;padding-top:0;border-top:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:600;color:var(--txm)}
.row-inline{display:flex;gap:8px;align-items:flex-end}
.btn-add{background:var(--accbg);border:1px solid var(--acc2);color:var(--acc);width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:700;flex-shrink:0;display:flex;align-items:center;justify-content:center;line-height:1}
.btn-add:hover{background:var(--acc);color:#fff}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:13px;font-weight:700;letter-spacing:-0.2px;box-shadow:0 4px 20px rgba(14,74,143,0.25)}
.btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;border:1px solid var(--bdr);color:var(--txm);border-radius:8px;padding:10px 20px;font-size:12px;font-weight:600}
.btn-ghost:hover{background:var(--surf2)}
.overlay{position:fixed;inset:0;background:rgba(10,20,35,0.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:auto}
.modal{background:var(--surf);border:1px solid var(--bdr2);border-radius:18px;padding:26px 28px;width:680px;max-width:100%;max-height:90vh;overflow:auto;animation:fadeUp 0.25s cubic-bezier(.16,1,.3,1)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-hdr h3{font-size:15px;font-weight:700}
.modal-close{background:transparent;border:none;color:var(--txm);font-size:20px;line-height:1}
.modal-close:hover{color:var(--tx)}
.drop-zone{border:2px dashed var(--bdr2);border-radius:12px;padding:24px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surf2)}
.drop-zone:hover{border-color:var(--acc2);background:var(--surf3)}
.drop-zone.done{border-color:var(--green);border-style:solid;background:var(--gbg)}
.drop-zone.dragover{border-color:var(--acc2);background:var(--surf3);transform:scale(1.01)}
.table-scroll{overflow:auto;max-height:62vh;margin:0 -24px;padding:0 24px}
.table-scroll::-webkit-scrollbar{width:12px;height:12px}
.table-scroll::-webkit-scrollbar-track{background:var(--surf2)}
.table-scroll::-webkit-scrollbar-thumb{background:var(--acc2);border-radius:6px;border:2px solid var(--surf2)}
.table-scroll::-webkit-scrollbar-thumb:hover{background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:max-content}
.table-scroll th{position:sticky;top:0;z-index:1;box-shadow:0 1px 0 var(--bdr)}
th{padding:8px 10px;background:var(--surf2);color:var(--txd);font-weight:700;text-transform:uppercase;font-size:9.5px;letter-spacing:.05em;border-bottom:1px solid var(--bdr);text-align:left;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--bdr);font-size:11.5px;white-space:nowrap}
tr:hover td{background:var(--surf2)}
.pill{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;display:inline-block}
.pill-ok{background:var(--gbg);color:var(--green)}
.pill-pend{background:var(--abg);color:var(--amber)}
.pill-anul{background:var(--rbg);color:var(--red)}
.pill-draft{background:var(--surf3);color:var(--txm)}
.pill-info{background:var(--accbg);color:var(--acc)}
.notif{position:fixed;top:18px;right:18px;z-index:200;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;animation:fadeIn 0.2s;max-width:380px;box-shadow:0 4px 16px rgba(0,0,0,0.15)}
.notif-ok{background:var(--gbg);color:var(--green);border:1px solid #b0dfc8}
.notif-err{background:var(--rbg);color:var(--red);border:1px solid #f0bcb6}
.notif-warn{background:var(--abg);color:var(--amber);border:1px solid #f0dba0}
.empty{padding:40px 20px;text-align:center;color:var(--txd);font-size:12px}
.stat-strip{display:flex;flex-wrap:wrap;margin-top:16px}
.stat-item{flex:1;min-width:130px;padding:6px 24px;text-align:center;border-left:1px dashed var(--bdr2);cursor:pointer;transition:background 0.15s;border-radius:6px}
.stat-item:first-child{border-left:none}
.stat-item:hover{background:var(--surf2)}
.stat-num{font-size:26px;font-weight:700;line-height:1.2}
.stat-lbl{font-size:11.5px;color:var(--txm);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.link{color:var(--acc);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}
.hint{font-size:10.5px;color:var(--txd);margin-top:4px}
.ac-wrap{position:relative;flex:1}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surf);border:1px solid var(--bdr2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.12);max-height:260px;overflow-y:auto;z-index:50}
.ac-item{padding:9px 12px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--bdr)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover{background:var(--surf2)}
.ac-empty{padding:12px;font-size:12px;color:var(--txd)}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}.modal{padding:20px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { useState, useEffect, useCallback, useMemo } = React;

function useNotif() {
  const [notif, setNotif] = useState(null);
  const show = useCallback((type, msg) => {
    setNotif({ type, msg });
    setTimeout(() => setNotif(null), 4000);
  }, []);
  return [notif, show];
}

function fmtMoney(n) {
  if (n === null || n === undefined || n === "") return "—";
  return "$" + Number(n).toLocaleString("es-CL");
}

function fmtDate(d) {
  if (!d) return "—";
  return new Date(d + "T00:00:00").toLocaleDateString("es-CL");
}

function estadoPill(estado) {
  const map = {
    "Borrador": "pill-draft",
    "Pendiente aprobación": "pill-pend", "Pendiente": "pill-pend",
    "Aprobada": "pill-ok", "Aprobado": "pill-ok", "Factura Aprobada": "pill-ok",
    "Completada": "pill-info",
    "Anulado": "pill-anul", "Rechazado": "pill-anul",
  };
  return h("span", { className: "pill " + (map[estado] || "pill-pend") }, estado || "Pendiente");
}

async function api(path, opts) {
  const { timeoutMs, ...rest } = opts || {};
  let timer, signal = rest.signal;
  if (timeoutMs) {
    const ctrl = new AbortController();
    signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), timeoutMs);
  }
  try {
    const res = await fetch("/api/" + path, { ...rest, signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || "Error de servidor");
      err.data = data;
      throw err;
    }
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("La IA está tardando demasiado en responder. Intenta nuevamente o completa los datos manualmente.");
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function formBlank() {
  return {
    proveedor_id: "", fecha: new Date().toISOString().slice(0, 10),
    titulo: "", descripcion: "", motivo: "", gerencia: "", representante_compra: "",
    centro_costo_codigo: "", cuenta_contable_codigo: "",
    tipo_orden: "Afecto", tipo_compra: "Servicios", moneda: "CLP",
    monto_neto: "", monto_iva: "", monto_total: "",
  };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ALLOWED_IA_EXT = ["pdf", "jpg", "jpeg", "png"];

function fileDropHandlers(setFile, setDragOver) {
  return {
    onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
    onDragLeave: (e) => { e.preventDefault(); setDragOver(false); },
    onDrop: (e) => {
      e.preventDefault();
      setDragOver(false);
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setFile(f);
    },
  };
}

const PROVEEDOR_BLANK = {
  razon_social: "", tipo_documento: "Factura Afecta", rut: "", tamano_empresa: "",
  giro_comercial: "", direccion_comercial: "", departamento_oficina: "",
  region: "", ciudad: "", telefono: "", sitio_web: "",
  contacto_nombre: "", contacto_apellido: "", contacto_telefono: "", contacto_celular: "", contacto_correo: "",
  banco: "", tipo_cuenta: "", numero_cuenta: "",
};

function Field({ label, children }) {
  return h("div", { className: "field" }, h("label", null, label), children);
}

function DataTable({ columns, rows, rowKey, searchPlaceholder, searchFields, onRowClick, emptyText }) {
  const [search, setSearch] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const filtered = useMemo(() => {
    if (!search.trim()) return rows;
    const q = search.trim().toLowerCase();
    return rows.filter((r) => (searchFields || []).some((f) => String(r[f] ?? "").toLowerCase().includes(q)));
  }, [rows, search, searchFields]);

  const sorted = useMemo(() => {
    if (!sortKey) return filtered;
    const col = columns.find((c) => c.key === sortKey);
    const getVal = col && col.sortValue ? col.sortValue : (r) => r[sortKey];
    const copy = [...filtered];
    copy.sort((a, b) => {
      let va = getVal(a), vb = getVal(b);
      if (va === null || va === undefined) va = "";
      if (vb === null || vb === undefined) vb = "";
      if (typeof va === "number" && typeof vb === "number") return sortDir === "asc" ? va - vb : vb - va;
      va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return copy;
  }, [filtered, sortKey, sortDir, columns]);

  const toggleSort = (key) => {
    if (sortKey !== key) { setSortKey(key); setSortDir("asc"); }
    else if (sortDir === "asc") setSortDir("desc");
    else { setSortKey(null); setSortDir("asc"); }
  };

  return h(React.Fragment, null,
    searchFields && searchFields.length > 0 && h("input", {
      value: search, onChange: (e) => setSearch(e.target.value),
      placeholder: searchPlaceholder || "Buscar...",
      style: { marginBottom: 12 },
    }),
    rows.length === 0
      ? h("div", { className: "empty" }, emptyText || "Sin datos")
      : sorted.length === 0
      ? h("div", { className: "empty" }, "Sin resultados para \"" + search + "\"")
      : h("div", { className: "table-scroll" },
          h("table", null,
          h("thead", null, h("tr", null,
            columns.map((c) => h("th", {
              key: c.key,
              onClick: c.sortable === false ? undefined : () => toggleSort(c.key),
              style: c.sortable === false ? undefined : { cursor: "pointer", userSelect: "none" },
            }, c.label + (sortKey === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""))),
          )),
          h("tbody", null, sorted.map((row, i) => h("tr", {
            key: rowKey ? rowKey(row) : i,
            style: onRowClick ? { cursor: "pointer" } : undefined,
            onClick: onRowClick ? () => onRowClick(row) : undefined,
          }, columns.map((c) => h("td", { key: c.key }, c.render ? c.render(row) : (row[c.key] ?? "—")))))),
        ))
  );
}

function ProveedorModal({ regiones, catalogosListos, onClose, onCreated, notify, editProveedor, prefill, currentUser }) {
  const [form, setForm] = useState(
    editProveedor ? { ...PROVEEDOR_BLANK, ...editProveedor }
      : prefill ? { ...PROVEEDOR_BLANK, ...prefill }
      : PROVEEDOR_BLANK
  );
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const isEdit = !!editProveedor;

  const submit = async () => {
    if (!form.razon_social || !form.rut) {
      notify("err", "Razón Social y RUT son obligatorios");
      return;
    }
    setSaving(true);
    try {
      const { proveedor } = await api("proveedores" + (isEdit ? "?id=" + editProveedor.id : ""), {
        method: isEdit ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(form),
      });
      notify("ok", (isEdit ? "Proveedor actualizado: " : "Proveedor creado: ") + proveedor.razon_social);
      onCreated(proveedor);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const puedeEliminar = currentUser && currentUser.nivel_aprobacion === 1;

  const eliminar = async () => {
    if (!window.confirm("¿Eliminar el proveedor \"" + editProveedor.razon_social + "\"? Dejará de verse en OCSys y en los informes.")) return;
    setSaving(true);
    try {
      await api("proveedores?id=" + editProveedor.id, { method: "DELETE" });
      notify("ok", "Proveedor eliminado");
      onCreated(null);
      onClose();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal" },
      h("div", { className: "modal-hdr" },
        h("h3", null, isEdit ? "Completar / Editar Proveedor" : "Nuevo Proveedor"),
        h("button", { className: "modal-close", onClick: onClose }, "×")
      ),

      h("div", { className: "section-lbl" }, "Datos para Crear Proveedor"),
      h("div", { className: "grid2" },
        h(Field, { label: "Razón Social *" }, h("input", { value: form.razon_social, onChange: set("razon_social"), placeholder: "Razón social" })),
        h(Field, { label: "RUT *" }, h("input", { value: form.rut, onChange: set("rut"), placeholder: "76.123.456-7" })),
        h(Field, { label: "Boleta / Factura Afecta / Factura Exenta" },
          h("select", { value: form.tipo_documento, onChange: set("tipo_documento") },
            h("option", { value: "Boleta" }, "Boleta"),
            h("option", { value: "Factura Afecta" }, "Factura Afecta"),
            h("option", { value: "Factura Exenta" }, "Factura Exenta"),
          )),
        h(Field, { label: "Tamaño de Empresa" },
          h("select", { value: form.tamano_empresa, onChange: set("tamano_empresa") },
            h("option", { value: "" }, "Selecciona"),
            h("option", { value: "Microempresa" }, "Microempresa"),
            h("option", { value: "Pequeña" }, "Pequeña"),
            h("option", { value: "Mediana" }, "Mediana"),
            h("option", { value: "Grande" }, "Grande"),
          )),
        h(Field, { label: "Giro Comercial" }, h("input", { value: form.giro_comercial, onChange: set("giro_comercial") })),
        h(Field, { label: "Dirección Comercial" }, h("input", { value: form.direccion_comercial, onChange: set("direccion_comercial") })),
        h(Field, { label: "Departamento / Oficina" }, h("input", { value: form.departamento_oficina, onChange: set("departamento_oficina") })),
        h(Field, { label: "Región" },
          h("select", { value: form.region, onChange: set("region"), disabled: !catalogosListos },
            h("option", { value: "" }, catalogosListos ? "Selecciona región" : "Cargando..."),
            (regiones || []).map((r) => h("option", { key: r.id, value: r.nombre }, r.nombre)),
          )),
        h(Field, { label: "Ciudad" }, h("input", { value: form.ciudad, onChange: set("ciudad"), placeholder: "Ciudad" })),
        h(Field, { label: "Teléfono" }, h("input", { value: form.telefono, onChange: set("telefono") })),
        h(Field, { label: "Sitio Web" }, h("input", { value: form.sitio_web, onChange: set("sitio_web") })),
      ),

      h("div", { className: "section-lbl" }, "Datos de Contacto"),
      h("div", { className: "grid2" },
        h(Field, { label: "Nombre Contacto" }, h("input", { value: form.contacto_nombre, onChange: set("contacto_nombre") })),
        h(Field, { label: "Apellido Contacto" }, h("input", { value: form.contacto_apellido, onChange: set("contacto_apellido") })),
        h(Field, { label: "Teléfono Contacto" }, h("input", { value: form.contacto_telefono, onChange: set("contacto_telefono") })),
        h(Field, { label: "Celular Contacto" }, h("input", { value: form.contacto_celular, onChange: set("contacto_celular") })),
        h(Field, { label: "Correo Usuario" }, h("input", { value: form.contacto_correo, onChange: set("contacto_correo"), type: "email" })),
      ),

      h("div", { className: "section-lbl" }, "Datos Bancarios"),
      h("div", { className: "grid3" },
        h(Field, { label: "Banco" }, h("input", { value: form.banco, onChange: set("banco") })),
        h(Field, { label: "Tipo de Cuenta" },
          h("select", { value: form.tipo_cuenta, onChange: set("tipo_cuenta") },
            h("option", { value: "" }, "Selecciona"),
            h("option", { value: "Cuenta Corriente" }, "Cuenta Corriente"),
            h("option", { value: "Cuenta Vista" }, "Cuenta Vista"),
            h("option", { value: "Cuenta de Ahorro" }, "Cuenta de Ahorro"),
          )),
        h(Field, { label: "Número de Cuenta" }, h("input", { value: form.numero_cuenta, onChange: set("numero_cuenta") })),
      ),

      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginTop: 6 } },
        isEdit && puedeEliminar

          : h("div"),
        h("div", { style: { display: "flex", gap: 10 } },

          h("button", { className: "btn-primary", onClick: submit, disabled: saving }, saving ? "Guardando..." : "Aceptar"),
        ),
      ),
    )
  );
}

function distribuirCuotas(n, montoNeto) {
  const neto = Number(montoNeto) || 0;
  const base = Math.floor(neto / n);
  const resto = neto - base * n;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const monto = i === n - 1 ? base + resto : base;
    rows.push({ dias: 0, observacion: (i + 1) + "/" + n, monto, porcentaje: neto ? Math.round((monto / neto) * 100) : 0 });
  }
  return rows;
}

function loadImageAsDataURL(url) {
  return fetch(url)
    .then((r) => r.blob())
    .then((blob) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }));
}

function fmtMontoPdf(n, moneda) {
  const v = Number(n) || 0;
  if (moneda === "UF") return v.toLocaleString("es-CL", { maximumFractionDigits: 2 });
  return v.toLocaleString("es-CL", { maximumFractionDigits: 0 });
}

function NuevaOC({ proveedores, catalogos, refreshProveedores, notify, onCreated, currentUser }) {
  const [showModal, setShowModal] = useState(false);
  const [provPrefill, setProvPrefill] = useState(null);
  const [provEditing, setProvEditing] = useState(null);
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [leyendoIA, setLeyendoIA] = useState(false);
  const [numCuotas, setNumCuotas] = useState(1);
  const [cuotas, setCuotas] = useState(distribuirCuotas(1, 0));
  const [form, setForm] = useState(formBlank());
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const setMontoNeto = (e) => {
    const neto = e.target.value;
    const iva = neto ? Math.round(Number(neto) * 0.19) : "";
    const total = neto ? Math.round(Number(neto) * 1.19) : "";
    setForm((f) => ({ ...f, monto_neto: neto, monto_iva: iva, monto_total: total }));
    setCuotas(distribuirCuotas(numCuotas, neto || 0));
  };

  const setNumCuotasField = (e) => {
    const n = Math.max(1, Number(e.target.value) || 1);
    setNumCuotas(n);
    setCuotas(distribuirCuotas(n, form.monto_neto || 0));
  };

  const handleCreated = (proveedor) => {
    refreshProveedores();
    setForm((f) => ({ ...f, proveedor_id: proveedor.id }));
    setShowModal(false);
    setProvPrefill(null);
    setProvEditing(null);
  };

  const leerConIA = async (fileArg) => {
    const f = fileArg || file;
    if (!f) return;
    setLeyendoIA(true);
    try {
      const base64 = await fileToBase64(f);
      const { datos } = await api("extraer-cotizacion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: f.name, base64 }),
        timeoutMs: 55000,
      });

      const rutNorm = (r) => (r || "").replace(/[^0-9kK]/g, "").toUpperCase();
      const nombreNorm = (n) => (n || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      let proveedorMatch = datos.proveedor_rut
        ? proveedores.find((p) => rutNorm(p.rut) === rutNorm(datos.proveedor_rut))
        : null;
      const matchedByRut = !!proveedorMatch;
      if (!proveedorMatch && datos.proveedor_razon_social) {
        const target = nombreNorm(datos.proveedor_razon_social);
        proveedorMatch = proveedores.find((p) => nombreNorm(p.razon_social) === target)
          || proveedores.find((p) => target.includes(nombreNorm(p.razon_social)) || nombreNorm(p.razon_social).includes(target));
      }

      const neto = datos.monto_neto || 0;
      const nombreContacto = [datos.contacto_nombre, datos.contacto_apellido].filter(Boolean).join(" ");
      setForm((f) => ({
        ...f,
        proveedor_id: proveedorMatch ? proveedorMatch.id : f.proveedor_id,
        titulo: (datos.titulo || "").slice(0, 150) || f.titulo,
        descripcion: datos.descripcion || f.descripcion,
        motivo: datos.motivo || f.motivo,
        representante_compra: f.representante_compra || nombreContacto,
        moneda: datos.moneda || f.moneda,
        monto_neto: neto || f.monto_neto,
        monto_iva: datos.monto_iva !== undefined ? datos.monto_iva : f.monto_iva,
        monto_total: datos.monto_total !== undefined ? datos.monto_total : f.monto_total,
      }));
      if (neto) setCuotas(distribuirCuotas(numCuotas, neto));

      const extraidoProveedor = {
        razon_social: datos.proveedor_razon_social || "",
        rut: datos.proveedor_rut || "",
        contacto_nombre: datos.contacto_nombre || "",
        contacto_apellido: datos.contacto_apellido || "",
        contacto_telefono: datos.contacto_telefono || "",
        contacto_celular: datos.contacto_celular || "",
        contacto_correo: datos.contacto_correo || "",
        banco: datos.banco || "",
        tipo_cuenta: datos.tipo_cuenta || "",
        numero_cuenta: datos.numero_cuenta || "",
      };

      if ((datos.proveedor_rut || datos.proveedor_razon_social) && !proveedorMatch) {
        const nombre = datos.proveedor_razon_social || datos.proveedor_rut;
        notify("err", "Proveedor no existe (" + nombre + ")");
        if (window.confirm("Proveedor no existe: \"" + nombre + "\". ¿Desea agregarlo?")) {
          setProvPrefill(extraidoProveedor);
          setShowModal(true);
        }
      } else if (proveedorMatch && !proveedorMatch.datos_completos && matchedByRut) {
        // Solo se ofrece autocompletar cuando el match fue por RUT (dato fiable);
        // el nombre puede estar ingresado con mayúsculas/minúsculas u otro formato
        // y un match por nombre no garantiza que sea el mismo proveedor.
        const completar = { ...proveedorMatch };
        Object.keys(extraidoProveedor).forEach((k) => { if (!completar[k] && extraidoProveedor[k]) completar[k] = extraidoProveedor[k]; });
        notify("err", "El proveedor \"" + proveedorMatch.razon_social + "\" tiene la ficha incompleta");
        if (window.confirm("El proveedor \"" + proveedorMatch.razon_social + "\" existe pero su ficha está incompleta. ¿Desea completarla con los datos de esta cotización?")) {
          setProvEditing(completar);
          setShowModal(true);
        }
      } else {
        notify("ok", "Cotización leída con IA — revisa los datos antes de generar la OC");
      }
    } catch (e) {
      notify("err", e.message);
    } finally {
      setLeyendoIA(false);
    }
  };

  const handleFileSelected = (f) => {
    setFile(f);
    if (f) {
      const ext = f.name.split(".").pop().toLowerCase();
      if (ALLOWED_IA_EXT.includes(ext)) leerConIA(f);
    }
  };

  const submit = async (estado) => {
    if (!form.proveedor_id) return notify("err", "Selecciona un proveedor");
    if (estado === "Pendiente aprobación" && !form.representante_compra) {
      return notify("err", "Ingresa el Representante de Compra");
    }
    setSaving(true);
    try {
      let archivo_url = null, archivo_nombre = null;
      if (file) {
        const base64 = await fileToBase64(file);
        const up = await api("upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, base64 }),
          timeoutMs: 25000,
        });
        archivo_url = up.url;
        archivo_nombre = file.name;
      }
      const { orden } = await api("ordenes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...form, estado, archivo_url, archivo_nombre, cuotas,
          creado_por: form.representante_compra,
        }),
        timeoutMs: 25000,
      });

      if (estado === "Pendiente aprobación") {
        const proveedor = proveedores.find((p) => p.id === form.proveedor_id);
        const pdfBlob = await generarPdfOC(orden, proveedor, cuotas);
        const pdfBase64 = await fileToBase64(new File([pdfBlob], "OC.pdf", { type: "application/pdf" }));
        const up = await api("upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: orden.numero_oc + ".pdf", base64: pdfBase64 }),
          timeoutMs: 25000,
        });
        await api("ordenes?id=" + orden.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ archivo_oc_url: up.url, archivo_oc_nombre: orden.numero_oc + ".pdf" }),
          timeoutMs: 25000,
        });
      }

      notify("ok", (estado === "Borrador" ? "Borrador guardado: " : "OC generada: ") + orden.numero_oc);
      onCreated();
      setForm(formBlank());
      setFile(null);
      setNumCuotas(1);
      setCuotas(distribuirCuotas(1, 0));
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "page fade-up" },
    showModal && h(ProveedorModal, {
      regiones: catalogos.regiones, catalogosListos: catalogos.listos, prefill: provPrefill, editProveedor: provEditing, currentUser,
      onClose: () => { setShowModal(false); setProvPrefill(null); setProvEditing(null); },
      onCreated: handleCreated, notify,
    }),

    h("div", { className: "card" },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 14 } },
        h("h2", { style: { marginBottom: 0 } }, "Nueva Orden de Compra"),
        h("div", { className: "hint", style: { fontSize: 12 } }, "(" + fmtDate(form.fecha) + ")"),
      ),

      h("div", { className: "section-lbl" }, "Cotización del Proveedor"),
      h("input", {
        type: "file", id: "file-input", style: { display: "none" },
        accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
        onChange: (e) => handleFileSelected(e.target.files[0] || null),
      }),
      h("label", {
        htmlFor: "file-input",
        className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
        style: { display: "block" },
        ...fileDropHandlers(handleFileSelected, setDragOver),
      },
        file ? ("✓ " + file.name) : "Haz clic o arrastra aquí la cotización enviada por el proveedor (PDF / Word / Excel / JPG / PNG)"
      ),
      h("div", { className: "row-inline", style: { marginTop: 10 } },
        h("button", {
          className: "btn-ghost", disabled: !file || leyendoIA || !ALLOWED_IA_EXT.includes((file && file.name.split(".").pop().toLowerCase()) || ""),
          onClick: () => leerConIA(), style: { display: "flex", alignItems: "center", gap: 8 },
        },
          leyendoIA && h("span", { className: "spinner" }),
          leyendoIA ? "Leyendo con IA..." : "Volver a leer con IA",
        ),
        h("div", { className: "hint" }, "Al subir o arrastrar un PDF/JPG/PNG se lee automáticamente con IA y completa el formulario (incluido el proveedor). Word/Excel se completan a mano."),
      ),
      leyendoIA && h("div", { className: "pbar" }, h("div", { className: "pbar-fill" })),
      h("div", { className: "hint", style: { marginTop: 4 } }, "Formatos permitidos para subir: PDF, Word, Excel, JPG, PNG"),

      h(Field, { label: "Proveedor *" },
        h("div", { className: "row-inline" },
          h(ProveedorPicker, {
            proveedores, value: form.proveedor_id,
            onChange: (id) => setForm((f) => ({ ...f, proveedor_id: id })),
          }),
          h("button", { className: "btn-add", title: "Agregar proveedor", onClick: () => setShowModal(true) }, "+"),

function OrdenAccionModal({ orden, tipo, onClose, onDone, notify }) {
  const isAprobar = tipo === "aprobar";
  const [numeroFactura, setNumeroFactura] = useState("");
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    if (!isAprobar && !numeroFactura) return notify("err", "Ingresa el N° de Factura");
    setSaving(true);
    try {
      const payload = isAprobar
        ? { estado: "Aprobada" }
        : { estado: "Completada", numero_factura: numeroFactura };
      if (!isAprobar && file) {
        const base64 = await fileToBase64(file);
        const up = await api("upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, base64 }),
        });
        payload.archivo_factura_url = up.url;
        payload.archivo_factura_nombre = file.name;
      }
      const { orden: actualizada, correoError } = await api("ordenes?id=" + orden.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (isAprobar) {
        notify(correoError ? "warn" : "ok",
          "OC aprobada con HES " + actualizada.numero_hes + (correoError ? " — correo no enviado: " + correoError : " — correo enviado al proveedor"));
      } else {
        notify("ok", "OC completada con Factura " + numeroFactura);
      }
      onDone();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 420 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, (isAprobar ? "Aprobar OC " : "Completar OC ") + orden.numero_oc),
        h("button", { className: "modal-close", onClick: onClose }, "×")
      ),
      isAprobar
        ? h("p", { style: { fontSize: 13, color: "var(--txm)", marginBottom: 4 } },
            "Se asignará automáticamente el N° HES y se enviará un correo al proveedor (" + ((orden.proveedores && orden.proveedores.razon_social) || "") + ") con la Orden de Compra adjunta.")
        : h(React.Fragment, null,
            h(Field, { label: "N° Factura *" }, h("input", { value: numeroFactura, onChange: (e) => setNumeroFactura(e.target.value), autoFocus: true })),
            h(Field, { label: "Factura (PDF/imagen)" },
              h("input", {
                type: "file", id: "factura-file", style: { display: "none" },
                accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
                onChange: (e) => setFile(e.target.files[0] || null),
              })),
            h("label", {
              htmlFor: "factura-file",
              className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
              style: { display: "block" },
              ...fileDropHandlers(setFile, setDragOver),
            },
              file ? ("✓ " + file.name) : "Haz clic o arrastra aquí la factura"),
          ),
      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 16 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", { className: "btn-primary", onClick: submit, disabled: saving }, saving ? "Guardando..." : "Confirmar"),
      ),
    )
  );
}

function truncar(text, maxWidth) {

  return h("span", { title: text, style: { display: "inline-block", maxWidth, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", verticalAlign: "bottom" } }, text);
}

function downloadExcel(filename, rows) {
  if (!rows.length) return false;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Datos");
  XLSX.writeFile(wb, filename);
  return true;
}

function buildOCRows(ordenes) {
  return ordenes.map((o) => ({
    "N° OC": o.numero_oc, Proveedor: o.proveedores ? o.proveedores.razon_social : "",
    RUT: o.proveedores ? o.proveedores.rut : "", Fecha: o.fecha, "Centro Costo": o.centro_costo_codigo,
    "Cuenta Contable": o.cuenta_contable_codigo, "Monto Neto": o.monto_neto, "Monto Total": o.monto_total, Estado: o.estado,
  }));
}

function buildHESRows(ordenes) {
  return ordenes.filter((o) => o.numero_hes || o.numero_egreso).map((o) => ({
    "N° OC": o.numero_oc, "N° HES": o.numero_hes, "N° Egreso": o.numero_egreso,
    Proveedor: o.proveedores ? o.proveedores.razon_social : "", Fecha: o.fecha, "Monto Total": o.monto_total, Estado: o.estado,

}

function buildFacturasRows(ordenes) {
  return ordenes.filter((o) => o.numero_factura).map((o) => ({

  }));
}

function buildProveedoresRows(proveedores) {
  return proveedores.map((p) => ({

    "Giro Comercial": p.giro_comercial, "Dirección Comercial": p.direccion_comercial, "Depto/Oficina": p.departamento_oficina,

const USUARIO_BLANK = { nombre: "", apellido: "", usuario: "", nivel_aprobacion: "0", password: "" };

function UsuarioModal({ onClose, onSaved, notify, editUsuario }) {
  const [form, setForm] = useState(editUsuario
    ? { ...USUARIO_BLANK, ...editUsuario, nivel_aprobacion: String(editUsuario.nivel_aprobacion), password: "" }
    : USUARIO_BLANK);
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const isEdit = !!editUsuario;

  const submit = async () => {
    if (!form.nombre || !form.apellido || !form.usuario) {
      notify("err", "Nombre, Apellido y Usuario son obligatorios");
      return;
    }
    setSaving(true);
    try {
      const { usuario } = await api("usuarios" + (isEdit ? "?id=" + editUsuario.id : ""), {
        method: isEdit ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, nivel_aprobacion: Number(form.nivel_aprobacion) }),
      });
      notify("ok", (isEdit ? "Usuario actualizado: " : "Usuario creado: ") + usuario.usuario);
      onSaved(usuario);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 420 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, isEdit ? "Editar Usuario" : "Nuevo Usuario"),
        h("button", { className: "modal-close", onClick: onClose }, "×")
      ),
      h(Field, { label: "Nombre *" }, h("input", { value: form.nombre, onChange: set("nombre") })),
      h(Field, { label: "Apellido *" }, h("input", { value: form.apellido, onChange: set("apellido") })),
      h(Field, { label: "Usuario (login) *" }, h("input", { value: form.usuario, onChange: set("usuario") })),
      h(Field, { label: "Nivel de Aprobación de OC" },
        h("select", { value: form.nivel_aprobacion, onChange: set("nivel_aprobacion") },
          h("option", { value: "0" }, "0 — No puede aprobar OC"),
          h("option", { value: "1" }, "1 — Puede aprobar OC"),
        )),
      h(Field, { label: "Contraseña" },
        h("input", { type: "password", value: form.password, onChange: set("password"),
          placeholder: isEdit ? "Dejar en blanco para no cambiarla" : "Dejar en blanco por ahora" })),
      isEdit && h("div", { className: "hint" }, editUsuario.tiene_password ? "Ya tiene contraseña configurada." : "Todavía sin contraseña."),
      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 16 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", { className: "btn-primary", onClick: submit, disabled: saving }, saving ? "Guardando..." : "Aceptar"),
      ),
    )
  );
}

      ),
      h(DataTable, {
        columns: USUARIOS_COLUMNS, rows: usuarios, rowKey: (u) => u.id, onRowClick: setEditing,
        searchFields: ["nombre", "apellido", "usuario"],
        searchPlaceholder: "Buscar por nombre, apellido o usuario",
        emptyText: "No hay usuarios cargados todavía",
      }),
    )
  );
}

function LoginScreen({ onLoggedIn }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  const doLogin = () => {
    if (!usuario || !password) { setMsg("Completa todos los campos"); return; }
    setBusy(true); setMsg("");
    fetch("/api/auth?action=login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usuario, password }),
    })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (ok) onLoggedIn(d);
        else setMsg(d.error || "Error al ingresar");
      })
      .catch(() => setMsg("Error de conexión"))
      .finally(() => setBusy(false));
  };

  const wrap = { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "linear-gradient(135deg,#0a1f3d 0%,#0e2f5c 50%,#0e4a8f 100%)" };
  const card = { background: "#fff", borderRadius: 20, padding: "44px 40px", width: "100%", maxWidth: 380, boxShadow: "0 20px 60px rgba(0,0,0,.3)" };
  const lbl = { fontSize: 11, fontWeight: 700, color: "var(--txm)", display: "block", marginBottom: 6, textTransform: "uppercase", letterSpacing: ".05em" };

  return h("div", { style: wrap },
    h("div", { style: card },
      h("div", { style: { textAlign: "center", marginBottom: 28 } },
        h("img", { src: "/logo.jpg", style: { maxWidth: 220, display: "block", margin: "0 auto" } }),
        h("div", { style: { fontSize: 11, color: "var(--txm)", marginTop: 10, letterSpacing: ".04em" } }, "Portal de Órdenes de Compra"),
      ),
      h("h1", { style: { fontSize: 20, fontWeight: 700, marginBottom: 6 } }, "Iniciar sesión"),
      h("p", { style: { color: "var(--txm)", fontSize: 13, marginBottom: 24 } }, "Ingresa con tu usuario de OCSys."),
      h("label", { style: lbl }, "Usuario"),
      h("input", { value: usuario, onChange: (e) => setUsuario(e.target.value), placeholder: "amelendez", style: { marginBottom: 16 }, autoComplete: "username" }),
      h("label", { style: lbl }, "Contraseña"),
      h("input", {
        type: "password", value: password, onChange: (e) => setPassword(e.target.value), placeholder: "••••••••",
        style: { marginBottom: 16 }, autoComplete: "current-password", onKeyDown: (e) => { if (e.key === "Enter") doLogin(); },
      }),
      msg && h("div", { className: "notif-err", style: { padding: "8px 12px", borderRadius: 8, marginBottom: 12, fontSize: 13 } }, msg),
      h("button", { className: "btn-primary", style: { width: "100%" }, onClick: doLogin, disabled: busy }, busy ? "Ingresando..." : "Ingresar"),
    )
  );
}

function Dashboard({ ordenes, proveedores, setTab }) {
  const counts = useMemo(() => {
    const c = { "Borrador": 0, "Pendiente aprobación": 0, "Aprobada": 0, "Completada": 0 };
    ordenes.forEach((o) => { if (c[o.estado] !== undefined) c[o.estado]++; });
    return c;
  }, [ordenes]);

  const items = [
    { label: "Borrador", value: counts["Borrador"], color: "var(--txm)" },
    { label: "Pendiente aprobación", value: counts["Pendiente aprobación"], color: "var(--amber)" },
    { label: "Aprobadas", value: counts["Aprobada"], color: "var(--green)" },
    { label: "Completadas", value: counts["Completada"], color: "var(--acc)" },
    { label: "Total", value: ordenes.length, color: "var(--tx)" },
  ];

  const proveedoresIncompletos = proveedores.filter((p) => !p.datos_completos).length;

  return h("div", { className: "page fade-up" },
    h("div", { className: "card" },
      h("h2", null, "Estado de Órdenes de Compra"),
      h("div", { className: "stat-strip" },
        items.map((it) => h("div", {
          key: it.label, className: "stat-item",
          onClick: () => setTab("ordenes"),
        },
          h("div", { className: "stat-num", style: { color: it.color } }, it.value),
          h("div", { className: "stat-lbl" }, h("span", { className: "stat-dot", style: { background: it.color } }), it.label),
        )),
      ),
    ),
    proveedoresIncompletos > 0 && h("div", { className: "card", style: { marginTop: 20 } },
      h("div", {
        className: "row-inline", style: { justifyContent: "space-between", cursor: "pointer" },
        onClick: () => setTab("proveedores"),
      },
        h("div", null,
          h("h2", { style: { marginBottom: 4 } }, "⚠ Proveedores con ficha incompleta"),
          h("div", { className: "hint" }, proveedoresIncompletos + (proveedoresIncompletos === 1 ? " proveedor necesita" : " proveedores necesitan") + " completar sus datos"),
        ),
        h("span", { className: "pill pill-pend" }, proveedoresIncompletos),
      ),
    ),
  );
}

function App({ currentUser, onLogout }) {
  const [tab, setTab] = useState("dashboard");
  const [proveedores, setProveedores] = useState([]);
  const [ordenes, setOrdenes] = useState([]);
  const [usuarios, setUsuarios] = useState([]);
  const [catalogos, setCatalogos] = useState({ centrosCosto: [], cuentasContables: [], regiones: [], ciudades: [], listos: false });
  const [notif, notify] = useNotif();

  const loadProveedores = useCallback(() => {
    api("proveedores").then((d) => setProveedores(d.proveedores)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadOrdenes = useCallback(() => {
    api("ordenes").then((d) => setOrdenes(d.ordenes)).catch((e) => notify("err", e.message));
  }, [notify]);

  const loadUsuarios = useCallback(() => {
    api("usuarios").then((d) => setUsuarios(d.usuarios)).catch((e) => notify("err", e.message));
  }, [notify]);

  useEffect(() => {
    loadProveedores();
    loadOrdenes();
    loadUsuarios();
    let cancelado = false;
    const cargarCatalogos = (intento) => {
      api("catalogos", { timeoutMs: 15000 })
        .then((d) => { if (!cancelado) setCatalogos({ ...d, listos: true }); })
        .catch((e) => {
          if (cancelado) return;
          if (intento < 3) {
            setTimeout(() => cargarCatalogos(intento + 1), 1500 * intento);
          } else {
            notify("err", "No se pudieron cargar los catálogos (Centro de Costo / Región / Cuenta Contable): " + e.message + " — recarga la página para reintentar.");
            setCatalogos((c) => ({ ...c, listos: true }));
          }
        });
    };
    cargarCatalogos(1);
    return () => { cancelado = true; };
  }, []);

  return h("div", null,
    notif && h("div", { className: "notif notif-" + (notif.type === "ok" ? "ok" : notif.type === "warn" ? "warn" : "err") }, notif.msg),
    h("div", { className: "header" },
      h("img", { src: "/logo.jpg", alt: "Patagónica" }),
      h("div", { style: { flex: 1 } }, h("h1", null, "OCSys"), h("div", { className: "sub" }, "Órdenes de Compra — Patagónica Inmobiliaria")),
      h("div", { style: { fontSize: 12, color: "var(--txm)", display: "flex", alignItems: "center", gap: 12 } },
        (currentUser.nombre || currentUser.usuario),
        h("button", { className: "btn-ghost", style: { padding: "5px 12px", fontSize: 11 }, onClick: onLogout }, "Cerrar sesión"),
      ),
    ),
    h("div", { className: "nav" },
      h("button", { className: "nav-btn" + (tab === "dashboard" ? " active" : ""), onClick: () => setTab("dashboard") }, "Dashboard"),
      h("button", { className: "nav-btn" + (tab === "nueva" ? " active" : ""), onClick: () => setTab("nueva") }, "Nueva OC"),
      h("button", { className: "nav-btn" + (tab === "ordenes" ? " active" : ""), onClick: () => setTab("ordenes") }, "Órdenes"),
      h("button", { className: "nav-btn" + (tab === "proveedores" ? " active" : ""), onClick: () => setTab("proveedores") }, "Proveedores"),
      h("button", { className: "nav-btn" + (tab === "reportes" ? " active" : ""), onClick: () => setTab("reportes") }, "Reportes"),
      h("button", { className: "nav-btn" + (tab === "administracion" ? " active" : ""), onClick: () => setTab("administracion") }, "Administración"),
    ),
    tab === "dashboard" && h(Dashboard, { ordenes, proveedores, setTab }),
    tab === "nueva" && h(NuevaOC, { proveedores, catalogos, refreshProveedores: loadProveedores, notify, onCreated: loadOrdenes, currentUser }),
    tab === "ordenes" && h(OrdenesList, { ordenes, refreshOrdenes: loadOrdenes, notify, currentUser }),
    tab === "proveedores" && h(ProveedoresList, { proveedores, catalogos, refreshProveedores: loadProveedores, notify, currentUser }),
    tab === "reportes" && h(ReportesList, { ordenes, proveedores, notify }),
    tab === "administracion" && h(AdministracionList, { usuarios, refreshUsuarios: loadUsuarios, notify }),
  );
}

function Root() {
  const [checking, setChecking] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);

  const checkSession = useCallback(() => {
    return fetch("/api/auth?action=me")
      .then((r) => (r.ok ? r.json() : null))
      .then(setCurrentUser);
  }, []);

  useEffect(() => {
    checkSession().finally(() => setChecking(false));
    const interval = setInterval(checkSession, 5 * 60 * 1000); // cada 5 min: detecta cierre por inactividad (4h) o medianoche
    return () => clearInterval(interval);
  }, [checkSession]);

  const onLogout = () => {
    fetch("/api/auth?action=logout").finally(() => setCurrentUser(null));
  };

  if (checking) return null;
  if (!currentUser) return h(LoginScreen, { onLoggedIn: setCurrentUser });
  return h(App, { currentUser, onLogout });
}

ReactDOM.createRoot(document.getElementById("root")).render(h(Root));
</script>
</body>
</html>
