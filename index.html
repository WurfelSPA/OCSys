*{box-sizing:border-box;margin:0;padding:0}
/* Tokens del Sistema Visual Patagónica (subconjunto 02/03/04/05/07 — ver
   facturacion-patagonica/DESIGN-SYSTEM.md). Los neutros se comparten entre
   las 3 empresas; el acento (--acc/--acc2/--accl/--accbg) es el único que
   cambia por empresa más abajo, para que siempre se note con cuál se trabaja. */
:root{
  --bg:#FBFAF6;--surf:#FFFFFF;--surf2:#F6F5F0;--surf3:#EFEEE9;
  --bdr:#E6E4DC;--bdr2:#D9D7CE;
  --tx:#1A1D2E;--txm:#6B6E7B;--txd:#9A9CA6;

  --red:#B42318;--rbg:#FBE9E7;
  --acc:#0F153E;--acc2:#2B7FA6;--accl:#0F153E;--accbg:#E4F4FB;
}
/* Campo Mar usa tonos verdes en vez de los azules de Patagonica, para que
   siempre sea obvio con que empresa se esta trabajando. */
[data-empresa="2"]{
  --acc:#0a7c4e;--acc2:#1fa06a;--accl:#075c39;--accbg:#e6f5ed;
}
/* Evox: negro + verde, siguiendo su logo (texto EVOX en negro, "X" y HOUSE

   el negro, no el verde. */

input,select,textarea{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;background:var(--surf);border:1px solid var(--bdr2);color:var(--tx);border-radius:6px;padding:8px 12px;font-size:12px;outline:none;transition:border 0.2s;width:100%}

<body>
<div id="root"></div>
<script>
const h = React.createElement;
const { useState, useEffect, useCallback, useMemo } = React;

function useNotif() {
  const [notif, setNotif] = useState(null);
  const show = useCallback((type, msg) => {
    setNotif({ type, msg });
    setTimeout(() => setNotif(null), 4000);
  }, []);
  return [notif, show];
}

function fmtMoney(n) {
  if (n === null || n === undefined || n === "") return "—";
  return "$" + Number(n).toLocaleString("es-CL");
}

function fmtDate(d) {
  if (!d) return "—";
  return new Date(d + "T00:00:00").toLocaleDateString("es-CL");
}

function estadoPill(estado) {
  const map = {
    "Borrador": "pill-draft",
    "Pendiente aprobación": "pill-pend", "Pendiente": "pill-pend",
    "Aprobada": "pill-ok", "Aprobado": "pill-ok", "Factura Aprobada": "pill-ok",
    "Facturada": "pill-info",
    "Completada": "pill-ok",
    "Anulado": "pill-anul", "Rechazado": "pill-anul",
    "Proceso de Pago": "pill-pend", "Pagado": "pill-ok",
  };
  return h("span", { className: "pill " + (map[estado] || "pill-pend") }, estado || "Pendiente");
}

async function api(path, opts) {
  const { timeoutMs, ...rest } = opts || {};
  let timer, signal = rest.signal;
  if (timeoutMs) {
    const ctrl = new AbortController();
    signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), timeoutMs);
  }
  try {
    const res = await fetch("/api/" + path, { ...rest, signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || "Error de servidor");
      err.data = data;
      throw err;
    }
    return data;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("La IA está tardando demasiado en responder. Intenta nuevamente o completa los datos manualmente.");
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

async function apiStream(path, opts, onProgress) {
  const { timeoutMs, ...rest } = opts || {};
  let timer, signal = rest.signal;
  if (timeoutMs) {
    const ctrl = new AbortController();
    signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), timeoutMs);
  }
  try {
    const res = await fetch("/api/" + path, { ...rest, signal });
    if (!res.body || !(res.headers.get("content-type") || "").includes("ndjson")) {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || "Error de servidor");
        err.data = data;
        throw err;
      }
      return data;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", resultado = null;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 1);
        if (!line) continue;
        const evt = JSON.parse(line);
        if (evt.tipo === "progreso") { if (onProgress) onProgress(evt.motor); }
        else if (evt.tipo === "resultado") resultado = { datos: evt.datos, motor: evt.motor };
        else if (evt.tipo === "error") throw new Error(evt.error);
      }
    }
    if (!resultado) throw new Error("La IA no devolvió resultado");
    return resultado;
  } catch (e) {
    if (e.name === "AbortError") throw new Error("La IA está tardando demasiado en responder. Intenta nuevamente o completa los datos manualmente.");
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function formBlank() {
  return {
    proveedor_id: "", fecha: new Date().toISOString().slice(0, 10),
    numero_cotizacion: "", proyecto_id: "",
    titulo: "", descripcion: "", condiciones: "",
    centro_costo_codigo: "", cuenta_contable_codigo: "",
    tipo_orden: "Afecto", tipo_compra: "Servicios", moneda: "CLP",
    monto_neto: "", monto_iva: "", monto_total: "",
    documentos_respaldo: [],
  };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ALLOWED_IA_EXT = ["pdf", "jpg", "jpeg", "png"];

function fileDropHandlers(setFile, setDragOver) {
  return {
    onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
    onDragLeave: (e) => { e.preventDefault(); setDragOver(false); },
    onDrop: (e) => {
      e.preventDefault();
      setDragOver(false);
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setFile(f);
    },
  };
}

const PROVEEDOR_BLANK = {
  razon_social: "", tipo_documento: "Factura Afecta", rut: "", tamano_empresa: "",
  giro_comercial: "", direccion_comercial: "", departamento_oficina: "",
  region: "", ciudad: "", telefono: "", sitio_web: "",
  contacto_nombre: "", contacto_apellido: "", contacto_telefono: "", contacto_celular: "", contacto_correo: "",
  banco: "", tipo_cuenta: "", numero_cuenta: "",
};

function Field({ label, children }) {
  return h("div", { className: "field" }, h("label", null, label), children);
}

function DataTable({ columns, rows, rowKey, searchPlaceholder, searchFields, onRowClick, emptyText, searchValue, onSearchChange, rowStyle }) {
  const [searchInterno, setSearchInterno] = useState("");
  // Controlado (searchValue/onSearchChange) cuando el padre necesita saber si
  // hay texto de busqueda; si no se pasan, se comporta igual que siempre.
  const search = searchValue !== undefined ? searchValue : searchInterno;
  const setSearch = onSearchChange || setSearchInterno;
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const filtered = useMemo(() => {
    if (!search.trim()) return rows;
    const q = search.trim().toLowerCase();
    return rows.filter((r) => (searchFields || []).some((f) => String(r[f] ?? "").toLowerCase().includes(q)));
  }, [rows, search, searchFields]);

  const sorted = useMemo(() => {
    const col = columns.find((c) => c.key === sortKey);
    // Si la columna ya no es ordenable (ej. se desactivo el sort al agrupar),
    // se ignora un sortKey que haya quedado de una interaccion anterior.
    if (!sortKey || !col || col.sortable === false) return filtered;
    const getVal = col.sortValue ? col.sortValue : (r) => r[sortKey];
    const copy = [...filtered];
    copy.sort((a, b) => {
      let va = getVal(a), vb = getVal(b);
      if (va === null || va === undefined) va = "";
      if (vb === null || vb === undefined) vb = "";
      if (typeof va === "number" && typeof vb === "number") return sortDir === "asc" ? va - vb : vb - va;
      va = String(va).toLowerCase(); vb = String(vb).toLowerCase();
      if (va < vb) return sortDir === "asc" ? -1 : 1;
      if (va > vb) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return copy;
  }, [filtered, sortKey, sortDir, columns]);

  const toggleSort = (key) => {
    if (sortKey !== key) { setSortKey(key); setSortDir("asc"); }
    else if (sortDir === "asc") setSortDir("desc");
    else { setSortKey(null); setSortDir("asc"); }
  };

  return h(React.Fragment, null,
    searchFields && searchFields.length > 0 && h("input", {
      value: search, onChange: (e) => setSearch(e.target.value),
      placeholder: searchPlaceholder || "Buscar...",
      style: { marginBottom: 12 },
    }),
    rows.length === 0
      ? h("div", { className: "empty" }, emptyText || "Sin datos")
      : sorted.length === 0
      ? h("div", { className: "empty" }, "Sin resultados para \"" + search + "\"")
      : h("div", { className: "table-scroll" },
          h("table", null,
          h("thead", null, h("tr", null,
            columns.map((c) => h("th", {
              key: c.key,
              onClick: c.sortable === false ? undefined : () => toggleSort(c.key),
              style: c.sortable === false ? undefined : { cursor: "pointer", userSelect: "none" },
            }, c.label + (sortKey === c.key ? (sortDir === "asc" ? " ▲" : " ▼") : ""))),
          )),
          h("tbody", null, sorted.map((row, i) => h("tr", {
            key: rowKey ? rowKey(row) : i,
            style: { ...(onRowClick ? { cursor: "pointer" } : null), ...(rowStyle ? rowStyle(row) : null) },
            onClick: onRowClick ? () => onRowClick(row) : undefined,
          }, columns.map((c) => h("td", { key: c.key }, c.render ? c.render(row) : (row[c.key] ?? "—")))))),
        ))
  );
}

function ProveedorModal({ regiones, catalogosListos, onClose, onCreated, notify, editProveedor, prefill, currentUser, proveedores }) {
  const [form, setForm] = useState(
    editProveedor ? { ...PROVEEDOR_BLANK, ...editProveedor }
      : prefill ? { ...PROVEEDOR_BLANK, ...prefill }
      : PROVEEDOR_BLANK
  );
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const isEdit = !!editProveedor;

  const rutNorm = (r) => (r || "").replace(/[^0-9kK]/g, "").toUpperCase();

  const submit = async () => {
    if (!form.razon_social || !form.rut) {
      notify("err", "Razón Social y RUT son obligatorios");
      return;
    }
    setSaving(true);
    try {
      // Si estamos creando (no editando) y el RUT ya pertenece a un proveedor
      // activo, no tiene sentido intentar un POST (el servidor lo va a
      // rechazar por RUT duplicado) -- se actualiza ese proveedor existente
      // en su lugar, conservando los datos que ya tenía y sumando lo nuevo
      // que se haya escrito en este formulario (ej. Región).
      const existente = !isEdit && (proveedores || []).find((p) => rutNorm(p.rut) === rutNorm(form.rut));
      const idDestino = isEdit ? editProveedor.id : (existente ? existente.id : null);
      // Solo pisa los campos del existente con los que el usuario realmente
      // escribio en este formulario (no vacios) -- el resto de su ficha
      // (datos bancarios, contacto, etc.) queda intacto.
      const cuerpo = existente
        ? Object.keys(form).reduce((acc, k) => (form[k] !== "" && form[k] != null ? { ...acc, [k]: form[k] } : acc), { ...existente })
        : form;

      const { proveedor } = await api("proveedores" + (idDestino ? "?id=" + idDestino : ""), {
        method: idDestino ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
      notify("ok", existente
        ? "Ya existía un proveedor con ese RUT — se actualizó: " + proveedor.razon_social
        : (isEdit ? "Proveedor actualizado: " : "Proveedor creado: ") + proveedor.razon_social);
      onCreated(proveedor);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const puedeEliminar = currentUser && currentUser.nivel_aprobacion === 1;

  const eliminar = async () => {
    if (!window.confirm("¿Eliminar el proveedor \"" + editProveedor.razon_social + "\"? Dejará de verse en OCFast y en los informes.")) return;
    setSaving(true);
    try {
      await api("proveedores?id=" + editProveedor.id, { method: "DELETE" });
      notify("ok", "Proveedor eliminado");
      onCreated(null);
      onClose();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },

function distribuirCuotas(n, montoNeto) {
  const neto = Number(montoNeto) || 0;
  const base = Math.floor(neto / n);
  const resto = neto - base * n;
  const rows = [];
  for (let i = 0; i < n; i++) {
    const monto = i === n - 1 ? base + resto : base;
    rows.push({ dias: 0, observacion: (i + 1) + "/" + n, monto, porcentaje: neto ? Math.round((monto / neto) * 100) : 0 });
  }
  return rows;
}

function loadImageAsDataURL(url) {
  return fetch(url)
    .then((r) => r.blob())
    .then((blob) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }));
}

function fmtMontoPdf(n, moneda) {
  const v = Number(n) || 0;
  if (moneda === "UF") return v.toLocaleString("es-CL", { maximumFractionDigits: 2 });
  return v.toLocaleString("es-CL", { maximumFractionDigits: 0 });
}

async function generarPdfOC(orden, proveedor, cuotas, empresa) {

  const moneda = orden.moneda;
  const left = 20, right = 190;
  const info = EMPRESA_PDF_INFO[empresa?.id] || EMPRESA_PDF_INFO[1];
  const nombreEmpresa = empresa?.nombre || "Patagónica Inmobiliaria";
  const rutEmpresa = empresa?.rut || "96.673.250-4";

  try {
    const logoData = await loadImageAsDataURL(info.logo);
    doc.addImage(logoData, "JPEG", left, 14, 32, 8);
  } catch (e) { /* si no carga el logo, se sigue sin él */ }

  doc.setFontSize(9); doc.setTextColor(40);
  doc.text(nombreEmpresa, left, 30);
  doc.text("Av. Americo Vespucio Norte 2680 - Piso 12", left, 34.5);
  doc.text("RUT: " + rutEmpresa, left, 39);
  doc.text("Correo DTE: " + info.correoDte, left, 43.5);
  doc.setDrawColor(210); doc.line(left, 47, right, 47);

  doc.setFont(undefined, "bold"); doc.text("Dirección de Envío", left, 54);
  doc.setFont(undefined, "normal");
  doc.text(["Oficina Operaciones", "Av. Americo Vespucio Norte 2680 - Piso 12", "Santiago", "Chile"], left, 59);

  doc.setFont(undefined, "bold"); doc.text(proveedor.razon_social, 120, 54, { maxWidth: 70 });
  doc.setFont(undefined, "normal");
  doc.text("Correo: " + (proveedor.contacto_correo || "—"), 120, 63);
  doc.text("RUT: " + proveedor.rut, 120, 67.5);

  doc.setFontSize(20); doc.setTextColor(140);
  doc.text("Orden de Compra #" + (orden.numero_oc_acquisys || orden.numero_oc), left, 82);
  if (orden.cuota_total) {
    doc.setFontSize(11); doc.setTextColor(140);
    doc.text("Cuota " + orden.cuota_numero + " de " + orden.cuota_total, right, 82, { align: "right" });
  }

  // El N° HES solo se muestra en OC nativas de OCSys (sin numero_oc_acquisys)
  // -- las importadas de Acquisys quedan igual que siempre, sin este dato.
  if (!orden.numero_oc_acquisys && orden.numero_hes) {
    doc.setFontSize(12); doc.setTextColor(140);
    doc.text("N° HES: " + orden.numero_hes, left, 88.5);
  }

  doc.setFontSize(9); doc.setTextColor(40);
  doc.setFont(undefined, "bold");
  doc.text("Representante de Compra", left, 92);
  doc.text("Fecha de pedido", 90, 92);
  doc.text("Moneda", 150, 92);
  doc.setFont(undefined, "normal");
  doc.text(orden.creado_por || "—", left, 96.5);
  doc.text(orden.fecha, 90, 96.5);
  doc.text(moneda, 150, 96.5);

  doc.setDrawColor(210); doc.line(150, 100, right, 100);
  doc.setTextColor(150); doc.text("Base Imponible", 150, 105);
  doc.setTextColor(40); doc.text(fmtMontoPdf(orden.monto_neto, moneda), right, 105, { align: "right" });
  doc.setFont(undefined, "bold");
  doc.text("IVA 19%", 150, 111); doc.text(fmtMontoPdf(orden.monto_iva, moneda), right, 111, { align: "right" });
  doc.setDrawColor(210); doc.line(150, 114, right, 114);
  doc.text("Total", 150, 119); doc.text(fmtMontoPdf(orden.monto_total, moneda), right, 119, { align: "right" });
  doc.setFont(undefined, "normal");

  doc.setFont(undefined, "bold"); doc.text("Ref. Interna", left, 106);
  doc.setFont(undefined, "normal"); doc.text(orden.titulo || "—", left, 110.5, { maxWidth: 110 });
  doc.setFont(undefined, "bold"); doc.text("Descripción", left, 119);
  doc.setFont(undefined, "normal"); doc.text(orden.descripcion || "—", left, 123.5, { maxWidth: 110 });

  // Una OC dividida en cuotas (filas independientes, cada una con su propio
  // monto/HES/factura) no trae el detalle de TODAS las cuotas en "cuotas"
  // (eso quedaria vacio, ver _cuotas.js) -- se arma una sola fila mostrando
  // nada mas la posicion de ESTA fila (ej. "1/6"), nunca el resto.
  const rows = orden.cuota_total
    ? [[
        "0", orden.cuota_numero + "/" + orden.cuota_total,
        Math.round(100 / orden.cuota_total) + " %",
        moneda + " " + fmtMontoPdf(orden.monto_neto, moneda),
      ]]
    : (cuotas || []).map((c) => [String(c.dias || 0), c.observacion || "", (c.porcentaje || 0) + " %", moneda + " " + fmtMontoPdf(c.monto, moneda)]);
  doc.autoTable({
    startY: 140, margin: { left, right: 210 - right },
    head: [["Días de Pago", "Observación", "Porcentaje", "Monto"]],
    body: rows,
    foot: [["Precio Total Neto", "", "", moneda + " " + fmtMontoPdf(orden.monto_neto, moneda)]],
    theme: "plain",
    styles: { fontSize: 9, textColor: 40 },
    headStyles: { fontStyle: "bold", lineWidth: { bottom: 0.3 }, lineColor: 200 },
    footStyles: { fontStyle: "bold", textColor: 40, lineWidth: { top: 0.3 }, lineColor: 200 },
  });

  const pageH = doc.internal.pageSize.getHeight();
  doc.setFontSize(8); doc.setTextColor(150);
  let yPie = pageH - 12;
  if (orden.aprobado_por) { yPie -= 5; doc.text("Aprobado por: " + orden.aprobado_por, left, yPie); }
  if (orden.solicitado_por) { yPie -= 5; doc.text("Generado por: " + orden.solicitado_por, left, yPie); }
  doc.setFontSize(8); doc.setTextColor(150);
  doc.text("OCFast - " + nombreEmpresa + " © Todos los Derechos Reservados", left, pageH - 12);
  doc.text("1/1", right, pageH - 12, { align: "right" });

  return doc.output("blob");
}

async function generarYAdjuntarPdf(ordenFila, proveedor, empresa) {
  const pdfBlob = await generarPdfOC(ordenFila, proveedor, ordenFila.cuotas || [], empresa);
  const pdfBase64 = await fileToBase64(new File([pdfBlob], "OC.pdf", { type: "application/pdf" }));
  const up = await api("upload", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: ordenFila.numero_oc + ".pdf", base64: pdfBase64 }),
    timeoutMs: 25000,
  });
  await api("ordenes?id=" + ordenFila.id, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ archivo_oc_url: up.url, archivo_oc_nombre: ordenFila.numero_oc + ".pdf" }),
    timeoutMs: 25000,
  });
}

function CuotasEditor({ cuotas, setCuotas, montoNeto, moneda }) {
  const setCuota = (i, k, v) => setCuotas((cs) => cs.map((c, idx) => idx === i ? { ...c, [k]: v, porcentaje: k === "monto" ? (montoNeto ? Math.round((Number(v) / Number(montoNeto)) * 100) : 0) : c.porcentaje } : c));

  // El monto de una cuota en UF puede traer decimales (ej. 5536.9) -- a
  // diferencia de CLP/USD, que se redondean a entero.
  const redondearMonto = (v) => moneda === "UF" ? Math.round(v * 100) / 100 : Math.round(v);

  // Editar el % de la cuota i recalcula su monto y reparte el % restante
  // (100% menos lo ya fijado en las cuotas 1..i) en partes iguales entre las
  // cuotas que vienen DESPUES de i -- las anteriores quedan tal cual, ya que
  // se asume que esas ya se decidieron primero.
  const setPorcentaje = (i, pctRaw) => {
    const total = Number(montoNeto) || 0;
    let pct = Number(pctRaw);
    if (!Number.isFinite(pct)) pct = 0;
    pct = Math.max(0, Math.min(100, pct));
    setCuotas((cs) => {
      const nuevas = cs.map((c) => ({ ...c }));
      nuevas[i].porcentaje = pct;
      nuevas[i].monto = redondearMonto((total * pct) / 100);

      const restantes = nuevas.length - 1 - i;
      if (restantes > 0) {
        const acumuladoHastaI = nuevas.slice(0, i + 1).reduce((s, c) => s + (Number(c.monto) || 0), 0);
        const montoRestante = Math.max(0, total - acumuladoHastaI);
        const base = redondearMonto(montoRestante / restantes);
        let acumulado = 0;
        for (let j = i + 1; j < nuevas.length; j++) {
          const esUltima = j === nuevas.length - 1;
          const montoFila = esUltima ? redondearMonto(montoRestante - acumulado) : base;
          acumulado += montoFila;
          nuevas[j].monto = montoFila;
          nuevas[j].porcentaje = total ? Math.round((montoFila / total) * 100) : 0;
        }
      }
      return nuevas;
    });
  };

  const totalCuotas = cuotas.reduce((s, c) => s + (Number(c.monto) || 0), 0);
  return h("div", null,
    h("table", null,
      h("thead", null, h("tr", null,
        h("th", null, "Días de Pago"), h("th", null, "Observación"), h("th", null, "Monto (" + moneda + ")"), h("th", null, "%"),
      )),
      h("tbody", null, cuotas.map((c, i) => h("tr", { key: i },
        h("td", null, h("input", { type: "number", value: c.dias, onChange: (e) => setCuota(i, "dias", e.target.value), style: { width: 70 } })),
        h("td", null, h("input", { value: c.observacion, onChange: (e) => setCuota(i, "observacion", e.target.value), style: { width: 90 } })),
        h("td", null, h("input", { type: "number", value: c.monto, onChange: (e) => setCuota(i, "monto", e.target.value), style: { width: 110 } })),
        h("td", null, h("input", { type: "number", value: c.porcentaje || 0, onChange: (e) => setPorcentaje(i, e.target.value), style: { width: 60 } }), " %"),
      ))),
    ),
    h("div", { className: "hint", style: { marginTop: 6 } }, "Suma de cuotas: " + totalCuotas.toLocaleString("es-CL") + " / Monto Neto: " + (Number(montoNeto) || 0).toLocaleString("es-CL")),
  );
}

// Lista libre de documentos de respaldo de una OC, ademas de la cotizacion
// (ej. el PDF descriptivo del proyecto) -- se pueden ir agregando de a uno,
// cada uno queda disponible para ver en cualquier momento. `documentos` es
// un array [{url, nombre, subido_en}]; `setDocumentos` recibe el array
// completo nuevo (mismo patron que los demas campos del formulario).
function DocumentosRespaldoEditor({ documentos, setDocumentos, notify }) {
  const [subiendo, setSubiendo] = useState(false);
  const inputId = "documento-respaldo-" + useMemo(() => Math.random().toString(36).slice(2), []);

  const agregar = async (file) => {
    if (!file) return;
    setSubiendo(true);
    try {
      const base64 = await fileToBase64(file);
      const up = await api("upload", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: file.name, base64 }),
      });
      setDocumentos([...(documentos || []), { url: up.url, nombre: file.name, subido_en: new Date().toISOString() }]);
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSubiendo(false);
    }
  };

  const quitar = (i) => setDocumentos((documentos || []).filter((_, idx) => idx !== i));

  return h("div", null,
    (documentos || []).length > 0 && h("div", { style: { display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 } },
      documentos.map((d, i) => h("div", { key: i, style: { display: "flex", alignItems: "center", gap: 8 } },
        h("a", { className: "link", href: d.url, target: "_blank", rel: "noreferrer", style: { flex: 1 } }, truncar(d.nombre, 280)),
        h("button", {
          type: "button", className: "btn-ghost", style: { padding: "2px 8px", fontSize: 11 },
          onClick: () => quitar(i),
        }, "Quitar"),
      )),
    ),
    h("label", {
      htmlFor: inputId, className: "btn-ghost",
      style: { display: "inline-flex", alignItems: "center", padding: "6px 14px", fontSize: 12, cursor: subiendo ? "default" : "pointer", opacity: subiendo ? 0.6 : 1 },
    }, subiendo ? "Subiendo..." : "+ Agregar documento"),
    h("input", {
      id: inputId, type: "file", style: { display: "none" }, disabled: subiendo,
      onChange: (e) => { const f = e.target.files[0]; e.target.value = ""; agregar(f); },
    }),
  );
}

function NuevaOC({ proveedores, catalogos, refreshProveedores, proyectos, refreshProyectos, refreshProyectosTodos, notify, onCreated, currentUser, empresaId, empresa }) {
  const [showModal, setShowModal] = useState(false);
  const [provPrefill, setProvPrefill] = useState(null);
  const [provEditing, setProvEditing] = useState(null);
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [leyendoIA, setLeyendoIA] = useState(false);
  const [motorIA, setMotorIA] = useState("Gemini");
  const [numCuotas, setNumCuotas] = useState(1);
  const [cuotas, setCuotas] = useState(distribuirCuotas(1, 0));
  // Si el usuario tiene proveedores permitidos, solo puede elegir entre
  // esos (no el catalogo completo) -- y si es uno solo, queda fijo.
  const proveedoresPermitidos = (currentUser.proveedor_ids && currentUser.proveedor_ids.length)
    ? proveedores.filter((p) => currentUser.proveedor_ids.includes(p.id))
    : proveedores;
  const proveedorFijo = currentUser.proveedor_ids && currentUser.proveedor_ids.length === 1 ? currentUser.proveedor_ids[0] : "";

  const [form, setForm] = useState(() => ({
    ...formBlank(),
    proveedor_id: proveedorFijo,
    proyecto_id: currentUser.proyecto_id || "",
    centro_costo_codigo: currentUser.centro_costo_codigo || "",
    cuenta_contable_codigo: currentUser.cuenta_contable_codigo || "",
  }));
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const agregarProyecto = async () => {
    const nombre = window.prompt("Nombre del nuevo proyecto:");
    if (!nombre || !nombre.trim()) return;
    try {
      const { proyecto } = await api("proyectos", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombre.trim(), empresa_id: empresaId }),
      });
      refreshProyectos();
      if (refreshProyectosTodos) refreshProyectosTodos();
      setForm((f) => ({ ...f, proyecto_id: proyecto.id }));
    } catch (e) {
      notify("err", e.message);
    }
  };

  const setMontoNeto = (e) => {
    const neto = e.target.value;
    const iva = neto ? Math.round(Number(neto) * 0.19) : "";
    const total = neto ? Math.round(Number(neto) * 1.19) : "";
    setForm((f) => ({ ...f, monto_neto: neto, monto_iva: iva, monto_total: total }));
    setCuotas(distribuirCuotas(numCuotas, neto || 0));
  };

  const setNumCuotasField = (e) => {
    const n = Math.max(1, Number(e.target.value) || 1);
    setNumCuotas(n);
    setCuotas(distribuirCuotas(n, form.monto_neto || 0));
  };

  const handleCreated = (proveedor) => {
    refreshProveedores();
    setForm((f) => ({ ...f, proveedor_id: proveedor.id }));
    setShowModal(false);
    setProvPrefill(null);
    setProvEditing(null);
  };

  const leerConIA = async (fileArg) => {
    const f = fileArg || file;
    if (!f) return;
    setLeyendoIA(true);
    setMotorIA("Gemini");
    try {
      const base64 = await fileToBase64(f);
      const { datos, motor } = await apiStream("extraer-cotizacion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: f.name, base64 }),
        timeoutMs: 85000,
      }, setMotorIA);

      const rutNorm = (r) => (r || "").replace(/[^0-9kK]/g, "").toUpperCase();
      const nombreNorm = (n) => (n || "").toLowerCase().replace(/[^a-z0-9]/g, "");
      let proveedorMatch = datos.proveedor_rut
        ? proveedores.find((p) => rutNorm(p.rut) === rutNorm(datos.proveedor_rut))
        : null;
      const matchedByRut = !!proveedorMatch;
      if (!proveedorMatch && datos.proveedor_razon_social) {
        const target = nombreNorm(datos.proveedor_razon_social);
        proveedorMatch = proveedores.find((p) => nombreNorm(p.razon_social) === target)
          || proveedores.find((p) => target.includes(nombreNorm(p.razon_social)) || nombreNorm(p.razon_social).includes(target));
      }

      const neto = datos.monto_neto || 0;
      // Algunas cotizaciones solo imprimen el neto, sin IVA ni total -- en
      // ese caso la IA deja esos campos en 0 (ver instrucciones en
      // api/extraer-cotizacion.js) y se completan aqui mismo con el 19%,
      // igual que cuando el neto se escribe a mano (ver setMontoNeto).
      const sinIvaNiTotal = neto && !datos.monto_iva && !datos.monto_total;
      const iva = sinIvaNiTotal ? Math.round(neto * 0.19) : datos.monto_iva;
      const total = sinIvaNiTotal ? Math.round(neto * 1.19) : datos.monto_total;
      setForm((f) => ({
        ...f,
        proveedor_id: proveedorMatch ? proveedorMatch.id : f.proveedor_id,
        numero_cotizacion: datos.numero_cotizacion || f.numero_cotizacion,
        titulo: (datos.titulo || "").slice(0, 150) || f.titulo,
        descripcion: datos.descripcion || f.descripcion,
        condiciones: datos.condiciones || f.condiciones,
        moneda: datos.moneda || f.moneda,
        monto_neto: neto || f.monto_neto,
        monto_iva: iva !== undefined ? iva : f.monto_iva,
        monto_total: total !== undefined ? total : f.monto_total,
      }));
      if (neto) setCuotas(distribuirCuotas(numCuotas, neto));

      const extraidoProveedor = {
        razon_social: datos.proveedor_razon_social || "",
        rut: datos.proveedor_rut || "",
        contacto_nombre: datos.contacto_nombre || "",
        contacto_apellido: datos.contacto_apellido || "",
        contacto_telefono: datos.contacto_telefono || "",
        contacto_celular: datos.contacto_celular || "",
        contacto_correo: datos.contacto_correo || "",
        banco: datos.banco || "",
        tipo_cuenta: datos.tipo_cuenta || "",
        numero_cuenta: datos.numero_cuenta || "",
      };

      if ((datos.proveedor_rut || datos.proveedor_razon_social) && !proveedorMatch) {
        const nombre = datos.proveedor_razon_social || datos.proveedor_rut;
        notify("err", "Proveedor no existe (" + nombre + ")");
        if (window.confirm("Proveedor no existe: \"" + nombre + "\". ¿Desea agregarlo?")) {
          setProvPrefill(extraidoProveedor);
          setShowModal(true);
        }
      } else if (proveedorMatch && !proveedorMatch.datos_completos && matchedByRut) {
        // Solo se ofrece autocompletar cuando el match fue por RUT (dato fiable);
        // el nombre puede estar ingresado con mayúsculas/minúsculas u otro formato
        // y un match por nombre no garantiza que sea el mismo proveedor.
        const completar = { ...proveedorMatch };
        Object.keys(extraidoProveedor).forEach((k) => { if (!completar[k] && extraidoProveedor[k]) completar[k] = extraidoProveedor[k]; });
        notify("err", "El proveedor \"" + proveedorMatch.razon_social + "\" tiene la ficha incompleta");
        if (window.confirm("El proveedor \"" + proveedorMatch.razon_social + "\" existe pero su ficha está incompleta. ¿Desea completarla con los datos de esta cotización?")) {
          setProvEditing(completar);
          setShowModal(true);
        }
      } else {
        notify("ok", "Cotización leída con IA" + (motor && motor !== "Gemini" ? " (" + motor + ")" : "") + " — revisa los datos antes de generar la OC");
      }
    } catch (e) {
      notify("err", e.message);
    } finally {
      setLeyendoIA(false);
    }
  };

  const handleFileSelected = (f) => {
    setFile(f);
    if (f) {
      const ext = f.name.split(".").pop().toLowerCase();
      if (ALLOWED_IA_EXT.includes(ext)) leerConIA(f);
    }
  };

  const submit = async (estado) => {
    if (!form.proveedor_id) return notify("err", "Selecciona un proveedor");
    if (estado === "Pendiente aprobación") {
      // Solo avisa, no bloquea -- la ficha puede completarse despues (ej.
      // datos bancarios), no tiene por que detener la generacion de la OC.
      const proveedorSel = proveedores.find((p) => p.id === form.proveedor_id);
      if (proveedorSel && !proveedorSel.datos_completos) {
        notify("warn", "El proveedor \"" + proveedorSel.razon_social + "\" tiene la ficha incompleta — puedes completarla más tarde.");
      }
    }
    setSaving(true);
    try {
      let archivo_url = null, archivo_nombre = null;
      if (file) {
        const base64 = await fileToBase64(file);
        const up = await api("upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, base64 }),
          timeoutMs: 25000,
        });
        archivo_url = up.url;
        archivo_nombre = file.name;
      }
      const respuesta = await api("ordenes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...form, estado, archivo_url, archivo_nombre, cuotas,
          empresa_id: empresaId,
        }),
        timeoutMs: 25000,
      });
      const ordenesCreadas = respuesta.ordenes || [respuesta.orden];

      if (estado === "Pendiente aprobación") {
        const proveedor = proveedores.find((p) => p.id === form.proveedor_id);
        for (const ordenFila of ordenesCreadas) {
          await generarYAdjuntarPdf(ordenFila, proveedor, empresa);
        }
      }

      const primera = ordenesCreadas[0];
      let mensaje = ordenesCreadas.length > 1
        ? "OC generada en " + ordenesCreadas.length + " cuotas (" + ordenesCreadas.map((o) => o.numero_oc).join(", ") + ")"
        : (estado === "Borrador" ? "Borrador guardado: " : "OC generada: ") + primera.numero_oc;
      if (estado === "Pendiente aprobación") {
        mensaje += respuesta.correoError ? " — aviso a aprobador no enviado: " + respuesta.correoError : " — aviso enviado a aprobador";
      }
      notify(estado === "Pendiente aprobación" && respuesta.correoError ? "warn" : "ok", mensaje);
      onCreated();
      limpiarFormulario();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const limpiarFormulario = () => {
    setForm({
      ...formBlank(),
      proveedor_id: proveedorFijo,
      proyecto_id: currentUser.proyecto_id || "",
      centro_costo_codigo: currentUser.centro_costo_codigo || "",
      cuenta_contable_codigo: currentUser.cuenta_contable_codigo || "",
    });
    setFile(null);
    setNumCuotas(1);
    setCuotas(distribuirCuotas(1, 0));
  };

  return h("div", { className: "page fade-up" },
    showModal && h(ProveedorModal, {
      regiones: catalogos.regiones, catalogosListos: catalogos.listos, prefill: provPrefill, editProveedor: provEditing, currentUser, proveedores,
      onClose: () => { setShowModal(false); setProvPrefill(null); setProvEditing(null); },
      onCreated: handleCreated, notify,
    }),

    h("div", { className: "card" },
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 8, marginBottom: 14 } },
        h("h2", { style: { marginBottom: 0 } }, "Nueva Orden de Compra"),
        h("div", { className: "hint", style: { fontSize: 12 } }, "(" + fmtDate(form.fecha) + ")"),
        h("button", {
          className: "btn-ghost", style: { marginLeft: "auto", padding: "4px 12px", fontSize: 12 },
          onClick: () => { if (window.confirm("¿Limpiar el formulario? Se perderán los datos ingresados.")) limpiarFormulario(); },
        }, "Limpiar formulario"),
      ),

      h("div", { className: "section-lbl" }, "Cotización del Proveedor"),
      h("input", {
        type: "file", id: "file-input", style: { display: "none" },
        accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
        onChange: (e) => handleFileSelected(e.target.files[0] || null),
      }),
      h("label", {
        htmlFor: "file-input",
        className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
        style: { display: "block" },
        ...fileDropHandlers(handleFileSelected, setDragOver),
      },
        file ? ("✓ " + file.name) : "Haz clic o arrastra aquí la cotización enviada por el proveedor (PDF / Word / Excel / JPG / PNG)"
      ),
      h("div", { className: "row-inline", style: { marginTop: 10 } },
        h("button", {
          className: "btn-ghost", disabled: !file || leyendoIA || !ALLOWED_IA_EXT.includes((file && file.name.split(".").pop().toLowerCase()) || ""),
          onClick: () => leerConIA(), style: { display: "flex", alignItems: "center", gap: 8 },
        },
          leyendoIA && h("span", { className: "spinner" }),
          leyendoIA ? `Leyendo con IA (${motorIA})...` : "Volver a leer con IA",
        ),
        h("div", { className: "hint" }, "Al subir o arrastrar un PDF/JPG/PNG se lee automáticamente con IA y completa el formulario (incluido el proveedor). Word/Excel se completan a mano."),
      ),
      leyendoIA && h("div", { className: "pbar" }, h("div", { className: "pbar-fill" })),
      h("div", { className: "hint", style: { marginTop: 4 } }, "Formatos permitidos para subir: PDF, Word, Excel, JPG, PNG"),
      h("div", { style: { maxWidth: 340 } },
        h(Field, { label: "N° Cotización" },
          h("input", { value: form.numero_cotizacion, onChange: set("numero_cotizacion"), placeholder: "Se completa automáticamente al leer con IA, o ingrésalo a mano" }))),

      h(Field, { label: "Proveedor *" },
        h("div", { className: "row-inline" },
          h(ProveedorPicker, {
            proveedores: proveedoresPermitidos, value: form.proveedor_id,
            onChange: (id) => setForm((f) => ({ ...f, proveedor_id: id })),
            disabled: !!proveedorFijo,
          }),
          !(currentUser.proveedor_ids && currentUser.proveedor_ids.length) && h("button", { className: "btn-add", title: "Agregar proveedor", onClick: () => setShowModal(true) }, "+"),
        )
      ),
      h(ProveedorInfoPanel, {
        proveedor: proveedores.find((p) => p.id === form.proveedor_id),
        onEditar: () => {
          const p = proveedores.find((x) => x.id === form.proveedor_id);
          if (p) { setProvEditing(p); setShowModal(true); }
        },
      }),

      h(Field, { label: "Documentos de Respaldo (opcional)" },
        h(DocumentosRespaldoEditor, {
          documentos: form.documentos_respaldo,
          setDocumentos: (docs) => setForm((f) => ({ ...f, documentos_respaldo: docs })),
          notify,
        })),
      h("div", { className: "hint", style: { marginTop: -8, marginBottom: 10 } }, "Cualquier otro archivo útil de tener a mano (ej. ficha descriptiva del proyecto), además de la cotización."),

      h("div", { className: "section-lbl" }, "Detalle de la Orden"),
      h(Field, { label: "Título" }, h("input", { value: form.titulo, onChange: set("titulo") })),
      h(Field, { label: "Descripción" }, h("textarea", { rows: 2, value: form.descripcion, onChange: set("descripcion") })),
      h(Field, { label: "Condiciones" },
        h("textarea", {
          rows: 2, value: form.condiciones, onChange: set("condiciones"),
          placeholder: "Plazos de entrega, condiciones de pago, etc. Se completa automáticamente al leer con IA, o ingrésalo a mano",
        })),

      h("div", { className: "grid3" },
        h(Field, { label: "Centro de Costo" },
          h("select", {
            value: form.centro_costo_codigo, disabled: !catalogos.listos || !!currentUser.centro_costo_codigo,
            onChange: (e) => setForm((f) => ({ ...f, centro_costo_codigo: e.target.value, cuenta_contable_codigo: "" })),
          },
            h("option", { value: "" }, catalogos.listos ? "Selecciona" : "Cargando..."),
            catalogos.centrosCosto.map((c) => h("option", { key: c.codigo, value: c.codigo }, c.codigo + " — " + c.descripcion)),
          )),
        h(Field, { label: "Cuenta Contable" },
          !form.centro_costo_codigo
            ? h("input", { disabled: true, placeholder: "Primero selecciona un Centro de Costo" })
            : h(SearchSelect, {
                options: catalogos.cuentasContables
                  .filter((c) => c.centro_costo_codigo === form.centro_costo_codigo)
                  .map((c) => ({ value: c.codigo, label: c.codigo + " — " + c.descripcion })),
                value: form.cuenta_contable_codigo,
                onChange: (v) => setForm((f) => ({ ...f, cuenta_contable_codigo: v })),
                placeholder: "Escribe para buscar cuenta contable...",
                disabled: !!currentUser.cuenta_contable_codigo,
              })
        ),
        h(Field, { label: "Proyectos" },
          h("div", { className: "row-inline" },
            h("select", {
              value: form.proyecto_id, disabled: !!currentUser.proyecto_id,
              onChange: (e) => setForm((f) => ({ ...f, proyecto_id: e.target.value })),
            },
              h("option", { value: "" }, "Selecciona"),
              proyectos.map((p) => h("option", { key: p.id, value: p.id }, p.nombre)),
            ),
            !currentUser.proyecto_id && h("button", { className: "btn-add", title: "Agregar proyecto", type: "button", onClick: agregarProyecto }, "+"),
          )),
      ),

      h("div", { className: "grid3" },
        h(Field, { label: "Tipo de Orden" },
          h("select", { value: form.tipo_orden, onChange: set("tipo_orden") },
            h("option", { value: "Afecto" }, "Afecto"),
            h("option", { value: "Exento" }, "Exento"),
            h("option", { value: "Exento/Afecto" }, "Exento/Afecto"),
          )),
        h(Field, { label: "Tipo de Compra" },
          h("select", { value: form.tipo_compra, onChange: set("tipo_compra") },
            h("option", { value: "Servicios" }, "Servicios"),
            h("option", { value: "Bienes" }, "Bienes"),
          )),
        h(Field, { label: "Moneda" },
          h("select", { value: form.moneda, onChange: set("moneda") },
            h("option", { value: "CLP" }, "CLP"),
            h("option", { value: "USD" }, "USD"),
            h("option", { value: "UF" }, "UF"),
          )),
      ),

      h("div", { style: { display: "flex", gap: 32, flexWrap: "wrap", alignItems: "flex-start" } },
        h("div", { style: { flex: "1 1 340px" } },
          h("div", { className: "section-lbl" }, "Montos"),
          h("div", { className: "grid3" },
            h(Field, { label: "Monto Neto" }, h("input", { type: "number", value: form.monto_neto, onChange: setMontoNeto })),
            h(Field, { label: "Monto IVA" }, h("input", { type: "number", value: form.monto_iva, onChange: set("monto_iva") })),
            h(Field, { label: "Monto Total" }, h("input", { type: "number", value: form.monto_total, onChange: set("monto_total") })),
          ),
        ),
        h("div", { style: { flex: "1 1 360px" } },
          h("div", { className: "section-lbl" }, "Cuotas de Pago"),
          h("div", { style: { display: "flex", gap: 24, alignItems: "flex-start" } },
            h(Field, { label: "N° de Cuotas" }, h("input", { type: "number", min: 1, value: numCuotas, onChange: setNumCuotasField, style: { width: 90 } })),
            h(CuotasEditor, { cuotas, setCuotas, montoNeto: form.monto_neto, moneda: form.moneda }),
          ),
        ),
      ),

      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 20 } },
        h("button", { className: "btn-ghost", onClick: () => submit("Borrador"), disabled: saving }, "Guardar Borrador"),
        h("button", { className: "btn-primary", onClick: () => submit("Pendiente aprobación"), disabled: saving }, saving ? "Generando..." : "Generar OC"),
      ),
    )
  );
}

function OrdenAccionModal({ orden, tipo, onClose, onDone, notify, proveedores, empresa, currentUser }) {
  const isAprobar = tipo === "aprobar";
  const isFacturar = tipo === "facturar";
  const isPagar = tipo === "pagar";
  const [numeroFactura, setNumeroFactura] = useState("");
  const [montoFacturado, setMontoFacturado] = useState("");
  const [montoNetoFactura, setMontoNetoFactura] = useState("");
  const [montoUfFactura, setMontoUfFactura] = useState("");
  const [file, setFile] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const [saving, setSaving] = useState(false);
  const [verificandoFactura, setVerificandoFactura] = useState(false);
  const [motorFactura, setMotorFactura] = useState("Gemini");
  const [discrepancia, setDiscrepancia] = useState(null);

  const verificarFactura = async (f) => {
    setVerificandoFactura(true);
    setMotorFactura("Gemini");
    try {
      const base64 = await fileToBase64(f);
      const { datos, motor } = await apiStream("extraer-factura", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ filename: f.name, base64 }),
        timeoutMs: 85000,
      }, setMotorFactura);
      const rutNorm = (r) => (r || "").replace(/[^0-9kK]/g, "").toUpperCase();
      const rutProveedor = orden.proveedores && orden.proveedores.rut;
      const problemas = [];
      if (datos.proveedor_rut && rutProveedor && rutNorm(datos.proveedor_rut) !== rutNorm(rutProveedor)) {
        problemas.push("el RUT del emisor (" + datos.proveedor_rut + ") no coincide con el proveedor de la OC (" + rutProveedor + ")");
      }
      if (datos.receptor_rut && empresa?.rut && rutNorm(datos.receptor_rut) !== rutNorm(empresa.rut)) {
        problemas.push("el RUT del receptor en la factura (" + datos.receptor_rut + ") no corresponde a " + (empresa?.nombre || "esta empresa") + " (" + empresa.rut + ")");
      }
      // Las facturas chilenas (SII) siempre emiten sus totales en pesos, aunque
      // el contrato/OC este en UF -- el valor en UF solo aparece en el detalle
      // (cantidad en UF x valor de la UF del dia). Si la IA logro leer ese
      // monto neto en UF, se compara neto-a-neto en UF (inmune al valor de la
      // UF del dia de la factura) en vez de comparar el total en pesos contra
      // el total en UF, que siempre daria un falso "no coincide".
      if (orden.moneda === "UF" && datos.monto_neto_uf != null) {
        const tolerancia = Math.max(0.5, Number(orden.monto_neto) * 0.01);
        if (Math.abs(Number(datos.monto_neto_uf) - Number(orden.monto_neto)) > tolerancia) {
          problemas.push("el monto neto de la factura (UF " + datos.monto_neto_uf + ") no coincide con el de la OC (UF " + orden.monto_neto + ")");
        }
      } else {
        if (orden.moneda === "UF") {
          // No es un error real de la factura -- es que la IA no logro leer
          // un monto en UF en el detalle (ver rama de arriba). Se avisa para
          // que no se confunda con un problema real de monto/moneda.
          problemas.push("no se pudo leer un monto en UF en el detalle de la factura; verifica manualmente que el monto coincida");
        }
        if (datos.moneda && orden.moneda && datos.moneda !== orden.moneda) {
          problemas.push("la moneda de la factura (" + datos.moneda + ") no coincide con la de la OC (" + orden.moneda + ")");
        }
        if (datos.monto_total != null && orden.monto_total != null) {
          const tolerancia = Math.max(1, Number(orden.monto_total) * 0.01);
          if (Math.abs(Number(datos.monto_total) - Number(orden.monto_total)) > tolerancia) {
            problemas.push("el monto de la factura (" + fmtMontoMoneda(datos.monto_total, datos.moneda || orden.moneda) + ") no coincide con el de la OC (" + fmtMontoMoneda(orden.monto_total, orden.moneda) + ")");
          }
        }
      }
      if (problemas.length) {
        setDiscrepancia("La factura no coincide con la OC: " + problemas.join("; ") + ".");
        notify("err", "La factura no coincide con la OC");
      } else {
        setDiscrepancia(null);
        notify("ok", "Factura verificada" + (motor && motor !== "Gemini" ? " (" + motor + ")" : "") + ": los datos coinciden con la OC");
        if (datos.numero_factura) setNumeroFactura((n) => n || datos.numero_factura);
        if (datos.monto_total != null) setMontoFacturado((m) => m || datos.monto_total);
        if (datos.monto_neto != null) setMontoNetoFactura((m) => m || datos.monto_neto);
        if (datos.monto_neto_uf != null) setMontoUfFactura((m) => m || datos.monto_neto_uf);
      }
    } catch (e) {
      // Si la IA falla no se bloquea la facturacion (puede ser un problema
      // puntual de Gemini) -- solo se avisa que no se pudo verificar solo.
      notify("warn", "No se pudo verificar la factura automáticamente: " + e.message);
    } finally {
      setVerificandoFactura(false);
    }
  };

  const handleFacturaFile = (f) => {
    setFile(f);
    setDiscrepancia(null);
    if (f && ALLOWED_IA_EXT.includes(f.name.split(".").pop().toLowerCase())) verificarFactura(f);
  };

  const submit = async () => {
    if (isFacturar && !numeroFactura) return notify("err", "Ingresa el N° de Factura");
    if (isFacturar && discrepancia) return notify("err", "No puedes continuar: la factura no coincide con la OC. Anula esta OC y genera una nueva, o sube la factura correcta.");
    if (isPagar && !file) return notify("err", "Sube el comprobante de pago");
    setSaving(true);
    try {
      let payload;
      if (isAprobar) {
        // El backend graba el aprobado_por real tomandolo de la sesion (ver
        // api/ordenes.js); aqui solo se necesita el mismo nombre para
        // imprimirlo en el PDF que se genera y sube ANTES de ese PUT.
        const aprobadoPor = (currentUser && (currentUser.nombre ? (currentUser.nombre + " " + (currentUser.apellido || "")).trim() : currentUser.usuario)) || "";
        payload = { estado: "Aprobada" };
        // Solo las OC nativas de OCSys (sin numero_oc_acquisys) muestran el
        // HES en el PDF -- se genera aqui mismo, antes de aprobar, para que
        // el correo de aprobacion salga con el PDF ya correcto desde el
        // primer envio (en vez de enviarlo sin HES y recien despues
        // enterarse del numero real).
        if (!orden.numero_oc_acquisys) {
          const proveedor = (proveedores || []).find((p) => p.id === orden.proveedor_id);
          if (proveedor) {
            // Si la OC ya tenia un HES (se esta re-aprobando despues de un
            // Desaprobar), se reutiliza el mismo -- solo se pide uno nuevo
            // la primera vez que se aprueba.
            const numeroHes = orden.numero_hes || (await api("ordenes?siguiente_hes=1&empresa_id=" + orden.empresa_id, { timeoutMs: 15000 })).numero_hes;
            const pdfBlob = await generarPdfOC({ ...orden, numero_hes: numeroHes, aprobado_por: aprobadoPor }, proveedor, orden.cuotas || [], empresa);
            const pdfBase64 = await fileToBase64(new File([pdfBlob], "OC.pdf", { type: "application/pdf" }));
            const up = await api("upload", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ filename: orden.numero_oc + ".pdf", base64: pdfBase64 }),
            });
            payload.numero_hes = numeroHes;
            payload.archivo_oc_url = up.url;
            payload.archivo_oc_nombre = orden.numero_oc + ".pdf";
          }
        }
      } else if (isFacturar) {
        payload = {
          estado: "Facturada", numero_factura: numeroFactura,
          monto_facturado: montoFacturado || null,
          monto_facturado_neto: montoNetoFactura || null,
          monto_facturado_uf: orden.moneda === "UF" ? (montoUfFactura || null) : null,
        };
        if (file) {
          const base64 = await fileToBase64(file);
          const up = await api("upload", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: file.name, base64 }),
          });
          payload.archivo_factura_url = up.url;
          payload.archivo_factura_nombre = file.name;
        }
      } else {
        const base64 = await fileToBase64(file);
        const up = await api("upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: file.name, base64 }),
        });
        payload = { estado: "Completada", archivo_comprobante_url: up.url, archivo_comprobante_nombre: file.name };
      }

      const { orden: actualizada, correoError } = await api("ordenes?id=" + orden.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (isAprobar) {
        notify(correoError ? "warn" : "ok",
          "OC aprobada con HES " + actualizada.numero_hes + (correoError ? " — correo no enviado: " + correoError : " — correo enviado al proveedor"));
      } else if (isFacturar) {
        notify(correoError ? "warn" : "ok",
          "OC facturada con Factura " + numeroFactura + (correoError ? " — correo a pagos no enviado: " + correoError : " — correo enviado a pagos"));
      } else {
        notify("ok", "OC completada — ciclo cerrado");
      }
      onDone();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  const tituloModal = isAprobar ? "Aprobar OC " : isFacturar ? "Facturar OC " : "Registrar Pago OC ";
  const fileFieldId = isFacturar ? "factura-file" : "comprobante-file";

  return h("div", { className: "overlay", onClick: (e) => e.target === e.currentTarget && onClose() },
    h("div", { className: "modal", style: { width: 420 } },
      h("div", { className: "modal-hdr" },
        h("h3", null, tituloModal + (orden.numero_oc_acquisys || orden.numero_oc)),
        h("button", { className: "modal-close", onClick: onClose }, "×")
      ),
      isAprobar &&
        h("p", { style: { fontSize: 13, color: "var(--txm)", marginBottom: 4 } },
          "Se asignará automáticamente el N° HES y se enviará un correo al proveedor (" + ((orden.proveedores && orden.proveedores.razon_social) || "") + ") con la Orden de Compra adjunta."),
      isFacturar &&
        h(React.Fragment, null,
          h(Field, { label: "Factura (PDF/imagen)" },
            h("input", {
              type: "file", id: fileFieldId, style: { display: "none" },
              accept: ".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png",
              onChange: (e) => handleFacturaFile(e.target.files[0] || null),
            })),
          h("label", {
            htmlFor: fileFieldId,
            className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
            style: { display: "block" },
            ...fileDropHandlers(handleFacturaFile, setDragOver),
          },
            file ? ("✓ " + file.name) : "Haz clic o arrastra aquí la factura"),
          verificandoFactura && h("div", { className: "hint", style: { marginTop: 6, display: "flex", alignItems: "center", gap: 8 } },
            h("span", { className: "spinner" }), `Verificando factura contra la OC con IA (${motorFactura})...`),
          h(Field, { label: "N° Factura *" }, h("input", { value: numeroFactura, onChange: (e) => setNumeroFactura(e.target.value), autoFocus: true, placeholder: "Se completa automáticamente al leer la factura, o ingrésalo a mano" })),
          orden.moneda === "UF" && h(Field, { label: "Monto UF" },
            h("input", { type: "number", value: montoUfFactura, onChange: (e) => setMontoUfFactura(e.target.value), placeholder: orden.monto_neto }),
            montoUfFactura !== "" && h("div", { className: "hint", style: { marginTop: 4 } }, fmtMontoMoneda(montoUfFactura, "UF"))),
          h(Field, { label: "Monto Neto ($)" },
            h("input", { type: "number", value: montoNetoFactura, onChange: (e) => setMontoNetoFactura(e.target.value) }),
            montoNetoFactura !== "" && h("div", { className: "hint", style: { marginTop: 4 } }, fmtMoney(montoNetoFactura))),
          h(Field, { label: "Monto Total Facturado ($)" },
            h("input", { type: "number", value: montoFacturado, onChange: (e) => setMontoFacturado(e.target.value), placeholder: orden.monto_total }),
            montoFacturado !== "" && h("div", { className: "hint", style: { marginTop: 4 } }, fmtMoney(montoFacturado))),
          discrepancia && h("div", {
            className: "notif-err",
            style: { padding: "10px 12px", borderRadius: 8, marginTop: 8, fontSize: 12, lineHeight: 1.5 },
          },
            h("b", null, "⚠ " + discrepancia),
            h("div", { style: { marginTop: 4 } }, "No se puede continuar. Anula esta OC y genera una nueva, o sube la factura correcta."),
          ),
        ),
      isPagar &&
        h(React.Fragment, null,
          h("p", { style: { fontSize: 13, color: "var(--txm)", marginBottom: 10 } },
            "Sube el comprobante de la transferencia al proveedor. Al confirmarlo, la OC quedará marcada como Completada."),
          h(Field, { label: "Comprobante de Pago *" },
            h("input", {
              type: "file", id: fileFieldId, style: { display: "none" },
              accept: ".pdf,.jpg,.jpeg,.png",
              onChange: (e) => setFile(e.target.files[0] || null),
            })),
          h("label", {
            htmlFor: fileFieldId,
            className: "drop-zone" + (file ? " done" : "") + (dragOver ? " dragover" : ""),
            style: { display: "block" },
            ...fileDropHandlers(setFile, setDragOver),
          },
            file ? ("✓ " + file.name) : "Haz clic o arrastra aquí el comprobante de pago"),
        ),
      h("div", { style: { display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 16 } },
        h("button", { className: "btn-ghost", onClick: onClose }, "Cancelar"),
        h("button", {
          className: "btn-primary", onClick: submit,
          disabled: saving || verificandoFactura || (isFacturar && !!discrepancia),
        }, saving ? "Guardando..." : "Confirmar"),
      ),
    )
  );
}

function EditarOrdenModal({ orden, proveedores, catalogos, proyectos, refreshProyectos, refreshProyectosTodos, empresaId, empresa, notify, onClose, onSaved }) {
  const [form, setForm] = useState({
    proveedor_id: orden.proveedor_id || "",
    numero_cotizacion: orden.numero_cotizacion || "",
    proyecto_id: orden.proyecto_id || "",
    titulo: orden.titulo || "",
    descripcion: orden.descripcion || "",
    condiciones: orden.condiciones || "",
    fecha: orden.fecha || "",
    centro_costo_codigo: orden.centro_costo_codigo || "",
    cuenta_contable_codigo: orden.cuenta_contable_codigo || "",
    tipo_orden: orden.tipo_orden || "Afecto",
    tipo_compra: orden.tipo_compra || "Servicios",
    moneda: orden.moneda || "CLP",
    monto_neto: orden.monto_neto || "",
    monto_iva: orden.monto_iva || "",
    monto_total: orden.monto_total || "",
    documentos_respaldo: orden.documentos_respaldo || [],
  });
  const [numCuotas, setNumCuotas] = useState((orden.cuotas || []).length || 1);
  const [cuotas, setCuotas] = useState((orden.cuotas || []).length ? orden.cuotas : distribuirCuotas(1, orden.monto_neto || 0));
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const setMontoNeto = (e) => {
    const neto = e.target.value;
    const iva = neto ? Math.round(Number(neto) * 0.19) : "";
    const total = neto ? Math.round(Number(neto) * 1.19) : "";
    setForm((f) => ({ ...f, monto_neto: neto, monto_iva: iva, monto_total: total }));
    setCuotas(distribuirCuotas(numCuotas, neto || 0));
  };
  const setNumCuotasField = (e) => {
    const n = Math.max(1, Number(e.target.value) || 1);
    setNumCuotas(n);
    setCuotas(distribuirCuotas(n, form.monto_neto || 0));
  };

  const agregarProyecto = async () => {
    const nombre = window.prompt("Nombre del nuevo proyecto:");
    if (!nombre || !nombre.trim()) return;
    try {
      const { proyecto } = await api("proyectos", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombre.trim(), empresa_id: empresaId }),
      });
      refreshProyectos();
      if (refreshProyectosTodos) refreshProyectosTodos();
      setForm((f) => ({ ...f, proyecto_id: proyecto.id }));
    } catch (e) {
      notify("err", e.message);
    }
  };

  const guardar = async () => {
    if (!form.proveedor_id) return notify("err", "Selecciona un proveedor");
    setSaving(true);
    try {
      await api("ordenes?id=" + orden.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...form, cuotas }),
      });
      notify("ok", "OC actualizada");
      onSaved();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

  // Guarda los cambios y de una vez pasa la OC de Borrador a Pendiente
  // aprobación (genera el PDF), para no obligar a guardar como borrador y
  // despues buscar por otro lado como "generarla" -- antes esa opcion no
  // existia dentro de Editar y una OC en Borrador quedaba sin forma de
  // avanzar de estado.
  const generarOrden = async () => {
    if (!form.proveedor_id) return notify("err", "Selecciona un proveedor");
    setSaving(true);
    // Si la division en cuotas (el PUT de mas abajo) ya se ejecuto con exito
    // pero algo despues falla (ej. subir uno de los PDF), la fila original ya
    // quedo mutada en la base de datos (su numero_oc ya lleva el sufijo "-1",
    // su cuotas quedo vacio) -- un segundo clic en "Generar OC" volveria a
    // llamar al mismo PUT y el backend (no es idempotente en este paso)
    // volveria a dividir esa fila YA dividida, anidando un nuevo sufijo sobre
    // el que ya tiene y dejando filas huerfanas cuyos montos no cuadran con
    // el total original -- no es un simple choque de numero_oc identico, es
    // peor: pasa silencioso, sin error de duplicado que lo delate. Por eso,
    // si la falla ocurre despues de ese punto, se cierra el modal y se
    // refresca el listado (onSaved) en vez de dejarlo abierto invitando a
    // reintentar sobre datos ya desactualizados.
    let sePartioEnCuotas = false;
    try {
      const proveedor = proveedores.find((p) => p.id === form.proveedor_id);

      if (cuotas.length > 1) {
        const respuesta = await api("ordenes?id=" + orden.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...form, cuotas, estado: "Pendiente aprobación" }),
        });
        const ordenesCreadas = respuesta.ordenes;
        sePartioEnCuotas = true;
        if (proveedor) {
          for (const fila of ordenesCreadas) {
            await generarYAdjuntarPdf(fila, proveedor, empresa);
          }
        }
        notify(respuesta.correoError ? "warn" : "ok",
          "OC generada en " + ordenesCreadas.length + " cuotas (" + ordenesCreadas.map((o) => o.numero_oc).join(", ") + ")"
          + (respuesta.correoError ? " — aviso a aprobador no enviado: " + respuesta.correoError : " — aviso enviado a aprobador"));
        onSaved();
        return;
      }

      const cuerpo = { ...form, cuotas, estado: "Pendiente aprobación" };
      if (proveedor) {
        const datosParaPdf = { ...orden, ...cuerpo };
        const pdfBlob = await generarPdfOC(datosParaPdf, proveedor, cuotas, empresa);
        const pdfBase64 = await fileToBase64(new File([pdfBlob], "OC.pdf", { type: "application/pdf" }));
        const up = await api("upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: orden.numero_oc + ".pdf", base64: pdfBase64 }),
          timeoutMs: 25000,
        });
        cuerpo.archivo_oc_url = up.url;
        cuerpo.archivo_oc_nombre = orden.numero_oc + ".pdf";
      }
      const { correoError } = await api("ordenes?id=" + orden.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cuerpo),
      });
      notify(correoError ? "warn" : "ok",
        "OC generada: " + orden.numero_oc + (correoError ? " — aviso a aprobador no enviado: " + correoError : " — aviso enviado a aprobador"));
      onSaved();
    } catch (e) {
      notify("err", e.message + (sePartioEnCuotas ? " — la OC ya quedó dividida en cuotas, revisa el listado antes de reintentar" : ""));
      if (sePartioEnCuotas) onSaved();
    } finally {
      setSaving(false);
    }
  };

// Edita los datos compartidos de una OC dividida en cuotas (proveedor, N° de
// cotización, título, descripción, condiciones, proyecto, centro de costo,
// cuenta contable, documentos de respaldo) aplicando el cambio a las N
// cuotas a la vez -- son los mismos campos que se copian identicos a cada
// fila al dividir (ver Cambio 2 en 2026-09-29-ordenes-en-cuotas-design.md).

// fila independiente con su propio monto/estado.
function EditarGrupoModal({ grupo, proveedores, catalogos, proyectos, refreshProyectos, refreshProyectosTodos, empresaId, notify, onClose, onSaved }) {
  const [form, setForm] = useState({
    proveedor_id: grupo.proveedor_id || "",
    numero_cotizacion: grupo.numero_cotizacion || "",
    proyecto_id: grupo.proyecto_id || "",
    titulo: grupo.titulo || "",
    descripcion: grupo.descripcion || "",
    condiciones: grupo.condiciones || "",

    centro_costo_codigo: grupo.centro_costo_codigo || "",
    cuenta_contable_codigo: grupo.cuenta_contable_codigo || "",
    tipo_orden: grupo.tipo_orden || "Afecto",
    tipo_compra: grupo.tipo_compra || "Servicios",
    moneda: grupo.moneda || "CLP",
    documentos_respaldo: grupo.documentos_respaldo || [],
  });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

  const agregarProyecto = async () => {
    const nombre = window.prompt("Nombre del nuevo proyecto:");
    if (!nombre || !nombre.trim()) return;
    try {
      const { proyecto } = await api("proyectos", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre: nombre.trim(), empresa_id: empresaId }),
      });
      refreshProyectos();
      if (refreshProyectosTodos) refreshProyectosTodos();
      setForm((f) => ({ ...f, proyecto_id: proyecto.id }));
    } catch (e) {
      notify("err", e.message);
    }
  };

  const guardar = async () => {
    if (!form.proveedor_id) return notify("err", "Selecciona un proveedor");
    setSaving(true);
    try {
      await Promise.all(grupo._hijos.map((hijo) =>
        api("ordenes?id=" + hijo.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(form),
        })
      ));
      notify("ok", "Las " + grupo._hijos.length + " cuotas de " + grupo.numero_oc_visible + " se actualizaron");
      onSaved();
    } catch (e) {
      notify("err", e.message);
    } finally {
      setSaving(false);
    }
  };

      ),
      h("div", { className: "hint", style: { marginBottom: 14 } },
        "Estos cambios se aplican a las " + grupo._hijos.length + " cuotas a la vez. Los montos y el reparto en cuotas no se editan aquí."),
      h(Field, { label: "Proveedor *" },
        h(ProveedorPicker, { proveedores, value: form.proveedor_id, onChange: (id) => setForm((f) => ({ ...f, proveedor_id: id })) })),
      h("div", { className: "grid2" },
        h(Field, { label: "N° Cotización" }, h("input", { value: form.numero_cotizacion, onChange: set("numero_cotizacion") })),
        h(Field, { label: "Fecha" }, h("input", { type: "date", value: form.fecha, onChange: set("fecha") })),
      ),
      h(Field, { label: "Documentos de Respaldo (opcional)" },
        h(DocumentosRespaldoEditor, {
          documentos: form.documentos_respaldo,
          setDocumentos: (docs) => setForm((f) => ({ ...f, documentos_respaldo: docs })),
          notify,
        })),
      h(Field, { label: "Título" }, h("input", { value: form.titulo, onChange: set("titulo") })),
      h(Field, { label: "Descripción" }, h("textarea", { rows: 2, value: form.descripcion, onChange: set("descripcion") })),
      h(Field, { label: "Condiciones" }, h("textarea", { rows: 2, value: form.condiciones, onChange: set("condiciones") })),
      h("div", { className: "grid3" },
        h(Field, { label: "Tipo de Orden" },
          h("select", { value: form.tipo_orden, onChange: set("tipo_orden") },
            h("option", { value: "Afecto" }, "Afecto"),
            h("option", { value: "Exento" }, "Exento"),
          )),
        h(Field, { label: "Tipo de Compra" },
          h("select", { value: form.tipo_compra, onChange: set("tipo_compra") },
            h("option", { value: "Servicios" }, "Servicios"),
            h("option", { value: "Bienes" }, "Bienes"),
          )),
        h(Field, { label: "Moneda" },
          h("select", { value: form.moneda, onChange: set("moneda") },
            h("option", { value: "CLP" }, "CLP"),
            h("option", { value: "USD" }, "USD"),
            h("option", { value: "UF" }, "UF"),
          )),
      ),
      h("div", { className: "grid3" },
        h(Field, { label: "Centro de Costo" },
          h("select", {

function OrdenesList({ ordenes, refreshOrdenes, notify, currentUser, proveedores, catalogos, proyectos, refreshProyectos, refreshProyectosTodos, empresaId, empresa, filtroEstadoCategoria, onLimpiarFiltroEstado, usuarios }) {
  const [accion, setAccion] = useState(null);
  const [editando, setEditando] = useState(null);
  const [editandoGrupo, setEditandoGrupo] = useState(null);
  const [search, setSearch] = useState("");
  const [gruposExpandidos, setGruposExpandidos] = useState({});
  const puedeAprobar = currentUser && currentUser.nivel_aprobacion === 1;

  const eliminarOrden = async (o) => {
    if (!puedeAprobar) {
      notify("err", "Solo un administrador puede eliminar órdenes de compra.");
      return;
    }
    if (!window.confirm("¿Eliminar la OC " + (o.numero_oc_acquisys || o.numero_oc) + "? Dejará de verse en OCFast y en los informes.")) return;
    try {
      await api("ordenes?id=" + o.id, { method: "DELETE" });
      notify("ok", "OC " + o.numero_oc + " eliminada");
      refreshOrdenes();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const eliminarGrupo = async (o) => {
    if (!puedeAprobar) {
      notify("err", "Solo un administrador puede eliminar órdenes de compra.");
      return;
    }
    if (!window.confirm("¿Eliminar COMPLETA la OC " + o.numero_oc_visible + " y sus " + o._hijos.length + " cuotas? Dejará de verse en OCFast y en los informes.")) return;
    try {
      await Promise.all(o._hijos.map((hijo) => api("ordenes?id=" + hijo.id, { method: "DELETE" })));
      notify("ok", "OC " + o.numero_oc_visible + " eliminada (" + o._hijos.length + " cuotas)");
      refreshOrdenes();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const editarObservacionCuota = async (o) => {
    const valor = window.prompt("Observación de la cuota " + o.cuota_numero + "/" + o.cuota_total + ":", o.cuota_observacion || "");
    if (valor === null) return;
    try {
      await api("ordenes?id=" + o.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cuota_observacion: valor }),
      });
      refreshOrdenes();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const desaprobarOrden = async (o) => {
    if (!window.confirm("¿Desaprobar la OC " + (o.numero_oc_acquisys || o.numero_oc) + "? Volverá a estado Pendiente aprobación y se podrá editar de nuevo.")) return;
    try {
      await api("ordenes?id=" + o.id, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ estado: "Pendiente aprobación" }),
      });
      notify("ok", "OC " + o.numero_oc + " devuelta a Pendiente aprobación");
      refreshOrdenes();
    } catch (e) {
      notify("err", e.message);
    }
  };

  const ordenesConVisible = useMemo(() => {
    // El numero "base" de una OC dividida en cuotas quita el sufijo -N (ej.
    // "OC-00236-2" -> "OC-00236") para que las cuotas de una misma OC se
    // ordenen juntas, en vez de quedar intercaladas con otras OC.
    const base = (o) => {
      const visible = o.numero_oc_acquisys || o.numero_oc;
      return o.cuota_total ? visible.replace(/-\d+$/, "") : visible;
    };

    // Monto Neto total del grupo (suma del neto de todas las cuotas de una
    // misma OC) -- se muestra igual en cada cuota para dar contexto del
    // total original.
    const netoGrupo = {};
    ordenes.forEach((o) => {
      if (!o.cuota_total) return;
      const b = base(o);
      netoGrupo[b] = (netoGrupo[b] || 0) + (Number(o.monto_neto) || 0);
    });

    const conDerivados = ordenes.map((o) => {
      if (!o.cuota_total) {
        return {
          ...o,
          numero_oc_visible: o.numero_oc_acquisys || o.numero_oc,
          numero_oc_base: o.numero_oc_acquisys || o.numero_oc,
          monto_neto_grupo: Number(o.monto_neto) || 0,
          // Sin cuotas: pendiente es el neto completo hasta que se registra
          // el pago (estado Completada).
          pendiente_calc: o.estado === "Completada" ? 0 : (Number(o.monto_neto) || 0),
        };
      }
      const b = base(o);
      const totalGrupo = netoGrupo[b] || 0;
      // Saldo pendiente tras esta cuota: total del grupo menos lo acumulado
      // en las cuotas 1..n (en secuencia, sin importar si ya se facturaron).
      const acumuladoHastaEsta = ordenes
        .filter((x) => x.cuota_total && base(x) === b && (x.cuota_numero || 0) <= (o.cuota_numero || 0))
        .reduce((sum, x) => sum + (Number(x.monto_neto) || 0), 0);
      return {
        ...o,
        numero_oc_visible: o.numero_oc_acquisys || o.numero_oc,
        numero_oc_base: b,
        monto_neto_grupo: totalGrupo,
        pendiente_calc: totalGrupo - acumuladoHastaEsta,
      };
    });

    return conDerivados.sort((a, b) => {
      // Orden por N° de OC (mas nuevo primero); si comparten N° base (varias
      // cuotas de una misma OC), quedan juntas y en orden de cuota (1, 2, 3...).
      const baseCmp = b.numero_oc_base.localeCompare(a.numero_oc_base);
      if (baseCmp !== 0) return baseCmp;
      return (a.cuota_numero || 0) - (b.cuota_numero || 0);
    });
  }, [ordenes]);

  // Al entrar desde un cuadro del Dashboard (ej. "Facturadas") se acota la
  // lista a esa categoria nada mas -- el boton de navegacion "Ordenes" no
  // pasa filtro, asi que ahi siempre se ven todas.
  const ordenesFiltradas = useMemo(() => {
    if (!filtroEstadoCategoria) return ordenesConVisible;
    return ordenesConVisible.filter((o) => normalizarEstadoCategoria(o.estado) === filtroEstadoCategoria);
  }, [ordenesConVisible, filtroEstadoCategoria]);

  // Con busqueda de texto o filtro de categoria desde el Dashboard activos no
  // se agrupa -- se quiere ver la fila exacta que calza, no tener que
  // expandir un grupo para encontrarla.
  const hayFiltroActivo = !!filtroEstadoCategoria || search.trim().length > 0;

  // Agrupa las cuotas de una misma OC en una sola fila resumen (colapsada por
  // defecto); al expandirla se insertan las filas individuales justo debajo,
  // en orden de cuota.
  const filasAgrupadas = useMemo(() => {
    if (hayFiltroActivo) return ordenesFiltradas;
    const vistos = new Set();
    const resultado = [];
    ordenesFiltradas.forEach((o) => {
      if (!o.cuota_total) { resultado.push(o); return; }
      const b = o.numero_oc_base;
      if (vistos.has(b)) return;
      vistos.add(b);
      const hijos = ordenesFiltradas
        .filter((x) => x.cuota_total && x.numero_oc_base === b)
        .sort((x, y) => (x.cuota_numero || 0) - (y.cuota_numero || 0));
      const conteoPorEstado = {};
      hijos.forEach((h) => { conteoPorEstado[h.estado] = (conteoPorEstado[h.estado] || 0) + 1; });
      const indicadorEstados = Object.entries(conteoPorEstado).map(([estado, n]) => n + " " + estado).join(" · ");
      resultado.push({
        ...hijos[0],
        id: "grupo-" + b,
        _esGrupo: true,
        _grupoId: b,
        _hijos: hijos,
        _indicadorEstados: indicadorEstados,
        numero_hes: hijos.map((h) => h.numero_hes).filter(Boolean).join(", "),
        // El N° de OC visible/interno del grupo es el base sin el sufijo -N
        // de la cuota 1 (que es lo que trae hijos[0] tal cual).
        numero_oc_visible: b,
        numero_oc: hijos[0].numero_oc.replace(/-\d+$/, ""),
        numero_oc_acquisys: hijos[0].numero_oc_acquisys ? hijos[0].numero_oc_acquisys.replace(/-\d+$/, "") : null,
      });
      if (gruposExpandidos[b]) {
        hijos.forEach((h) => resultado.push({ ...h, _esHijoDeGrupo: true }));
      }
    });
    return resultado;
  }, [ordenesFiltradas, hayFiltroActivo, gruposExpandidos]);

  const centroCostoLabel = (codigo) => {
    const c = (catalogos.centrosCosto || []).find((x) => x.codigo === codigo);
    return c ? c.codigo + " — " + c.descripcion : codigo;
  };
  const cuentaContableLabel = (codigo) => {
    const c = (catalogos.cuentasContables || []).find((x) => x.codigo === codigo);
    return c ? c.codigo + " — " + c.descripcion : codigo;
  };

  const columns = useMemo(() => [
    {
      key: "archivo", label: "Cotiz.", sortable: false,
      render: (o) => o.archivo_url
        ? h("a", { className: "link", href: o.archivo_url, target: "_blank", rel: "noreferrer", title: o.archivo_nombre || "Ver cotización" }, o.numero_cotizacion || "Ver")
        : "—",
    },
    {
      key: "documentos_respaldo", label: "Respaldo", sortable: false,
      render: (o) => (o.documentos_respaldo || []).length
        ? h("span", { title: (o.documentos_respaldo || []).map((d) => d.nombre).join(", ") }, "📎 " + o.documentos_respaldo.length)
        : "—",
    },
    {
      key: "numero_oc_visible", label: "N° OC",
      render: (o) => h("div", null,

function truncar(text, maxWidth) {
  if (!text) return "—";
  return h("span", { title: text, style: { display: "inline-block", maxWidth, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", verticalAlign: "bottom" } }, text);
}
